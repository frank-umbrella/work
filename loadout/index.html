<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loadout v0.1.0</title>
<meta name="robots" content="noindex, nofollow">
<meta name="loadout-version" content="0.1.0">
<meta name="description" content="Umbrella Automation shop inventory. Restricted to @umbrellaautomation.com accounts.">
<meta name="theme-color" content="#1e6fd9">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loadout">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Umbrella Automation">
<meta property="og:title" content="Loadout">
<meta property="og:description" content="Shelf counts, wire boxes, and who has which unit. Restricted to @umbrellaautomation.com accounts.">
<meta property="og:image" content="og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Loadout">
<meta name="twitter:description" content="Shelf counts, wire boxes, and who has which unit.">
<meta name="twitter:image" content="og-image.png">
<script src="qr.js"></script>
<style>
/* Ledger (direction B in design-preview.html): light business palette that
   sits beside Backup Audits and Sundial. One accent (blue), three status hues,
   status text always through the --m-*-text values checked at 4.5:1. */
:root{
  --m-bg:#f4f6f9;--m-bg2:#e9edf3;--m-card:#ffffff;--m-card2:#f1f4f8;--m-line:#dde3ea;--m-line2:#c7d0da;
  --m-text:#1a2233;--m-muted:#5b6675;--m-accent:#1e6fd9;--m-accent2:#155cb8;--m-onaccent:#ffffff;
  --m-ok:#1f9d5a;--m-warn:#d98b1e;--m-danger:#d3403a;--m-info:#1e6fd9;
  --m-ok-text:#166b3e;--m-warn-text:#8a5a14;--m-bad-text:#a82e29;--m-info-text:#1a5cb5;
  --m-topbar:#ffffff;--m-toptext:#1a2233;--m-topmuted:#5b6675;--m-brandmark:#1e6fd9;--m-navon:#e8f0fc;
  --m-font:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  --m-mono:Consolas,"Cascadia Mono",Menlo,monospace;
  --m-radius:8px;--m-tap:38px;--m-tapsm:30px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--m-bg);color:var(--m-text);font:14px/1.45 var(--m-font);overflow-x:hidden;min-height:100vh}
a{color:var(--m-accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--m-accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---------- sign-in ---------- */
#signin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.signin-card{background:var(--m-card);border:1px solid var(--m-line);border-radius:12px;padding:30px 26px;max-width:380px;width:100%;text-align:center}
.signin-card svg.mark{width:52px;height:52px;color:var(--m-brandmark)}
.signin-card h1{margin:10px 0 2px;font-size:24px}
.signin-card .sub{color:var(--m-muted);margin:0 0 20px}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;width:100%;border:1px solid var(--m-line2);background:#fff;border-radius:var(--m-radius);font-weight:600;cursor:pointer}
.gbtn:hover{border-color:var(--m-muted)}
.signin-card .domain{font-size:12.5px;color:var(--m-muted);margin-top:14px}
.signin-card .err{margin-top:12px;color:var(--m-bad-text);font-size:13px}
.signin-card .demo{display:inline-flex;align-items:center;min-height:44px;margin-top:6px}

/* ---------- demo banner ---------- */
.demobar{background:#ffd84d;color:#1a2233;font-size:13px;font-weight:600;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;justify-content:center;padding:6px 16px;text-align:center}
.demobar a{color:#1a2233;display:inline-flex;align-items:center;min-height:32px}

/* ---------- app chrome ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px 14px;padding:8px 18px;background:var(--m-topbar);color:var(--m-toptext);border-bottom:1px solid var(--m-line);flex-wrap:wrap;min-height:58px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;letter-spacing:.01em}
.brand svg{width:26px;height:26px;flex:none;color:var(--m-brandmark)}
.brand .v{font:500 11px var(--m-mono);color:var(--m-topmuted);border:1px solid var(--m-line);border-radius:4px;padding:1px 5px;letter-spacing:0}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav button{background:none;border:0;color:var(--m-topmuted);padding:7px 12px;border-radius:var(--m-radius);font-size:14px;cursor:pointer;min-height:36px}
.nav button:hover{color:var(--m-toptext)}
/* the darker accent on the tinted pill keeps 4.5:1 (the base accent reads 4.2:1 there) */
.nav button.on{color:var(--m-accent2);background:var(--m-navon);font-weight:600}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--m-topmuted);border:1px solid var(--m-line);border-radius:999px;padding:3px 10px;margin-left:auto;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--m-ok)}
.sync.off i{background:var(--m-danger)}
.sync.busy i{background:var(--m-warn)}
.sync.demo i{background:var(--m-muted)}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--m-topmuted)}
.who span{border:1px solid var(--m-line);border-radius:999px;padding:3px 10px;overflow-wrap:anywhere}
.locchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 4px 2px 10px;border-radius:999px;border:1px solid var(--m-line);color:var(--m-text);background:var(--m-card2);max-width:100%}
.locchip b{font-weight:600;overflow-wrap:anywhere}
.locchip button{border:0;background:none;color:var(--m-muted);cursor:pointer;min-width:28px;min-height:28px;border-radius:50%;font-size:16px;line-height:1}
.body{max-width:1280px;margin:0 auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.foot{max-width:1280px;margin:0 auto;padding:10px 18px 24px;font-size:12px;color:var(--m-muted);display:flex;gap:6px 16px;flex-wrap:wrap}
.tabbar{display:none}

/* ---------- building blocks ---------- */
.mcard{background:var(--m-card);border:1px solid var(--m-line);border-radius:var(--m-radius);padding:16px 18px;min-width:0}
/* uppercase labels with light tracking (.04em): they read as field labels beside dense numbers */
.h4,.mcard h4{margin:0 0 10px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--m-muted);font-weight:600}
h2.vt{margin:0;font-size:22px;font-weight:700;line-height:1.2}
.thead{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-bottom:10px}
.thead h4{margin:0}
.thead .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--m-mono)}
.z{color:var(--m-muted)}
.hint{font-size:12px;color:var(--m-muted);margin:6px 0 0}
.err{color:var(--m-bad-text);font-size:13px;margin:6px 0 0}
.lab{display:block;font-size:12px;color:var(--m-muted);margin:10px 0 4px;font-weight:600}
.lab abbr{text-decoration:none;cursor:help;border-bottom:1px dotted var(--m-muted)}
.fld{width:100%;min-height:var(--m-tap);background:var(--m-card);color:var(--m-text);border:1px solid var(--m-line2);border-radius:var(--m-radius);padding:6px 11px;font-size:14px}
textarea.fld{min-height:76px;resize:vertical}
.fld::placeholder{color:#6b7480}
.fld[disabled]{background:var(--m-card2);color:var(--m-muted)}
select.fld{appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--m-muted) 50%),linear-gradient(135deg,var(--m-muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
/* attention glow (Playbook rule for unset decision dropdowns): stays on, pulses three times on load, then rests */
.fld.glow{border-color:var(--m-warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--m-warn) 30%,transparent);animation:glow 2.2s ease-in-out 3}
@keyframes glow{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--m-warn) 14%,transparent)}}
@media (prefers-reduced-motion:reduce){.fld.glow{animation:none}}
.money{position:relative}
.money .fld{padding-left:24px}
.money:before{content:"$";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--m-muted);pointer-events:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:0 14px}
.chk{display:flex;align-items:center;gap:10px;min-height:38px;cursor:pointer;font-size:14px}
.chk input{width:18px;height:18px;flex:none;accent-color:var(--m-accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:var(--m-tap);border:1px solid var(--m-line2);background:var(--m-card2);color:var(--m-text);border-radius:var(--m-radius);padding:0 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--m-muted)}
.btn.acc{background:var(--m-accent);border-color:var(--m-accent);color:var(--m-onaccent)}
.btn.acc:hover{background:var(--m-accent2)}
.btn.sm{min-height:var(--m-tapsm);padding:0 10px;font-size:12.5px}
.btn.danger{color:var(--m-bad-text);border-color:color-mix(in srgb,var(--m-danger) 50%,var(--m-line))}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.linkbtn{background:none;border:0;padding:0;color:var(--m-text);cursor:pointer;text-align:left;font:inherit}
.linkbtn:hover .pn{text-decoration:underline}
.textbtn{background:none;border:0;padding:0 2px;color:var(--m-accent);cursor:pointer;font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px;min-height:30px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btnrow.end{justify-content:flex-end}

.st{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--m-muted);background:color-mix(in srgb,var(--m-muted) 14%,transparent)}
.st.ok{color:var(--m-ok-text);background:color-mix(in srgb,var(--m-ok) 14%,transparent)}
.st.warn{color:var(--m-warn-text);background:color-mix(in srgb,var(--m-warn) 16%,transparent)}
.st.bad{color:var(--m-bad-text);background:color-mix(in srgb,var(--m-danger) 13%,transparent)}
.st.info{color:var(--m-info-text);background:color-mix(in srgb,var(--m-info) 14%,transparent)}
.st.big{font-size:14px;padding:4px 13px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;border:1px solid var(--m-line);background:var(--m-card2);font-size:12px;color:var(--m-text);max-width:100%;overflow-wrap:anywhere}
.chip i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--m-muted)}
.chip.ok i{background:var(--m-ok)}
.chip.warn{border-color:color-mix(in srgb,var(--m-warn) 55%,var(--m-line));color:var(--m-warn-text)}
.chip.warn i{background:var(--m-warn)}
.chip.info i{background:var(--m-info)}

/* segmented tabs */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--m-card2);border:1px solid var(--m-line);border-radius:var(--m-radius);padding:3px;max-width:100%}
.seg button{border:0;background:none;padding:5px 11px;border-radius:calc(var(--m-radius) - 2px);font-size:13px;cursor:pointer;white-space:nowrap;color:var(--m-text);min-height:32px}
.seg button b{font-weight:600;color:var(--m-muted);margin-left:5px;font-size:12px;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--m-accent);color:var(--m-onaccent);font-weight:600}
.seg button.on b{color:inherit}
.seg button.warnt b{color:var(--m-warn-text)}
.seg button.on.warnt b{color:inherit}
.search{flex:1 1 220px;width:auto;min-width:0}

/* ---------- tables (card-stack under 640px of container width) ---------- */
.tblwrap{container-type:inline-size;min-width:0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--m-muted);font-weight:600;border-bottom:1px solid var(--m-line);padding:0;text-align:left;white-space:nowrap}
.tbl th .thb{background:none;border:0;padding:8px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center;width:100%;justify-content:inherit}
.tbl th.r .thb{justify-content:flex-end}
.tbl th .sa{font-size:9px;color:var(--m-accent);min-width:8px}
.tbl th.plain{padding:8px}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--m-line);vertical-align:top;min-width:0;overflow-wrap:anywhere}
.tbl td.nw{white-space:nowrap}
.tbl td.act{white-space:nowrap;text-align:right}
.tbl td.act .btn+.btn{margin-left:6px}
.tbl tr.need td{background:color-mix(in srgb,var(--m-warn) 9%,transparent)}
/* left stripe on a .need row marks a real state (below par / needs attention), not decoration */
.tbl tr.need td:first-child{box-shadow:inset 3px 0 0 var(--m-warn)}
.tbl tr.dim td{color:var(--m-muted)}
.tbl tr.skel td{padding:12px 8px}
.skelbar{display:block;height:12px;border-radius:4px;background:var(--m-bg2)}
.pn{font-weight:500}
.pn b{font-weight:700}
.pd{font-size:12px;color:var(--m-muted);margin-top:1px}
.unit{font-size:11px;color:var(--m-muted);margin-left:2px}
.locs{font-size:12.5px;color:var(--m-muted)}
.locs b{color:var(--m-text);font-weight:600}
@container (max-width:640px){
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border:1px solid var(--m-line);border-radius:var(--m-radius);margin-bottom:10px;padding:6px 10px;background:var(--m-card)}
  .tbl td{border:0;padding:4px 0 4px 104px;position:relative;text-align:left!important;min-height:26px}
  .tbl td:before{content:attr(data-l);position:absolute;left:0;top:6px;width:96px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--m-muted);font-weight:600}
  .tbl td.full{padding-left:0}
  .tbl td.full:before{display:none}
  .tbl td.act{white-space:normal;padding-top:8px;padding-left:0}
  .tbl td.act:before{display:none}
  .tbl td.act .btn{margin:0 6px 6px 0}
  .tbl td.act .btn+.btn{margin-left:0}
  .tbl td .st{white-space:normal}
  .tbl tr.need{box-shadow:inset 3px 0 0 var(--m-warn)}
  .tbl tr.need td:first-child{box-shadow:none}
  .tbl tr.skel td{padding-left:0}
}
.empty{padding:22px 8px;text-align:center;color:var(--m-muted)}
.empty p{margin:0 0 10px;color:var(--m-text)}
.loadmsg{font-size:13px;color:var(--m-muted);margin:8px 0 0}
.errbox{border:1px solid color-mix(in srgb,var(--m-danger) 45%,var(--m-line));background:color-mix(in srgb,var(--m-danger) 6%,var(--m-card));border-radius:var(--m-radius);padding:14px 16px;color:var(--m-bad-text)}
.errbox p{margin:0 0 10px}

/* ---------- stat strip ---------- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:10px}
.sv{background:var(--m-card2);border:1px solid var(--m-line);border-radius:var(--m-radius);padding:10px 12px;min-width:0}
.sv .k{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--m-muted);font-weight:600}
.sv .v{display:block;font-size:26px;font-weight:700;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.sv .u{font-size:12px;color:var(--m-muted)}
.sv.warn{border-color:color-mix(in srgb,var(--m-warn) 55%,var(--m-line))}
.sv.warn .v{color:var(--m-warn-text)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px 16px;margin:12px 0 0}
.meta div{min-width:0}
.meta dt{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--m-muted);font-weight:600}
.meta dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.meta dd small{display:block;font-weight:400;color:var(--m-muted);font-size:12px}

/* ---------- consumables (by the foot) ---------- */
.cons{border:1px solid var(--m-line);border-radius:var(--m-radius);padding:12px 14px;margin-top:12px;background:var(--m-card)}
.cons.low{border-color:var(--m-warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--m-warn) 18%,transparent)}
.chead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.chead .pn{font-size:15px}
.chead .tot{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chead .tot .n{font-size:18px;font-weight:700}
.ctr{margin-top:10px;border-top:1px dashed var(--m-line);container-type:inline-size}
.crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,2fr) 80px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--m-line);font-size:13px}
.crow:last-child{border-bottom:0}
.crow .cl{font-weight:600;min-width:0;overflow-wrap:anywhere;font-family:var(--m-mono)}
.crow .loc,.crow .rd{color:var(--m-muted);min-width:0;overflow-wrap:anywhere}
.crow .ft{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bar{display:block;height:10px;border-radius:999px;background:var(--m-card2);border:1px solid var(--m-line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--m-ok)}
.bar.lo i{background:var(--m-warn)}
@container (max-width:640px){
  .crow{grid-template-columns:minmax(0,1fr) auto}
  .crow .bar{grid-column:1/-1}
  .crow .rd{text-align:right}
  .crow .go{grid-column:1/-1}
  .crow .go .btn{width:100%}
}

/* ---------- timeline ---------- */
.tl{list-style:none;margin:0;padding:0;container-type:inline-size}
.tl li{display:grid;grid-template-columns:128px 90px 84px minmax(0,1fr);gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--m-line);font-size:13px;align-items:baseline}
.tl li:last-child{border-bottom:0}
.tl .when{color:var(--m-muted);font-size:12px;white-space:nowrap}
.tl .by{font-weight:600;overflow-wrap:anywhere}
.tl .what{min-width:0;overflow-wrap:anywhere}
.mv{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--m-muted)}
.mv.pick,.mv.transfer,.mv.checkout{color:var(--m-info-text)}
.mv.receive,.mv.checkin{color:var(--m-ok-text)}
.mv.reading,.mv.cut,.mv.adjust{color:var(--m-warn-text)}
@container (max-width:520px){
  .tl li{grid-template-columns:auto auto minmax(0,1fr)}
  .tl .what{grid-column:1/-1}
}

/* ---------- scan ---------- */
.scangrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.scangrid{grid-template-columns:minmax(0,1fr)}}
.cam{position:relative;height:280px;border-radius:calc(var(--m-radius) + 4px);overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#39424c 0,#1b2026 48%,#090a0c 100%)}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .box{position:absolute;left:14%;right:14%;top:22%;bottom:26%;border:2px solid rgba(255,255,255,.92);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.28);pointer-events:none}
.cam .laser{position:absolute;left:18%;right:18%;top:47%;height:2px;background:var(--m-accent);opacity:.9;pointer-events:none}
.cam .read{position:absolute;left:50%;bottom:30%;transform:translate(-50%,50%);font:600 11px var(--m-mono);background:rgba(0,0,0,.65);color:#fff;padding:2px 8px;border-radius:999px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.cam .camhint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12.5px;color:#fff;text-shadow:0 1px 2px #000;padding:0 10px}
.cam .torch{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.5);display:grid;place-items:center;color:#fff;cursor:pointer}

.bignum{display:flex;align-items:center;gap:10px}

.toast{position:fixed;left:50%;top:66px;transform:translate(-50%,-8px);z-index:200;background:#1a2233;color:#fff;padding:10px 16px;border-radius:var(--m-radius);font-size:14px;font-weight:600;max-width:min(92vw,520px);text-align:center;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}

.sheet.s5163{padding:.5in .15625in 0;display:grid;grid-template-columns:repeat(2,4in);grid-auto-rows:2in;column-gap:.1875in;align-content:start}

<script type="module">
/* ==============================================================
   Loadout - shop inventory for Umbrella Automation (work/loadout)
   Single-file app. Shares the Watchtower project (watchtower-6fbe1)
   and its Google sign-in, like Backup Audits and Sundial. Data lives
   in loadout_* collections; rules are in watchtower/firestore.rules.
   ============================================================== */
const VERSION = "0.1.0";
const SDK = "https://www.gstatic.com/firebasejs/12.13.0/";
const XLSX_URL = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
/* @zxing/library is not on cdnjs, so the fallback decoder comes from jsDelivr,
   the same CDN SheetJS already loads from. Only browsers without
   BarcodeDetector (iOS Safari, desktop Firefox) ever fetch it. */
const ZXING_URL = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";

/* The apiKey is public by design; access is enforced by the rules. */
const firebaseConfig = {
  apiKey:            "AIzaSyDKWHa-nmIzFvnLqF92rmzIXiSKe2HywQw",
  authDomain:        "watchtower-6fbe1.firebaseapp.com",
  projectId:         "watchtower-6fbe1",
  storageBucket:     "watchtower-6fbe1.firebasestorage.app",
  messagingSenderId: "637038228926",
  appId:             "1:637038228926:web:e8a793889c70162f0935ef"
};
const ALLOWED_DOMAIN = "umbrellaautomation.com";
/* D2: the one account seeded as admin on first sign-in. Everyone else lands as tech. */
const ADMIN_EMAIL = "frank@umbrellaautomation.com";

const QUERY = new URLSearchParams(location.search);
const DEMO = QUERY.get("demo") === "1";
const PRINT = QUERY.get("print") === "1";

const ROLES = ["admin", "warehouse", "tech", "accounting", "board"];
const ROLE_LABEL = { admin: "Admin", warehouse: "Warehouse", tech: "Tech", accounting: "Accounting", board: "Board", none: "Paused" };
const KINDS = ["device", "patch-cable", "splitter", "connector", "wire", "other"];
const KIND_LABEL = { device: "Device", "patch-cable": "Patch cable", splitter: "Splitter", connector: "Connector", wire: "Wire", other: "Other" };
const LOC_KINDS = ["shelf", "bay", "van", "other"];
const ITEM_STATUS = { on_order: "On order", in_stock: "In stock", staged: "Staged", checked_out: "Checked out", installed: "Installed", returned: "Returned", retired: "Retired" };
const MV_LABEL = { receive: "Receive", pick: "Pick", stage: "Stage", deliver: "Deliver", adjust: "Adjust", reading: "Reading", cut: "Cut", checkout: "Check out", checkin: "Check in", return: "Return", transfer: "Move", edit: "Edit" };
const ADJUST_REASONS = ["Recount", "Damaged", "Lost", "Found", "Used on a job", "Returned by a client", "Other"];
const CONDITIONS = { good: "Good", damaged: "Damaged", missing: "Missing parts" };
const DEFAULT_GENERAL = {
  showCosts: false,
  qrThreshold: 250,
  labelSize: "5160",
  carriers: [
    { name: "UPS", url: "https://www.ups.com/track?tracknum={n}" },
    { name: "FedEx", url: "https://www.fedex.com/fedextrack/?trknbr={n}" },
    { name: "USPS", url: "https://tools.usps.com/go/TrackConfirmAction?tLabels={n}" }
  ],
  vendors: [],
  /* D16: default start length by cable type. A box whose feet left is
     already higher than its default takes its feet left as the start. */
  boxStart: { cat: 1000, coax: 1000, audio: 500, stranded: 500, other: 1000 }
};
const BOX_TYPES = [
  { k: "cat", label: "Cat5e and Cat6" },
  { k: "coax", label: "Coax (RG6, RG59, CATV)" },
  { k: "audio", label: "Audio and speaker" },
  { k: "stranded", label: "Stranded" },
  { k: "other", label: "Anything else" }
];
/* D4 and D5: staging bays and vans exist from day one. */
const SEED_LOCATIONS = [
  { id: "bay-1", area: "Bay 1", shelf: "", kind: "bay" },
  { id: "bay-2", area: "Bay 2", shelf: "", kind: "bay" },
  { id: "bay-3", area: "Bay 3", shelf: "", kind: "bay" },
  { id: "bay-4", area: "Bay 4", shelf: "", kind: "bay" },
  { id: "van-1", area: "Van 1", shelf: "", kind: "van" },
  { id: "van-2", area: "Van 2", shelf: "", kind: "van" }
];

/* ---------------- state ---------------- */
const S = {
  user: null, role: "tech", me: null,
  products: new Map(), locations: new Map(), stock: new Map(), containers: new Map(),
  items: new Map(), users: new Map(), movements: [],
  general: Object.assign({}, DEFAULT_GENERAL),
  loaded: {}, errors: {},
  view: "stock", stockTab: "all", itemsTab: "out", moreTab: "movements",
  search: "", activeLoc: null, pendingUpcFor: null,
  prefs: {}, pending: 0, online: navigator.onLine,
  mvFilter: { type: "", person: "", q: "", from: "", to: "" },
  scan: null
};
const COLLS = ["products", "locations", "stock", "containers", "items", "users", "movements", "settings"];

/* ---------------- tiny helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const fmtN = v => num(v).toLocaleString("en-US", { maximumFractionDigits: 2 });
const money = v => "$" + num(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const isWriter = () => S.role === "admin" || S.role === "warehouse";
const isTech = () => isWriter() || S.role === "tech";
const isAdmin = () => S.role === "admin";
function toDate(v) {
  if (!v) return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  if (typeof v.toDate === "function") return v.toDate();
  if (typeof v === "object" && "seconds" in v) return new Date(v.seconds * 1000);
  const d = new Date(v); return isNaN(d) ? null : d;
}
const pad = n => String(n).padStart(2, "0");
function fmtDate(v) { const d = toDate(v); return d ? pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + "/" + d.getFullYear() : ""; }
function fmtShort(v) { const d = toDate(v); return d ? pad(d.getMonth() + 1) + "/" + pad(d.getDate()) : ""; }
function fmtWhen(v) {
  const d = toDate(v); if (!d) return "";
  let h = d.getHours(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return fmtDate(d) + " " + h + ":" + pad(d.getMinutes()) + " " + ap;
}
function isoDay(v) { const d = toDate(v); return d ? d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) : ""; }
function daysSince(v) { const d = toDate(v); return d ? Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000)) : null; }
function slug(s) {
  return String(s || "").toLowerCase().replace(/&/g, " and ").replace(/["'\/]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").replace(/-{2,}/g, "-");
}
function clean(v) {
  if (v == null) return "";
  if (typeof v === "number") return Number.isInteger(v) ? String(v) : String(+v.toFixed(4));
  if (v instanceof Date) return isoDay(v);
  const s = String(v).replace(/\s+/g, " ").trim();
  return /^(n\/?a|none|-+)$/i.test(s) ? "" : s;
}
function shortId(id) { return String(id || "").slice(-6).toUpperCase(); }
function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/* ---------------- names that travel with records (PLAN 16, rule 3) ---------------- */
function productName(p) {
  if (!p) return "";
  if (p.name) return p.name;
  return [p.brand, p.model].filter(Boolean).join(" ") || p.type || "Unnamed product";
}
function locName(id) { const l = S.locations.get(id); return l ? l.name : (id ? id : ""); }
function composeLocName(area, shelf) { return shelf ? area + ", " + shelf : area; }
function locIdFor(area, shelf) { return shelf ? slug(area) + "--" + slug(shelf) : slug(area); }
function itemLabel(it) { return it.serial ? it.serial : shortId(it.id); }

/* ---------------- on-hand ---------------- */
/* On hand = counted stock rows + open boxes' feet left + serialized units in
   stock or staged. Serialized units never sit in stock rows, so nothing is
   counted twice. */
function stockRowsFor(pid) { const out = []; S.stock.forEach(r => { if (r.productId === pid && num(r.qty) !== 0) out.push(r); }); return out; }
function openBoxesFor(pid) { const out = []; S.containers.forEach(c => { if (c.productId === pid && c.status !== "empty") out.push(c); }); return out.sort((a, b) => String(a.label).localeCompare(String(b.label))); }
function allBoxesFor(pid) { const out = []; S.containers.forEach(c => { if (c.productId === pid) out.push(c); }); return out.sort((a, b) => String(a.label).localeCompare(String(b.label))); }

const inStockItem = i => i.status === "in_stock" || i.status === "staged";
function onHandOf(p) {
  let n = 0;
  stockRowsFor(p.id).forEach(r => n += num(r.qty));
  openBoxesFor(p.id).forEach(c => n += num(c.ftLeft));

}
/* per-location breakdown: [{locationId, qty, boxes, items}] */
function byLocation(p) {
  const m = new Map();
  const get = id => { const k = id || ""; if (!m.has(k)) m.set(k, { locationId: k, qty: 0, boxes: 0, items: 0 }); return m.get(k); };
  stockRowsFor(p.id).forEach(r => { get(r.locationId).qty += num(r.qty); });
  openBoxesFor(p.id).forEach(c => { const e = get(c.locationId); e.qty += num(c.ftLeft); e.boxes++; });
  itemsFor(p.id).forEach(i => { if (inStockItem(i)) { const e = get(i.locationId); e.qty += 1; e.items++; } });

  else if (m.qty != null && m.type !== "edit") s += " " + (num(m.qty) > 0 && m.type === "adjust" ? "+" : "") + fmtN(m.qty);
  if (m.containerLabel) s += ", box " + m.containerLabel;

function mvWhat(m) {
  const parts = [];

  if (m.containerLabel) parts.push("box " + m.containerLabel);
  if (m.itemLabel) parts.push("unit " + m.itemLabel);
  if (m.cut) parts.push(fmtN(m.cut.fromMark) + " to " + fmtN(m.cut.toMark) + " ft (" + fmtN(m.cut.length) + " ft cut)");
  else if (m.qty != null && m.type !== "edit") parts.push("qty " + fmtN(m.qty));
  if (m.fromLocationName) parts.push("from " + m.fromLocationName);
  if (m.toLocationName) parts.push("to " + m.toLocationName);
  if (m.holderName && m.type === "checkout") parts.push("held by " + m.holderName);

}

/* Modals close only via the X, Cancel, the confirm button, or Escape.
   Clicking the backdrop deliberately does nothing. */
let modalStack = [];
function openModal(title, bodyHTML, footHTML, opts = {}) {
  const wrap = document.createElement("div");
  wrap.className = "modal";
  const tid = "mt" + rid();
  wrap.innerHTML =
    '<div class="mbox' + (opts.wide ? " wide" : "") + '" role="dialog" aria-modal="true" aria-labelledby="' + tid + '">' +
      '<div class="mh"><b id="' + tid + '">' + esc(title) + '</b><button type="button" class="x" data-close aria-label="Close">&times;</button></div>' +
      '<div class="mbody">' + bodyHTML + '</div>' +
      (footHTML ? '<div class="btnrow end">' + footHTML + '</div>' : "") +
    '</div>';
  wrap._onClose = opts.onClose || null;
  wrap._prevFocus = document.activeElement;
  $("#modalRoot").appendChild(wrap);
  modalStack.push(wrap);
  wrap.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => closeModal(wrap)));
  const focusable = wrap.querySelector(".mbody input:not([type=checkbox]):not([disabled]),.mbody select,.mbody textarea") || wrap.querySelector(".x");
  if (focusable && !opts.noFocus) setTimeout(() => focusable.focus(), 30);
  return wrap;
}
function closeModal(wrap) {
  if (!wrap) wrap = modalStack[modalStack.length - 1];
  if (!wrap) return;
  wrap.remove();
  modalStack = modalStack.filter(m => m !== wrap);
  if (wrap._prevFocus && document.contains(wrap._prevFocus)) { try { wrap._prevFocus.focus(); } catch (e) {} }
  if (wrap._onClose) { const f = wrap._onClose; wrap._onClose = null; f(); }
}
function closeAllModals() { while (modalStack.length) closeModal(); }
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && modalStack.length) { closeModal(); return; }

/* ---------------- QR (vendored qrcode-generator in qr.js) ---------------- */
function qrSvg(text) {
  if (typeof window.qrcode !== "function") return '<svg viewBox="0 0 10 10"><text x="0" y="6" font-size="3">QR</text></svg>';
  const q = window.qrcode(0, "M"); q.addData(text); q.make();
  const n = q.getModuleCount(), m = 2; let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += "M" + (c + m) + " " + (r + m) + "h1v1h-1z";
  return '<svg viewBox="0 0 ' + (n + m * 2) + " " + (n + m * 2) + '" shape-rendering="crispEdges" aria-hidden="true"><rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}
const PAYLOAD = { loc: id => "loadout:loc:" + id, ctr: id => "loadout:ctr:" + id, item: id => "loadout:item:" + id, prod: id => "loadout:prod:" + id };

/* ==============================================================
   DATA LAYER
   One surface for both stores. Writes are lists of ops:
     {op:"set"|"update", coll, id, data, merge}  and  {op:"add", coll, data}
   with INC(n) and NOW as placeholders. The demo store refuses every
   write; the Firestore store sends one batch per list (the persistent
   cache queues it while offline, and the sync pill counts it).
   ============================================================== */
const INC = n => ({ __inc: n });
const NOW = { __now: true };
let fb = null;      // { fs, db, auth, authMod }
let DB = null;

function demoStore() {
  return {
    start() { loadDemo(); COLLS.forEach(c => S.loaded[c] = true); scheduleRender(); },
    stop() {},
    commit(ops, what) { toast("Demo mode: not saved"); return Promise.resolve(false); },
    async getAll(coll) {
      const key = coll.replace("loadout_", "");
      if (key === "movements") return S.movements.slice();
      if (key === "settings") return [Object.assign({ id: "general" }, S.general)];
      const m = S[key]; return m ? Array.from(m.values()) : [];
    },
    async movementsWhere(field, id) { return S.movements.filter(m => m[field] === id); },
    async savePrefs() { /* demo keeps layout in memory and this browser only */ }
  };
}

function firestoreStore(user) {
  const fs = fb.fs, db = fb.db;
  let unsubs = [];
  function conv(data) {
    const out = {};
    Object.keys(data).forEach(k => {
      const v = data[k];
      if (v && typeof v === "object" && v.__inc != null) out[k] = fs.increment(v.__inc);
      else if (v === NOW) out[k] = fs.serverTimestamp();
      else out[k] = v;
    });
    return out;
  }
  function listen(name, q, onDocs) {
    S.loaded[name] = false; S.errors[name] = null;
    const u = fs.onSnapshot(q, { includeMetadataChanges: false }, snap => {
      S.loaded[name] = true; S.errors[name] = null;
      onDocs(snap.docs.map(d => Object.assign({ id: d.id }, d.data({ serverTimestamps: "estimate" }))));
      paintSync(); scheduleRender();
    }, err => {
      console.warn("Listener failed for " + name + ":", err);
      S.errors[name] = err; S.loaded[name] = true; paintSync(); scheduleRender();
    });
    unsubs.push(u);
  }
  const toMap = (key) => docs => { const m = new Map(); docs.forEach(d => m.set(d.id, d)); S[key] = m; _lastMv = null; };
  return {
    start() {
      listen("products", fs.collection(db, "loadout_products"), toMap("products"));
      listen("locations", fs.collection(db, "loadout_locations"), toMap("locations"));
      listen("stock", fs.collection(db, "loadout_stock"), toMap("stock"));
      listen("containers", fs.collection(db, "loadout_containers"), toMap("containers"));
      listen("items", fs.collection(db, "loadout_items"), toMap("items"));
      listen("users", fs.collection(db, "loadout_users"), docs => { toMap("users")(docs); const me = S.users.get(user.uid); if (me) setMe(me); });
      listen("settings", fs.collection(db, "loadout_settings"), docs => {
        const g = docs.find(d => d.id === "general");
        S.general = Object.assign({}, DEFAULT_GENERAL, g || {});
        S.general.boxStart = Object.assign({}, DEFAULT_GENERAL.boxStart, (g && g.boxStart) || {});
      });
      listen("movements", fs.query(fs.collection(db, "loadout_movements"), fs.orderBy("at", "desc"), fs.limit(500)), docs => { S.movements = docs; _lastMv = null; });
    },
    stop() { unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = []; },
    retry(name) { this.stop(); this.start(); },
    commit(ops, what) {
      if (!ops.length) return Promise.resolve(true);
      const batch = fs.writeBatch(db);
      ops.forEach(o => {
        if (o.op === "add") { batch.set(fs.doc(fs.collection(db, o.coll)), conv(o.data)); return; }
        const ref = fs.doc(db, o.coll, o.id);
        if (o.op === "set") batch.set(ref, conv(o.data), o.merge ? { merge: true } : {});
        else batch.update(ref, conv(o.data));
      });
      S.pending++; paintSync();
      return batch.commit().then(() => true).catch(err => {
        console.warn("Write failed:", what, err);
        toast("Could not save " + (what || "that change") + ". Try again.", true);
        return false;
      }).finally(() => { S.pending = Math.max(0, S.pending - 1); paintSync(); });
    },
    async getAll(coll) {
      const snap = await fs.getDocs(fs.collection(db, coll));
      return snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    },
    async movementsWhere(field, id) {
      const snap = await fs.getDocs(fs.query(fs.collection(db, "loadout_movements"), fs.where(field, "==", id)));
      return snap.docs.map(d => Object.assign({ id: d.id }, d.data({ serverTimestamps: "estimate" })));
    },
    async savePrefs(prefs) {
      try { await fs.setDoc(fs.doc(db, "users", user.uid), { loadoutLayout: prefs }, { merge: true }); }
      catch (e) { console.warn("Layout not saved:", e); }
    }
  };
}

async function doReceiveUnits(p, locId, qty, cost, serialize, serials, note) {
  const ops = [];

    for (let i = 0; i < qty; i++) {
      const id = rid() + i;
      const serial = (serials[i] || "").trim() || null;
      ops.push({ op: "set", coll: "loadout_items", id, data: {
        productId: p.id, productName: productName(p), serial, cost: cost == null ? null : cost, qr: PAYLOAD.item(id),
        status: "in_stock", locationId: locId, locationName: locName(locId), holderUid: null, holderName: null,
        jobId: null, jobName: null, ticketId: null, ticketLineId: null, checkedOutAt: null, checkedInAt: null, condition: "good",
        orderId: null, shipmentId: null, createdAt: NOW, updatedAt: NOW } });
      ops.push(mv("receive", { productId: p.id, itemId: id, itemLabel: serial || shortId(id), qty: 1, toLocationId: locId, note }));
    }
  } else {
    ops.push(stockInc(p, locId, qty));
    ops.push(mv("receive", { productId: p.id, qty, toLocationId: locId, note }));
  }
  const pd = { onHand: INC(qty), updatedAt: NOW };
  if (cost != null) pd.lastCost = cost;

async function doBox(c, markNow, cut, recount, jobName, note, locId) {
  const p = S.products.get(c.productId);
  const prevFt = num(c.ftLeft);
  const data = { ftLeft: markNow, lastMark: markNow, status: markNow <= 0 ? "empty" : "open", lastReadingAt: NOW, lastReadingBy: S.user.name };
  if (locId && locId !== c.locationId) { data.locationId = locId; data.locationName = locName(locId); data.confirmLocation = false; }
  else if (locId) data.confirmLocation = false;
  const ops = [{ op: "update", coll: "loadout_containers", id: c.id, data }];
  const delta = markNow - prevFt;
  if (recount) {

const TABLES = {};

function visibleCols(id, cols) {
  const pr = S.prefs[id];

    const v = pr.cols.map(k => cols.find(c => c.k === k)).filter(Boolean);
    if (v.length) return v;

}
function sortRows(id, cols, rows, defaultSort) {
  const pr = S.prefs[id] || {};
  const col = pr.sortKey && cols.find(c => c.k === pr.sortKey);
  const out = rows.slice();
  if (col) {
    const dir = pr.sortDir === "desc" ? -1 : 1;
    const g = col.sort || col.text || (() => "");
    out.sort((a, b) => {
      let x = g(a), y = g(b);
      if (x == null || x === "") return 1; if (y == null || y === "") return -1;
      if (x instanceof Date) x = x.getTime(); if (y instanceof Date) y = y.getTime();
      if (typeof x === "number" && typeof y === "number") return (x - y) * dir;
      return String(x).localeCompare(String(y), undefined, { numeric: true, sensitivity: "base" }) * dir;

}

function nextBoxLabel() {
  const d = new Date(), suffix = pad(d.getMonth() + 1) + String(d.getFullYear()).slice(2);
  const taken = new Set(Array.from(S.containers.values()).map(c => String(c.label).toUpperCase()));
  for (const L of "ABCDEFGHIJKLMNOPQRSTUVWXYZ") { const s = L + suffix; if (!taken.has(s)) return s; }
  return "BOX" + rid().slice(-4).toUpperCase();
}
function boxTypeOf(type, wireType) {
  const t = (String(type || "") + " " + String(wireType || "")).toLowerCase();
  if (/cat ?5e|cat ?6|cat ?5/.test(t)) return "cat";
  if (/coax|rg ?6|rg ?59|catv/.test(t)) return "coax";
  if (/audio|speaker/.test(t)) return "audio";
  if (/stranded/.test(t)) return "stranded";
  return "other";
}

/* routing on the payload prefix; a plain code is a UPC, model, or box label */
function route(code) {

  if (m) {

    else if (kind === "item") S.scan = S.items.get(id) ? { kind: "item", id } : { kind: "unknown", code };

    const c = !p && Array.from(S.containers.values()).find(x => String(x.label).toLowerCase() === q || x.id === slug(code));
    const box = !p && !c && Array.from(S.containers.values()).find(x => x.upc && x.upc === code);

function mvFiltered() {
  const f = S.mvFilter, q = f.q.trim().toLowerCase();
  const from = f.from ? new Date(f.from + "T00:00:00") : null, to = f.to ? new Date(f.to + "T23:59:59") : null;
  return S.movements.filter(m => {
    if (f.type && m.type !== f.type) return false;
    if (f.person && (m.byName || m.by) !== f.person) return false;
    const d = toDate(m.at);
    if (from && d && d < from) return false;
    if (to && d && d > to) return false;
    if (q && !mvWhat(m).toLowerCase().includes(q) && !String(m.byName || "").toLowerCase().includes(q)) return false;
    return true;
  });
}

      products.set(id, e);
    }
    e.sources.push(rec.tab + " row " + rec.row);

  }

    const kind = rec.kind, skip = why => rec.rep.skipped.push({ row: rec.row, why });
    const date = asDate(rec.date);
    if (kind === "wire") {
      const code = clean(rec.box);
      if (!code) { skip("No box code"); return; }
      const type = typeV.pick(clean(rec.type)), wireType = clean(rec.wireType), color = normColor(rec.color);
      const qv = rec.qty == null || clean(rec.qty) === "" ? 0 : Number(clean(rec.qty));
      if (!Number.isFinite(qv)) { skip("Feet left is not a number"); return; }
      const d = { kind: "wire", unit: "ft", type: type || "Wire", wireType: wireType || null, color: color || null, grade: gradeOf(type, grades) || null, category: "Wire", consumable: true, brand: "", model: "" };

    if (kind === "patch-cable") Object.assign(d, { connector1: clean(rec.c1) || null, connector2: clean(rec.c2) || null, color: normColor(rec.color) || null, length: numOrText(rec.length), lengthUnit: normLenUnit(rec.lenUnit) || null, gauge: numOrText(rec.diameter), gaugeUnit: normGaugeUnit(rec.diamUnit) || null, amps: numOrText(rec.amps) });
    if (kind === "splitter") Object.assign(d, { connector1: clean(rec.c1) || null, inputs: numOrText(rec.inputs), connector2: clean(rec.c2) || null, outputs: numOrText(rec.outputs) });
    if (kind === "connector") Object.assign(d, { sex: clean(rec.sex) || null, band: clean(rec.band) || null, pins: numOrText(rec.pins) });

  };
  return { tabs, products, locations, stock, containers, itemsNew, movements, vendors: Array.from(new Set(vendors)), grades, aliasRows, warnings, counts, fileName };

function importOps(plan) {

    plan.stock.forEach(r => { if (r.productId === p.id) n += r.qty; });

  plan.containers.forEach(c => ops.push({ op: "set", coll: "loadout_containers", id: c.id, merge: true, data: Object.assign({
    productId: c.productId, productName: c.productName, locationId: c.locationId, locationName: lname(c.locationId), label: c.label, startLength: c.startLength,
    ftLeft: c.ftLeft, lastMark: c.ftLeft, status: c.status, confirmLocation: c.confirmLocation, purchasedAt: c.purchasedAt || null, qr: PAYLOAD.ctr(c.id),
    lastReadingAt: c.asOf || NOW, lastReadingBy: "Import", pickTicketId: null, updatedAt: NOW }, c.isNew ? { createdAt: NOW, upc: null } : {}) }));
  plan.itemsNew.forEach(i => ops.push({ op: "set", coll: "loadout_items", id: i.id, data: {
    productId: i.productId, productName: i.productName, serial: null, cost: null, qr: PAYLOAD.item(i.id), status: "in_stock", locationId: i.locationId, locationName: lname(i.locationId),
    holderUid: null, holderName: null, jobId: null, jobName: null, ticketId: null, ticketLineId: null, checkedOutAt: null, checkedInAt: null, condition: i.condition,
    orderId: null, shipmentId: null, importNote: i.note, createdAt: NOW, updatedAt: NOW } }));
  plan.movements.forEach(m => ops.push(mv("adjust", Object.assign({}, m, { productName: pname(m.productId), toLocationName: lname(m.toLocationId), byName: "Import", at: m.at || NOW }))));
  if (plan.vendors.length) {

  }
  return ops;

    done += ch.length;
  }
  toast("Imported. " + fmtN(pl.counts.productsNew) + " new products, " + fmtN(pl.counts.boxes) + " boxes.");
  S.imp = null; render(true);
}
/* demo-only hooks for checking the importer and the loading and error states by script */
if (DEMO) window.Loadout = { importBuffer: (buf, name) => importLoad(buf, name || "workbook.xlsx"), state: S, render: () => render(true) };

/* ==============================================================
   CLICKS (one delegated handler; every control is a real button)
   ============================================================== */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g && !g.closest(".modal")) { go(g.dataset.go); return; }
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id;
  const P = () => S.products.get(id), I = () => S.items.get(id);
  switch (a) {
    case "sort": onSortClick(b.dataset.tbl, b.dataset.k); break;
    case "columns": openColumns(b.dataset.tbl); break;
    case "retry": if (DB && DB.retry) DB.retry(b.dataset.coll); render(true); break;
    case "go": closeAllModals(); go(b.dataset.view, b.dataset.sub); break;
    case "stockTab": S.stockTab = b.dataset.tab; go("stock", S.stockTab); break;
    case "itemsTab": S.itemsTab = b.dataset.tab; go("items", S.itemsTab); break;
    case "moreTab": S.moreTab = b.dataset.tab; go("more", S.moreTab); break;
    case "product": closeAllModals(); openProduct(id); break;
    case "scanProd": S.scan = { kind: "prod", id }; paintScanResult(); break;
    case "newProduct": { const pre = {}; if (b.dataset.upc) pre.upc = b.dataset.upc; if (b.dataset.prefill) pre.model = b.dataset.prefill; openProductForm(null, pre); break; }
    case "newLocation": openLocationForm(null); break;
    case "editLocation": openLocationForm(S.locations.get(id)); break;
    case "location": closeAllModals(); openLocation(id); break;
    case "newBox": openNewBox(P()); break;
    case "boxSheet": closeAllModals(); if (S.view === "scan") { S.scan = { kind: "ctr", id }; paintScanResult(); } else openBoxSheet(id); break;
    case "receive": openReceive(P()); break;
    case "pick": openMoveStock(P()); break;
    case "count": openCount(P()); break;
    case "item": closeAllModals(); openItem(id); break;
    case "checkout": openCheckout(I()); break;
    case "checkin": openCheckin(I()); break;
    case "moveItem": openMoveItem(I()); break;
    case "backToStock": openMoveItem(I(), true); break;
    case "nudge": nudge(I()); break;
    case "startCam": startCamera(); break;
    case "clearLoc": setActiveLoc(null); break;
    case "cancelUpc": S.pendingUpcFor = null; render(true); break;
    case "linkUpc": { const sel = $("#linkUpc"); if (!sel || !sel.value) { toast("Pick the product first.", true); return; } S.pendingUpcFor = sel.value; confirmUpc(sel.value, b.dataset.code); break; }
    case "printOne": printLabels([{ kind: b.dataset.kind, id }]); break;
    case "mvCsv": exportMvCsv(); break;
    case "mvClear": S.mvFilter = { type: "", person: "", q: "", from: "", to: "" }; render(true); break;
    case "lblAll": case "lblNone": { const grp = labelGroups().find(x => x[0] === b.dataset.g); if (grp) grp[1].forEach(x => a === "lblAll" ? S.labelSel.add(x.key) : S.labelSel.delete(x.key)); render(true); break; }
    case "lblPrint": printLabels(Array.from(S.labelSel).map(k => { const i = k.indexOf(":"); return { kind: k.slice(0, i), id: k.slice(i + 1) }; })); break;
    case "confirmUser": { const u = S.users.get(id); DB.commit([{ op: "update", coll: "loadout_users", id, data: { confirmed: true, updatedBy: S.user.email, updatedByName: S.user.name, updatedAt: NOW } }], "role for " + (u.name || u.email)).then(ok => ok && toast("Confirmed")); break; }
    case "editUser": openUser(S.users.get(id)); break;
    case "exportAll": exportAll(); break;
    case "impRefresh": collectAliases($("#v-more")); S.imp.plan = buildImportPlan(S.imp); render(true); toast("Preview updated"); break;
    case "impClear": S.imp = null; render(true); break;
    case "impGo": collectAliases($("#v-more")); S.imp.plan = buildImportPlan(S.imp);
      confirmModal("Import " + S.imp.fileName, "<p>Write " + fmtN(importOps(S.imp.plan).length) + " records: " + fmtN(S.imp.plan.counts.productsNew) + " new products, " + fmtN(S.imp.plan.counts.boxes) + " boxes, " + fmtN(S.imp.plan.counts.items) + " serialized units, and " + fmtN(S.imp.plan.counts.movements) + " movements by Import. Safe to run again later.</p>", "Import", runImport);
      break;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "stockSearch") { S.search = t.value; scheduleRender(); }
  else if (t.dataset && t.dataset.mf) { S.mvFilter[t.dataset.mf] = t.value; scheduleRender(); }
  else if (t.id === "lblQ") { S.labelQ = t.value; scheduleRender(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.mf && t.tagName === "SELECT") { S.mvFilter[t.dataset.mf] = t.value; scheduleRender(); }
  else if (t.dataset && t.dataset.lbl) { t.checked ? S.labelSel.add(t.dataset.lbl) : S.labelSel.delete(t.dataset.lbl); render(true); }
  else if (t.id === "lblSize") { S.labelSize = t.value; }
  else if (t.id === "lblEmpty") { S.labelEmpty = t.checked; render(true); }
});
window.addEventListener("hashchange", () => applyHash());
function applyHash() {
  const [v, sub] = location.hash.replace(/^#/, "").split("/");
  if (["stock", "scan", "items", "more"].includes(v)) {
    if (sub && v === "stock") S.stockTab = sub; if (sub && v === "more") S.moreTab = sub; if (sub && v === "items") S.itemsTab = sub;
    if (S.view === "scan" && v !== "scan") stopCamera();
    S.view = v; render(true);
  }
}

/* ==============================================================
   BOOT
   ============================================================== */
function setMe(me) {
  S.me = me;
  const prev = S.role;
  S.role = me.active === false ? "none" : (me.role || "tech");
  $("#footRole").textContent = "Role: " + (ROLE_LABEL[S.role] || S.role);
  if (prev !== S.role) { _moreBuilt = ""; render(true); }
}
function startApp(user) {
  S.user = user;
  loadLocalPrefs();
  try { S.activeLoc = sessionStorage.getItem("loadout.activeLoc") || null; } catch (e) {}
  $("#signin").style.display = "none";
  $("#app").hidden = false;
  $("#demoBar").hidden = !DEMO;
  $("#whoEmail").textContent = user.email;
  $("#footWho").textContent = (DEMO ? "Demo account: " : "Signed in as ") + user.email;
  $("#verBadge").textContent = "v" + VERSION; $("#footVer").textContent = "Loadout v" + VERSION;
  $("#footRole").textContent = "Role: " + (ROLE_LABEL[S.role] || S.role);
  DB = DEMO ? demoStore() : firestoreStore(user);
  DB.start();
  paintSync();
  if (location.hash) applyHash(); else { S.view = matchMedia("(max-width:640px)").matches ? "scan" : "stock"; render(true); }
  if (PRINT && DEMO) { S.labelSel = new Set(labelGroups().flatMap(g => g[1].map(x => x.key))); printLabels(Array.from(S.labelSel).map(k => { const i = k.indexOf(":"); return { kind: k.slice(0, i), id: k.slice(i + 1) }; })); }
}
function stopApp() {
  stopCamera(); if (DB) DB.stop(); DB = null;
  S.user = null; S.products = new Map(); S.locations = new Map(); S.stock = new Map(); S.containers = new Map(); S.items = new Map(); S.users = new Map(); S.movements = [];
  S.loaded = {}; S.errors = {}; S.scan = null; _moreBuilt = ""; const sc = $("#v-scan"); if (sc) { sc.innerHTML = ""; delete sc.dataset.built; }
  closeAllModals();
  $("#app").hidden = true;
  $("#signin").style.display = "flex";
}

if (DEMO) {
  /* No Firebase module is imported on this path, so nothing in demo mode can reach Firestore. */
  $("#signoutBtn").textContent = "Leave demo";
  $("#signoutBtn").addEventListener("click", () => { location.href = location.pathname; });
  const asTech = QUERY.get("role") === "tech";
  S.role = asTech ? "tech" : "admin";
  startApp(asTech ? { uid: "demo-tech", email: "tech@example.com", name: "Tech" } : { uid: "demo-warehouse", email: "warehouse@example.com", name: "Warehouse" });
  S.me = S.users.get(S.user.uid);
} else {
  $("#signin").style.display = "flex";
  const mods = await Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-auth.js"), import(SDK + "firebase-firestore.js")]);
  const appMod = mods[0], authMod = mods[1], fsMod = mods[2];
  const fbApp = appMod.initializeApp(firebaseConfig);
  const auth = authMod.getAuth(fbApp);
  const db = fsMod.initializeFirestore(fbApp, { localCache: fsMod.persistentLocalCache({ tabManager: fsMod.persistentMultipleTabManager() }) });
  fb = { fs: fsMod, db, auth, authMod };

  $("#signinBtn").addEventListener("click", async () => {
    $("#signinErr").hidden = true;
    try {
      const provider = new authMod.GoogleAuthProvider();
      provider.setCustomParameters({ hd: ALLOWED_DOMAIN, prompt: "select_account" });
      await authMod.signInWithPopup(auth, provider);
    } catch (e) {
      $("#signinErr").textContent = "Sign-in failed: " + (e.message || e);
      $("#signinErr").hidden = false;
    }
  });
  $("#signoutBtn").addEventListener("click", () => authMod.signOut(auth));

  authMod.onAuthStateChanged(auth, async user => {
    if (!user) { stopApp(); return; }
    const email = (user.email || "").toLowerCase();
    if (!email.endsWith("@" + ALLOWED_DOMAIN)) {
      await authMod.signOut(auth);
      $("#signinErr").textContent = "Sign-in must be a @" + ALLOWED_DOMAIN + " account.";
      $("#signinErr").hidden = false;
      return;
    }
    const me = { uid: user.uid, email, name: user.displayName || email.split("@")[0] };
    /* roles: the first sign-in writes the person's own doc (admin only for the D2 account; everyone else tech, unconfirmed) */
    const ref = fsMod.doc(db, "loadout_users", user.uid);
    let role = "tech";
    try {
      const snap = await fsMod.getDoc(ref);
      if (!snap.exists()) {
        role = email === ADMIN_EMAIL ? "admin" : "tech";
        await fsMod.setDoc(ref, { email, name: me.name, role, active: true, confirmed: role === "admin", addedBy: "self-sign-in", addedAt: fsMod.serverTimestamp(), lastSeen: fsMod.serverTimestamp() });
      } else {
        const d = snap.data(); role = d.active === false ? "none" : (d.role || "tech");
        fsMod.updateDoc(ref, { lastSeen: fsMod.serverTimestamp(), name: me.name }).catch(() => {});
      }
    } catch (e) { console.warn("Could not read the roster; using tech until it loads.", e); }
    S.role = role;
    try { const pf = await fsMod.getDoc(fsMod.doc(db, "users", user.uid)); if (pf.exists() && pf.data().loadoutLayout) { S.user = me; loadLocalPrefs(); S.prefs = Object.assign({}, pf.data().loadoutLayout, S.prefs); } } catch (e) {}
    startApp(me);
    if (S.prefs && Object.keys(S.prefs).length) savePrefs();
  });
}

/* admins seed the staging bays and vans (D4, D5) once the locations have loaded */
setInterval(() => {
  if (DEMO || !S.user || !isAdmin() || S._seeded || !S.loaded.locations || S.errors.locations) return;
  S._seeded = true;
  const missing = SEED_LOCATIONS.filter(l => !S.locations.has(l.id));
  if (!missing.length) return;
  const ops = [];
  missing.forEach(l => {
    const name = composeLocName(l.area, l.shelf);
    ops.push({ op: "set", coll: "loadout_locations", id: l.id, merge: true, data: { area: l.area, shelf: l.shelf, kind: l.kind, name, qr: PAYLOAD.loc(l.id), jobId: null, createdAt: NOW, updatedAt: NOW } });
    ops.push(mv("edit", { toLocationId: l.id, toLocationName: name, note: "Location created (seeded bay or van)" }));
  });
  DB.commit(ops, "the staging bays and vans");
}, 1500);
