}
/* where a product can be pulled from, default location first, then the most stock */
function pullSources(p) {
  const m = new Map();
  const get = id => { if (!m.has(id)) m.set(id, { locationId: id, qty: 0, counted: 0, items: [], boxes: [] }); return m.get(id); };
  stockRowsFor(p.id).forEach(r => { if (r.locationId && pullableLoc(r.locationId) && num(r.qty) > 0) { const e = get(r.locationId); e.qty += num(r.qty); e.counted += num(r.qty); } });
  itemsFor(p.id).forEach(i => { if (i.status === "in_stock" && i.locationId && pullableLoc(i.locationId)) { const e = get(i.locationId); e.qty += 1; e.items.push(i); } });
  openBoxesFor(p.id).forEach(c => { if (pullableLoc(c.locationId)) { const e = get(c.locationId || ""); e.qty += num(c.ftLeft); e.boxes.push(c); } });
  return Array.from(m.values()).filter(e => e.qty > 0).sort((a, b) => (b.locationId === p.defaultLocationId) - (a.locationId === p.defaultLocationId) || b.qty - a.qty);

}
/* collects line changes for one ticket and closes with one ticket update */
function tkBatch(t) {
  const cur = new Map(ticketLines(t.id).map(l => [l.id, Object.assign({}, l)]));
  const ops = [];
  return {
    ops,
    bump(l, d, extra) {
      const y = cur.get(l.id) || Object.assign({}, l); cur.set(l.id, y);
      const data = { updatedAt: NOW };
      Object.keys(d).forEach(k => { if (d[k]) { data[k] = INC(d[k]); y[k] = num(y[k]) + num(d[k]); } });
      const ex = typeof extra === "function" ? extra(y) : extra;
      if (ex) { Object.assign(data, ex); Object.assign(y, ex); }
      ops.push({ op: "update", coll: linesColl(t.id), id: l.id, data });
    },
    finish(extra) { ops.push(ticketStatusOp(t, Array.from(cur.values()), extra)); return ops; }

function lineBumpOps(t, l, d) { const b = tkBatch(t); b.bump(l, d); return b.finish(); }
/* Firestore takes 500 writes a batch; large closes and imports go in chunks.
   The demo store keeps the whole list in one refused batch so it can be read back. */
async function commitChunks(ops, what) {
  if (DEMO || ops.length <= 450) return DB.commit(ops, what);
  for (let i = 0; i < ops.length; i += 450) { if (!(await DB.commit(ops.slice(i, i + 450), what))) return false; }
  return true;
}

/* o = {from, qty, items: [unit records], box: container, bayId} */
async function doPull(t, l, o) {
  const p = lineProduct(l), bay = o.bayId || t.stagingLocationId, tf = tkBaseFields(t, l);
  const b = tkBatch(t), ops = b.ops, q = o.qty;
  if (o.box) {
    const c = o.box, from = num(c.lastMark != null ? c.lastMark : c.ftLeft), mark = from - q;
    ops.push({ op: "update", coll: "loadout_containers", id: c.id, data: { ftLeft: mark, lastMark: mark, status: mark <= 0 ? "empty" : "open", lastReadingAt: NOW, lastReadingBy: S.user.name } });
    ops.push(mv("cut", Object.assign({ productId: p.id, containerId: c.id, containerLabel: c.label, qty: -q, toLocationId: c.locationId, cut: { fromMark: from, toMark: mark, length: q }, note: "Pulled from stock" }, tf)));
    ops.push(productInc(p.id, -q));
  } else {
    const counted = q - o.items.length;
    if (counted > 0) {
      ops.push(stockInc(p, o.from, -counted), stockInc(p, bay, counted));
      ops.push(mv("pick", Object.assign({ productId: p.id, qty: counted, fromLocationId: o.from, toLocationId: bay, note: null }, tf)));
    }
    o.items.forEach(it => {
      ops.push({ op: "update", coll: "loadout_items", id: it.id, data: { status: "staged", locationId: bay, locationName: locName(bay), ticketId: t.id, ticketLineId: l.id, jobId: t.jobId || null, jobName: t.jobName || null, updatedAt: NOW } });
      ops.push(mv("pick", Object.assign({ productId: p.id, itemId: it.id, itemLabel: itemLabel(it), qty: 1, fromLocationId: it.locationId, toLocationId: bay, note: null }, tf)));
    });
  }
  const avail = availableFor(p) - q;
  b.bump(l, { qtyFromStock: q, qtyStaged: q }, y => ({ qtyToOrder: toOrderFor(y, p, num(y.qtyStaged), avail),
    pickedFromName: o.box ? "Box " + o.box.label : locName(o.from), pickedByName: S.user.name, pickedAt: NOW }));

}
async function doStage(t, l, q, note) {
  const b = tkBatch(t);
  b.ops.push(mv("stage", Object.assign({ productId: l.productId || null, productName: lineName(l), qty: q, toLocationId: t.stagingLocationId || null, note: note || "Laid out in the bay" }, tkBaseFields(t, l))));

}
/* Deliver to site: what is staged and not yet delivered leaves the bay.
   Serialized units on the line check out to the person delivering, so a
   van load of five access points is five records in one tap (PLAN 8b). */
function deliverPlan(t, l) {
  const p = lineProduct(l), q = Math.max(0, num(l.qtyStaged) - num(l.qtyDelivered));
  const items = Array.from(S.items.values()).filter(i => i.ticketId === t.id && i.ticketLineId === l.id && i.status === "staged");
  const bay = t.stagingLocationId;
  const counted = p && p.unit !== "ft" && bay ? Math.min(Math.max(0, q - items.length), stockQty(p, bay)) : 0;
  return { p, q, items, counted, bay };
}
async function doDeliver(t, l) {
  const d = deliverPlan(t, l); if (d.q <= 0) return false;
  const me = { uid: S.user.uid, name: S.user.name }, tf = tkBaseFields(t, l), b = tkBatch(t), ops = b.ops;
  d.items.forEach(it => {

      ticketId: t.id, ticketLineId: l.id, locationId: null, locationName: null, checkedOutAt: NOW, updatedAt: NOW } });
    ops.push(mv("checkout", Object.assign({ productId: it.productId, itemId: it.id, itemLabel: itemLabel(it), qty: 1, fromLocationId: it.locationId, holderUid: me.uid, holderName: me.name, note: "Delivered to site" }, tf)));
  });
  if (d.counted > 0) ops.push(stockInc(d.p, d.bay, -d.counted));
  const off = d.items.length + d.counted;
  if (d.p && off > 0) ops.push(productInc(d.p.id, -off));
  ops.push(mv("deliver", Object.assign({ productId: l.productId || null, productName: lineName(l), qty: d.q, fromLocationId: d.bay || null, holderUid: me.uid, holderName: me.name,
    note: d.items.length ? d.items.length + " serialized unit" + (d.items.length > 1 ? "s" : "") + " checked out to " + me.name : null }, tf)));

/* Close: leftovers in the bay go back to a shelf or are written off, and

function closeLeftovers(t) {

    const p = lineProduct(l); if (!p) return null;
    const items = Array.from(S.items.values()).filter(i => i.ticketId === t.id && i.ticketLineId === l.id && i.status === "staged");
    const left = Math.max(0, num(l.qtyStaged) - num(l.qtyDelivered));
    const counted = p.unit === "ft" || !bay ? 0 : Math.min(Math.max(0, left - items.length), stockQty(p, bay));

        ops.push(mv("return", Object.assign({ productId: it.productId, itemId: it.id, itemLabel: itemLabel(it), qty: 1, fromLocationId: it.locationId, toLocationId: o.locId, note: "Leftover from ticket #" + t.number + ", back to stock" }, tf(x.line))));
      } else {

  ops.push(mv("edit", Object.assign({ note: "Ticket #" + t.number + " closed" + (lo.length ? ", leftovers " + (ret ? "returned to " + locName(o.locId) : "written off: " + o.reason) : "") + (o.note ? ". " + o.note : "") }, tf(null))));
  ops.push({ op: "update", coll: "loadout_tickets", id: t.id, data: { status: "closed", summary: summarize(ticketLines(t.id)), closedAt: NOW, closedBy: S.user.email, closedByName: S.user.name, closeNote: o.note || null, updatedAt: NOW } });

/* ==============================================================
   PURCHASE ORDERS AND SHIPMENTS (0.3.0, PLAN sections 3, 4, 8)
   A PO starts as a draft that collects lines from a ticket's Order
   missing or Order and from the low-stock list's Reorder. Mark ordered
   stamps the vendor's order number; shipments carry some or all of its
   lines; Receive walks a shipment line by line into the ticket's bay or
   into stock. Order line quantities, in the product's unit:
     qtyOrdered   on the PO
     qtyShipped   on a shipment so far
     qtyReceived  scanned or tapped in
   Each order line names the ticket line it serves; the ticket line keeps
   orderLineRefs back, so the chips on a ticket read from the PO.
   ============================================================== */
const olColl = oid => "loadout_orders/" + oid + "/lines";
function orderLines(oid) { const m = S.olines.get(oid); return m ? Array.from(m.values()).sort((a, b) => num(a.sort) - num(b.sort) || String(a.id).localeCompare(String(b.id))) : []; }
function shipmentsFor(oid) { return Array.from(S.shipments.values()).filter(s => s.orderId === oid).sort((a, b) => (toDate(a.shippedAt) || 0) - (toDate(b.shippedAt) || 0)); }
function shipLineEntry(s, lid) { return (s.lines || []).find(e => e.orderLineId === lid) || null; }
function shipLineOpen(s, lid) { const e = shipLineEntry(s, lid); return e ? Math.max(0, num(e.qty) - num(e.qtyReceived)) : 0; }
function shipOpen(s) { return (s.lines || []).some(e => num(e.qty) - num(e.qtyReceived) > 0); }
const olOpen = ol => Math.max(0, num(ol.qtyOrdered) - num(ol.qtyReceived));
function olProduct(ol) { return ol && ol.productId ? S.products.get(ol.productId) || null : null; }
function olName(ol) { const p = olProduct(ol); return p ? productName(p) : ol.productName || [ol.brand, ol.model].filter(Boolean).join(" ") || "Unnamed line"; }
function olIsFt(ol) { const p = olProduct(ol); return p ? p.unit === "ft" : ol.unit === "ft"; }
function olQty(ol, n) { return fmtN(n) + (olIsFt(ol) ? " ft" : ""); }
const isBay = id => { const L = S.locations.get(id); return !!L && L.kind === "bay"; };
/* the shipment that matters for a line: the oldest one still carrying open quantity */
function olShipment(o, ol) { return shipmentsFor(o.id).find(s => shipLineOpen(s, ol.id) > 0) || null; }
/* line status is worked out from the shipments, so it never drifts from them */
function olStatus(o, ol) {
  if (!o || o.status === "draft") return "draft";
  if (num(ol.qtyOrdered) > 0 && num(ol.qtyReceived) >= num(ol.qtyOrdered)) return "received";
  const open = shipmentsFor(o.id).filter(s => shipLineOpen(s, ol.id) > 0);
  if (open.some(s => s.status === "delivered")) return "delivered";
  if (open.some(s => s.status === "out_for_delivery")) return "out_for_delivery";
  if (open.length) return "shipped";
  return ol.status === "backordered" ? "backordered" : "ordered";
}
/* expected date: the shipment's, or the vendor's ETA on a backorder */
function olExpected(o, ol) { const s = olShipment(o, ol); if (s && s.expectedAt) return toDate(s.expectedAt); return ol.eta ? toDate(ol.eta) : null; }
function olLate(o, ol) { const st = olStatus(o, ol), e = olExpected(o, ol); return !!e && st !== "delivered" && st !== "received" && isoDay(e) < isoDay(new Date()); }
function daysLate(d) { const a = new Date(); a.setHours(0, 0, 0, 0); const b = new Date(d); b.setHours(0, 0, 0, 0); return Math.round((a - b) / 86400000); }

function orderStatusFrom(o, lines) {
  if (o.status === "draft" || o.status === "cancelled") return o.status;
  if (lines.length && lines.every(l => num(l.qtyReceived) >= num(l.qtyOrdered))) return "received";
  if (lines.some(l => num(l.qtyReceived) > 0)) return "partial";
  return "ordered";
}
function ordSummary(o) { return S.olinesLoaded.has(o.id) ? orderSummaryOf(orderLines(o.id)) : Object.assign({ lines: 0, qtyOrdered: 0, qtyReceived: 0 }, o.summary || {}); }
function ordDnr(o) { return o.status !== "received" && o.status !== "cancelled" && shipmentsFor(o.id).some(s => s.status === "delivered" && shipOpen(s)); }
function ordPill(o, big) {
  if (ordDnr(o)) return '<span class="st warn' + (big ? " big" : "") + '" title="A shipment on this PO is marked delivered and has not been received in Loadout. Find the box and press Receive.">Delivered, not received</span>';
  return '<span class="st ' + (ORD_PILL[o.status] || "") + (big ? " big" : "") + '">' + esc(ORD_LABEL[o.status] || o.status) + "</span>";
}
function ordFor(o) { return o.ticketId ? [o.clientName, o.jobName].filter(Boolean).join(", ") || "Ticket #" + (o.ticketNumber || o.ticketId) : "Stock"; }
/* PLAN 4: 1Z = UPS, 20 to 22 digits starting with 9 = USPS, 12 or 15 digits = FedEx */
function detectCarrier(n) {
  const s = String(n || "").replace(/[\s-]+/g, "").toUpperCase();
  if (!s) return "";
  if (/^1Z/.test(s)) return "UPS";
  if (/^9\d{19,21}$/.test(s)) return "USPS";
  if (/^(\d{12}|\d{15})$/.test(s)) return "FedEx";

function wrap80(s) {

  s.split(/\s+/).forEach(w => { if (line && (line + " " + w).length > 80) { out.push(line); line = w; } else line = line ? line + " " + w : w; });

function portalBlock(t) {
  const d = new Date(), lines = ticketLines(t.id), s = summarize(lines);
  const stamp = isoDay(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  const head = "[Loadout " + stamp + "] Pick ticket #" + t.number + " - " + (tkWho(t) || "no client");
  const bits = ["Staged " + s.staged + "/" + s.lines + " lines" + (t.stagingLocationId ? " in " + tkBay(t) : "") + ".", "Delivered " + s.delivered + "/" + s.lines + "."];
  const onPo = [];
  lines.forEach(l => olinksFor(t, l).forEach(x => onPo.push(lineName(l) + (x.ol ? " x" + fmtN(x.ol.qtyOrdered) + (lineIsFt(l) ? " ft" : "") : "") + ", " + olChipText(x.o, x.ol))));
  if (onPo.length) bits.push("On order: " + onPo.join("; ") + ".");
  const order = t.status === "closed" ? [] : lines.filter(l => uncovered(t, l) > 0);
  if (order.length) bits.push("To order: " + order.length + " line" + (order.length > 1 ? "s" : "") + ", no PO yet: " + order.map(l => lineName(l) + " x" + fmtN(uncovered(t, l)) + (lineIsFt(l) ? " ft" : "")).join(", ") + ".");
  else if (lines.length && !onPo.length) bits.push("Nothing to order.");

  return head + "\n" + wrap80(bits.join(" "));

function parseCSV(text) {

    else if (c === delim) { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }

function boardRows(t) {

/* ---------------- product form ---------------- */
const ATTR_FIELDS = [["connector1", "Connector 1"], ["connector2", "Connector 2"], ["color", "Color"], ["length", "Length", "number"], ["lengthUnit", "Length unit"], ["gauge", "Gauge"], ["gaugeUnit", "Gauge unit"], ["amps", "Amps", "number"], ["inputs", "Inputs", "number"], ["outputs", "Outputs", "number"], ["sex", "Sex"], ["band", "Band"], ["pins", "Pins", "number"], ["wireType", "Wire type"], ["grade", "Grade"]];
/* PLAN 12b item 1: in a slash word of short parts ("A/v", "Y/Pb/Pr"),
   an all-lowercase part beside an all-caps one is an acronym typed in a
   hurry, so it goes upper case ("A/V"). Mixed-case parts stay as typed. */
function fixSlashCase(s) {
  return String(s == null ? "" : s).replace(/\b[A-Za-z]{1,3}(?:\/[A-Za-z]{1,3})+\b/g, w => {
    const parts = w.split("/");
    if (!parts.some(x => /^[A-Z]+$/.test(x))) return w;
    return parts.map(x => /^[a-z]+$/.test(x) ? x.toUpperCase() : x).join("/");
  });
}
/* PLAN 12b item 4: the sheet's stray hyphen spacing ("Cable- Black Band",
   "Audio -Outdoor") reads as a comma in a composed name. A hyphen with no
   space beside it ("Audio-Indoor", "RCA-M") stays. The type field keeps
   what was typed; only the name changes. */
function typeLabel(t) {
  return fixSlashCase(t).replace(/\s*-\s+|\s+-\s*/g, ", ").replace(/,\s*,/g, ",").replace(/^,\s*|,\s*$/g, "").trim();
}
function composeName(d) {
  if (d.brand && d.model) return d.brand + " " + d.model;
  const bits = [d.type ? typeLabel(d.type) : KIND_LABEL[d.kind] || "Product"];
  if (d.brand) bits.push(d.brand);
  if (d.model) bits.push(d.model);
  /* a connector's sex suffix keeps its hyphen ("Edison- M" reads "Edison-M"); a comma there would split one connector in two */
  if (d.connector1 || d.connector2) bits.push([d.connector1, d.connector2].filter(Boolean).map(c => String(c).replace(/\s*-\s*/g, "-")).join(" to "));
  if (d.sex) bits.push(String(d.sex).toLowerCase());
  if (d.pins) bits.push(d.pins + " pin");
  if (d.wireType) bits.push(d.wireType);
  if (d.color) bits.push(d.color);
  if (d.length) bits.push(d.length + " " + (d.lengthUnit || "ft"));
  return bits.join(", ");
}
function productIdFor(d) {
  if (d.brand && d.model) return slug(d.brand + "-" + d.model);
  return slug([d.kind, d.type, d.brand, d.model, d.connector1, d.connector2, d.inputs, d.outputs, d.sex, d.band, d.pins, d.wireType, d.color, d.length ? d.length + (d.lengthUnit || "") : "", d.gauge ? d.gauge + (d.gaugeUnit || "") : "", d.amps ? d.amps + "a" : ""].filter(x => x !== "" && x != null).join("-"));
}

/* Receive a shipment: one row per line still open on it. Tap to take the
   quantity as shipped, or scan each unit's UPC to count it (PLAN D6). */
function openReceiveShipment(s, focusLineId) {
  const o = S.orders.get(s.orderId); if (!o) return;
  const thr = num(S.general.qrThreshold);
  const rows = (s.lines || []).map(e => {
    const ol = orderLines(o.id).find(x => x.id === e.orderLineId); if (!ol) return null;
    const open = Math.min(num(e.qty) - num(e.qtyReceived), olOpen(ol)); if (open <= 0) return null;
    const p = olProduct(ol), t = ol.ticketId ? S.tickets.get(ol.ticketId) || null : null, l = t && S.lines.get(t.id) ? S.lines.get(t.id).get(ol.ticketLineId) || null : null;
    const dest = t ? t.stagingLocationId || "" : (p && p.defaultLocationId) || "";
    const ser = !!p && p.unit !== "ft" && p.lastCost != null && num(p.lastCost) >= thr;
    return { e, ol, p, t, l, open, dest, ser, scans: 0 };
  }).filter(Boolean);
  if (!rows.length) { toast("Everything on this shipment is received.", true); return; }
  let boxN = 0;
  const boxLabel = () => { const taken = new Set(Array.from(S.containers.values()).map(c => String(c.label).toUpperCase())); const d = new Date(), suf = pad(d.getMonth() + 1) + String(d.getFullYear()).slice(2); let n = 0; for (const L of "ABCDEFGHIJKLMNOPQRSTUVWXYZ") { const x = L + suf; if (!taken.has(x)) { if (n === boxN) { boxN++; return x; } n++; } } return "BOX" + rid().slice(-4).toUpperCase(); };
  const body = '<p class="hint" style="margin-top:0">' + carrierChip(s.carrier) + " " + esc(s.tracking || "") + ", PO " + esc(o.number) + (o.vendor ? " from " + esc(o.vendor) : "") + ". Lines that serve a ticket go to its staging bay; the rest go on a shelf.</p>" +
    '<label class="lab" for="rsScan" title="A scanner that types, or the barcode on the box. The first scan of a line starts its count at 1; each scan after adds 1.">' + '<abbr>Scan a UPC</abbr></label><form class="manual" id="rsScanForm" style="margin:0" autocomplete="off"><input class="fld mono" id="rsScan" placeholder="Barcode on the box"><button type="submit" class="btn">Count</button></form><p class="hint" id="rsHint"></p>' +
    rows.map((r, i) => '<div class="rcv" id="rcv' + i + '"><div class="rhead"><b>' + esc(olName(r.ol)) + "</b>" + '<span class="z">' + esc(olQty(r.ol, r.open)) + " on this shipment</span>" +
      (r.t ? '<span class="chip info"><i></i>#' + esc(r.t.number) + " " + esc(r.ol.ticketArea || "") + "</span>" : '<span class="chip"><i></i>Stock</span>') +
      (r.ser ? '<span class="chip warn" title="At or above the QR threshold (' + esc(money(thr)) + '), so each unit gets its own record and a label to print"><i></i>Gets its own QR</span>' : "") + (!r.p ? '<span class="chip warn" title="Not in the catalog, so it is logged and staged without a stock count"><i></i>Not in the catalog</span>' : "") + "</div>" +
      '<div class="rgrid"><div><label class="lab" for="rsLoc' + i + '">' + (r.t ? "Into the bay" : "Onto") + '</label><select class="fld" id="rsLoc' + i + '" data-decide>' + locOptions(r.dest, { blankLabel: r.t ? "Choose the staging bay" : "Choose a location" }) + "</select></div>" +
      '<div><label class="lab" for="rsQty' + i + '">Quantity' + (r.p && r.p.unit === "ft" ? " (ft)" : "") + '</label><input class="fld n" id="rsQty' + i + '" type="number" min="0" step="any" inputmode="decimal" value="' + r.open + '"></div>' +
      (r.p && r.p.unit === "ft" ? '<div><label class="lab" for="rsBox' + i + '" title="The code written on the box; it goes on the QR sticker.">' + '<abbr>Box label</abbr></label><input class="fld mono" id="rsBox' + i + '" value="' + esc(boxLabel()) + '"></div>' : '<div><span class="hint" id="rsCnt' + i + '"></span></div>') + "</div></div>").join("") +
    '<p class="err" id="rsErr" hidden></p>';
  const w = openModal("Receive shipment", body, '<button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn acc" data-ok>Receive</button>', { wide: true, noFocus: true });
  wireGlow(w);
  if (focusLineId) { const i = rows.findIndex(r => r.ol.id === focusLineId); if (i >= 0) setTimeout(() => { const q = $("#rsQty" + i, w); if (q) { q.focus(); q.select(); } }, 40); }
  else setTimeout(() => $("#rsScan", w).focus(), 40);
  $("#rsScanForm", w).addEventListener("submit", ev => {
    ev.preventDefault();
    const code = $("#rsScan", w).value.trim(); $("#rsScan", w).value = ""; if (!code) return;
    const hint = $("#rsHint", w), i = rows.findIndex(r => r.p && ((r.p.upc && r.p.upc === code) || (r.p.model && r.p.model.toLowerCase() === code.toLowerCase())));
    if (i < 0) { hint.textContent = "That code matches no line on this shipment. Check the box, or type the quantity on its line."; return; }
    const r = rows[i]; r.scans++;
    $("#rsQty" + i, w).value = Math.min(r.scans, r.open);
    const c = $("#rsCnt" + i, w); if (c) c.textContent = "Counted " + r.scans + " by scan";
    hint.textContent = olName(r.ol) + ": " + r.scans + " of " + fmtN(r.open) + (r.scans > r.open ? ". That is more than this shipment carries." : ".");
  });
  w.querySelector("[data-ok]").addEventListener("click", async () => {
    const err = $("#rsErr", w), out = [];
    const fail = m => { err.textContent = m; err.hidden = false; };
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i], q = num($("#rsQty" + i, w).value), dest = $("#rsLoc" + i, w).value;
      if (q < 0 || q > r.open) return fail(olName(r.ol) + ": the quantity must be between 0 and " + fmtN(r.open) + ".");

      let bl = null;
      if (r.p && r.p.unit === "ft") { bl = ($("#rsBox" + i, w).value || "").trim().toUpperCase(); if (!bl) return fail(olName(r.ol) + ": give the box a label."); if (S.containers.has(slug(bl)) || out.some(x => x.boxLabel === bl)) return fail("Box " + bl + " already exists. Pick another label."); }
      if (r.ser && q > 200) return fail("Receive at most 200 serialized units at a time.");
      out.push({ ol: r.ol, p: r.p, t: r.t, l: r.l, q, dest, ser: r.ser, boxLabel: bl });
    }
    if (!out.length) return fail("Every quantity is zero. Type what arrived, or Cancel.");
    closeModal(w);
    const res = await doReceiveShipment(s, out);
    if (!res.ok) return;
    toast("Received " + out.length + " line" + (out.length > 1 ? "s" : "") + " on PO " + o.number);
    if (res.newItems.length) confirmModal("Print labels", "<p>" + res.newItems.length + " unit" + (res.newItems.length > 1 ? "s" : "") + " got " + (res.newItems.length > 1 ? "their" : "its") + " own QR: " + esc(res.newItems.map(x => x.label).join(", ")) + ". Print the stickers now so they go on before the units leave the bench.</p>",
      "Print " + res.newItems.length + " label" + (res.newItems.length > 1 ? "s" : ""), () => printLabels(res.newItems.map(x => ({ kind: "item", id: x.id }))));
  });
}

/* ---------------- Tracking ---------------- */
function trackRows() {
  const rows = [];
  S.orders.forEach(o => {
    if (o.status !== "ordered" && o.status !== "partial") return;
    orderLines(o.id).forEach(ol => {
      if (olOpen(ol) <= 0) return;
      const st = olStatus(o, ol); if (st === "received" || st === "draft") return;
      const s = olShipment(o, ol), t = ol.ticketId ? S.tickets.get(ol.ticketId) : null;
      const job = ol.ticketId ? (t ? tkWho(t) : [ol.clientName, ol.jobName].filter(Boolean).join(", ")) || "Ticket #" + (ol.ticketNumber || ol.ticketId) : "Stock";
      rows.push({ id: o.id + "/" + ol.id, o, ol, st, s, t, group: job, exp: olExpected(o, ol), late: olLate(o, ol), days: daysSince(o.orderedAt), dnr: st === "delivered" });
    });
  });
  return rows;
}
function trackCols() {
  return [
    { k: "product", label: "Product", sort: r => olName(r.ol).toLowerCase(), html: r => '<div class="pn">' + esc(olName(r.ol)) + '</div><div class="pd">' + (r.ol.ticketId ? '<button type="button" class="textbtn" data-act="ticket" data-id="' + esc(r.ol.ticketId) + '">#' + esc(r.ol.ticketNumber || r.ol.ticketId) + "</button> " + esc(r.ol.ticketArea || "") : "Restock") + "</div>" + (r.ol.note ? '<div class="lnote">' + esc(r.ol.note) + "</div>" : "") },
    { k: "qty", label: "Qty", r: true, title: "Still to receive", sort: r => olOpen(r.ol), html: r => '<span class="n">' + esc(olQty(r.ol, olOpen(r.ol))) + "</span>" },
    { k: "vendor", label: "Vendor", text: r => r.o.vendor || "" },
    { k: "po", label: "PO", cls: "nw", sort: r => num(r.o.number), html: r => '<button type="button" class="textbtn" data-act="order" data-id="' + esc(r.o.id) + '">' + esc(r.o.number) + "</button>" },
    { k: "ordered", label: "Ordered", cls: "nw", sort: r => toDate(r.o.orderedAt), text: r => fmtShort(r.o.orderedAt) },
    { k: "status", label: "Status", sort: r => ["delivered", "out_for_delivery", "shipped", "backordered", "ordered"].indexOf(r.st), html: r => '<span class="st ' + (OL_PILL[r.st] || "") + '">' + esc(OL_LABEL[r.st] || r.st) + "</span>" },
    { k: "carrier", label: "Carrier", cls: "nw", sort: r => r.s ? r.s.carrier : "", html: r => r.s ? carrierChip(r.s.carrier) : '<span class="z">-</span>' },
    { k: "tracking", label: "Tracking", cls: "nw", sort: r => r.s ? r.s.tracking : "", html: r => r.s ? trackLink(r.s, true) : '<span class="z">No shipment yet</span>' },
    { k: "expected", label: "Expected", sort: r => r.exp, html: r => r.dnr ? '<span style="color:var(--m-warn-text);font-weight:600">Delivered ' + esc(fmtShort(r.s && r.s.deliveredAt)) + "</span>" : r.exp ? (r.late ? '<span class="late">Expected ' + esc(fmtShort(r.exp)) + ", " + daysLate(r.exp) + " day" + (daysLate(r.exp) === 1 ? "" : "s") + " late</span>" : esc(fmtShort(r.exp)) + (r.st === "backordered" ? '<div class="pd">Vendor ETA</div>' : "")) : '<span class="z">' + (r.st === "backordered" ? "No ETA" : "Not given") + "</span>" },

function trMatches(r) {
  const f = S.trFilter;
  if (f.job && r.group !== f.job) return false;
  if (f.vendor && r.o.vendor !== f.vendor) return false;
  if (f.carrier && (!r.s || r.s.carrier !== f.carrier)) return false;
  if (f.status && r.st !== f.status) return false;
  if (f.late && !r.late) return false;
  return true;
}

      }) + '<p class="hint">' + list.length + " of " + all.length + " lines. Grouped by job, then stock.</p>";
    }

  el.innerHTML = h + "</div>";

/* ==============================================================
   WEEK VIEW (0.3.0): the staging schedule as a timesheet (layout B
   in week-preview.html). One block per day, one card per ticket due
   that day by its install date, each line with its status on the right.
   ============================================================== */

/* ---------------- product photos (0.5.0, PLAN 3 imageUrl) ----------------
   One photo per product in Firebase Storage at loadout/products/{id}.jpg in
   watchtower-6fbe1. The rules (watchtower/storage.rules) cap it at 2 MB,
   allow JPEG, PNG, and WebP, let admin and warehouse write, and let anyone
   signed in on the domain read. The browser shrinks it to 1200 px on the
   long side and re-encodes it as JPEG first, which also drops the camera's
   location data. The product keeps the download link (imageUrl) and the
   Storage path (imagePath) so the record reads on its own. */
const PHOTO_TYPES = ["image/jpeg", "image/png", "image/webp"];
const PHOTO_MAX = 2 * 1024 * 1024, PHOTO_PX = 1200;
function photoSlot(p) {
  const W = isWriter(), url = p.imageUrl, busy = S.photoBusy === p.id, id = esc(p.id);
  if (!W && !url) return "";

  let act = "";
  if (W) act = '<div class="pact"><p class="hint" style="margin:0">' + (busy ? "Uploading the photo." : "A shelf photo helps whoever picks it find the right box. JPEG, PNG, or WebP; it is shrunk to 1200 px before upload.") + "</p>" +
    '<div class="btnrow"><button type="button" class="btn" data-act="photoPick" data-id="' + id + '"' + (busy ? " disabled" : "") + ' title="Take a photo or pick one from the phone or computer. Uploading needs a connection.">' + (url ? "Replace photo" : "Add photo") + "</button>" +
    (url ? '<button type="button" class="btn danger" data-act="photoRemove" data-id="' + id + '"' + (busy ? " disabled" : "") + ">Remove photo</button>" : "") + "</div></div>";
  return '<div class="sect"><h4 class="h4">Photo</h4><div class="pslot">' + img + act + "</div></div>";
}
function photoPick(p) {

/* decode, shrink to PHOTO_PX on the long side, and encode as JPEG under PHOTO_MAX */
async function shrinkPhoto(file) {
  if (!PHOTO_TYPES.includes(file.type)) throw new Error("Use a JPEG, PNG, or WebP photo.");
  let src, w, h, done = () => {};
  try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); w = src.width; h = src.height; done = () => src.close && src.close(); }
  catch (e) {
    const url = URL.createObjectURL(file);
    src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("That file could not be read as a photo.")); i.src = url; });
    w = src.naturalWidth; h = src.naturalHeight; done = () => URL.revokeObjectURL(url);
  }
  const k = Math.min(1, PHOTO_PX / Math.max(w, h)), cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
  const c = document.createElement("canvas"); c.width = cw; c.height = ch;
  const g = c.getContext("2d");
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, cw, ch); /* PNG transparency becomes white, not black */
  g.drawImage(src, 0, 0, cw, ch); done();
  for (const qy of [0.85, 0.72, 0.58]) {
    const b = await new Promise(res => c.toBlob(res, "image/jpeg", qy));
    if (b && b.size <= PHOTO_MAX) return b;
  }
  throw new Error("That photo is still over 2 MB after shrinking. Try another one.");
}
async function storageApi() {
  if (!fb.st) { const m = await import(SDK + "firebase-storage.js"); fb.stMod = m; fb.st = m.getStorage(fb.app); }
  return { m: fb.stMod, st: fb.st };
}
async function doSetPhoto(p, file) {
  if (DEMO || !isWriter()) { toast("Demo mode: not saved"); return false; }
  const had = !!p.imageUrl;
  S.photoBusy = p.id; render(true);
  try {
    const blob = await shrinkPhoto(file);
    const { m, st } = await storageApi();
    const path = "loadout/products/" + p.id + ".jpg", ref = m.ref(st, path);
    await m.uploadBytes(ref, blob, { contentType: "image/jpeg", cacheControl: "private, max-age=86400" });
    const url = await m.getDownloadURL(ref);
    return await DB.commit([{ op: "update", coll: "loadout_products", id: p.id, data: { imageUrl: url, imagePath: path, imageAt: NOW, updatedAt: NOW } },
      mv("edit", { productId: p.id, note: had ? "Photo replaced" : "Photo added" })], "the photo of " + productName(p));
  } catch (e) {
    console.warn("Photo upload failed:", e);
    const msg = e && e.code === "storage/unauthorized" ? "Only admin and warehouse can change photos." : e && e.message && !e.code ? e.message : "Could not upload the photo. Check the connection and try again.";
    toast(msg, true); return false;
  } finally { S.photoBusy = null; render(true); }
}
async function doRemovePhoto(p) {
  if (DEMO || !isWriter()) { toast("Demo mode: not saved"); return false; }
  if (!navigator.onLine) { toast("Removing a photo needs a connection. Try again when you are back online.", true); return false; }
  S.photoBusy = p.id; render(true);

    const { m, st } = await storageApi();
    try { await m.deleteObject(m.ref(st, p.imagePath || "loadout/products/" + p.id + ".jpg")); }

    return await DB.commit([{ op: "update", coll: "loadout_products", id: p.id, data: { imageUrl: null, imagePath: null, imageAt: null, updatedAt: NOW } },
      mv("edit", { productId: p.id, note: "Photo removed" })], "the photo of " + productName(p));
  } catch (e) {
    console.warn("Photo removal failed:", e);
    toast(e && e.code === "storage/unauthorized" ? "Only admin and warehouse can change photos." : "Could not remove the photo. Try again.", true); return false;
  } finally { S.photoBusy = null; render(true); }

const TORCH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8l-2 7h-4z"/><path d="M10 9v11a2 2 0 0 0 4 0V9"/></svg>';
const CAM = { stream: null, track: null, timer: null, still: null, reader: null, last: "", lastAt: 0, torch: false };
function renderScan() {

  if (S.retryCode && S.loaded.products && !S.errors.products) { const code = S.retryCode; S.retryCode = null; route(code); }
  const up = $("#upcPending");
  if (S.pendingUpcFor && S.products.get(S.pendingUpcFor)) { up.hidden = false; up.innerHTML = "Waiting for a barcode to set as the UPC of <b>" + esc(productName(S.products.get(S.pendingUpcFor))) + '</b>. <button type="button" class="textbtn" data-act="cancelUpc">Cancel</button>'; }
  else up.hidden = true;

function paintLocChip() {

  w.innerHTML = S.activeLoc && S.locations.get(S.activeLoc)
    ? '<span class="locchip" title="Active location, set by scanning a shelf or bay label. Receive, Count, and Check in start here."><b>' + esc(locName(S.activeLoc)) + '</b><button type="button" data-act="clearLoc" aria-label="Clear the active location">&times;</button></span>'
    : '<span class="hint" style="margin:0">Scan a shelf label to set the location</span>';

function setActiveLoc(id) { S.activeLoc = id; try { sessionStorage.setItem("loadout.activeLoc", id || ""); } catch (e) {} paintLocChip(); }
function paintCam(state, msg) {
  const cam = $("#cam"); if (!cam) return;
  if (state === "on") {
    cam.innerHTML = '<video id="camVideo" playsinline muted></video><div class="box"></div><div class="laser"></div><span class="read" id="camRead" hidden></span>' +
      '<button type="button" class="torch" id="torchBtn" aria-pressed="false" aria-label="Torch" title="Torch" hidden>' + TORCH_SVG + '</button><span class="camhint" id="camHint">Point at a UPC or a Loadout label</span>';
    $("#torchBtn").addEventListener("click", toggleTorch);
  } else if (state === "off") {
    cam.innerHTML = '<div class="camoff"><p>' + esc(msg || "Camera is off. Allow it in the browser, or type the code below.") + '</p><button type="button" class="btn" data-act="startCam">Try the camera again</button></div>';
  } else {
    cam.innerHTML = '<div class="camoff"><p>Scan UPCs on boxes and Loadout QR labels with the phone camera.</p><button type="button" class="btn acc" data-act="startCam">Start camera</button></div>';
  }

async function autoStartCamera() {
  try {
    if (navigator.permissions && navigator.permissions.query) {
      const st = await navigator.permissions.query({ name: "camera" });
      if (st.state === "granted") startCamera();
      else if (st.state === "denied") { paintCam("off"); }
    }
  } catch (e) { /* Safari has no camera permission query; wait for the button */ }
}
async function startCamera() {
  if (CAM.stream || CAM.starting) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { paintCam("off", "Camera is off. This browser has no camera access here. Type the code below."); focusManual(); return; }
  CAM.starting = true;
  try {
    CAM.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
  } catch (e) {
    CAM.starting = false; CAM.stream = null; paintCam("off"); focusManual(); return;
  }
  CAM.starting = false;
  if (S.view !== "scan") { stopCamera(); return; }
  paintCam("on");
  const v = $("#camVideo"); v.srcObject = CAM.stream;
  try { await v.play(); } catch (e) {}
  CAM.track = CAM.stream.getVideoTracks()[0];
  try { const caps = CAM.track.getCapabilities ? CAM.track.getCapabilities() : {}; if (caps.torch) $("#torchBtn").hidden = false; } catch (e) {}
  armStill();
  if ("BarcodeDetector" in window) {
    let formats = ["qr_code", "ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39"];
    try { const sup = await window.BarcodeDetector.getSupportedFormats(); formats = formats.filter(f => sup.includes(f)); } catch (e) {}
    const det = new window.BarcodeDetector({ formats });
    CAM.timer = setInterval(async () => {
      if (!v.videoWidth) return;
      try { const r = await det.detect(v); if (r && r[0]) onCode(r[0].rawValue); } catch (e) {}
    }, 280);
  } else {
    try {
      await loadScript(ZXING_URL);
      const Z = window.ZXing;
      const reader = new Z.BrowserMultiFormatReader();
      CAM.reader = reader;
      const cb = (res) => { if (res) onCode(res.getText ? res.getText() : res.text); };
      if (typeof reader.decodeFromStream === "function") reader.decodeFromStream(CAM.stream, v, cb);
      else reader.decodeFromVideoElementContinuously(v, cb);
    } catch (e) { paintCam("off", "Camera is on but this browser cannot read barcodes. Type the code below."); stopCamera(true); focusManual(); }
  }
}
function armStill() {
  clearTimeout(CAM.still);
  const h = $("#camHint"); if (h) h.textContent = "Point at a UPC or a Loadout label";
  CAM.still = setTimeout(() => { const h2 = $("#camHint"); if (h2) h2.textContent = "Still looking. Hold steady, or type the code below."; }, 6000);
}
function stopCamera(keepCard) {
  clearInterval(CAM.timer); CAM.timer = null; clearTimeout(CAM.still);
  if (CAM.reader) { try { CAM.reader.reset(); } catch (e) {} CAM.reader = null; }
  if (CAM.stream) { CAM.stream.getTracks().forEach(t => t.stop()); CAM.stream = null; }
  CAM.track = null; CAM.torch = false;
  if (!keepCard && $("#cam")) paintCam("idle");
}
async function toggleTorch() {
  if (!CAM.track) return;
  CAM.torch = !CAM.torch;
  try { await CAM.track.applyConstraints({ advanced: [{ torch: CAM.torch }] }); $("#torchBtn").setAttribute("aria-pressed", String(CAM.torch)); }
  catch (e) { CAM.torch = false; toast("The torch is not available on this camera.", true); }
}
function focusManual() { const m = $("#manualCode"); if (m) setTimeout(() => m.focus(), 50); }
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load failed")); document.head.appendChild(s); });
}
function onCode(raw) {
  const code = String(raw || "").trim(); if (!code) return;
  const now = Date.now();
  if (code === CAM.last && now - CAM.lastAt < 3000) return;
  CAM.last = code; CAM.lastAt = now;
  try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {}
  const r = $("#camRead"); if (r) { r.textContent = code; r.hidden = false; }
  armStill();
  route(code);
}

/* routing on the payload prefix; a plain code is a UPC, model, or box label */
function route(code) {
  const m = /^loadout:(loc|ctr|item|prod):(.+)$/i.exec(code.trim());
  if (S.pendingUpcFor && !m) { confirmUpc(S.pendingUpcFor, code); return; }
  if (!S.loaded.products || S.errors.products) { S.scan = { kind: "retry", code }; paintScanResult(); return; }
  if (m) {
    const kind = m[1].toLowerCase(), id = m[2];
    if (kind === "loc") {
      if (S.locations.get(id)) { setActiveLoc(id); S.scan = { kind: "loc", id }; }
      else S.scan = { kind: "unknown", code };
    } else if (kind === "ctr") S.scan = S.containers.get(id) ? { kind: "ctr", id } : { kind: "unknown", code };
    else if (kind === "item") S.scan = S.items.get(id) ? { kind: "item", id } : { kind: "unknown", code };
    else S.scan = S.products.get(id) ? { kind: "prod", id } : { kind: "unknown", code };
  } else {
    const q = code.toLowerCase().replace(/\s+/g, " ");
    const prods = Array.from(S.products.values());
    let p = prods.find(x => x.upc && x.upc === code);
    if (!p) p = prods.find(x => x.model && x.model.toLowerCase() === q);
    const c = !p && Array.from(S.containers.values()).find(x => String(x.label).toLowerCase() === q || x.id === slug(code));
    const box = !p && !c && Array.from(S.containers.values()).find(x => x.upc && x.upc === code);
    if (p) S.scan = { kind: "prod", id: p.id };
    else if (c) S.scan = { kind: "ctr", id: c.id };
    else if (box) S.scan = { kind: "prod", id: box.productId };
    else {
      const hits = prods.filter(x => productName(x).toLowerCase().includes(q)).slice(0, 8);
      S.scan = hits.length && !/^\d{6,}$/.test(code) ? { kind: "hits", code, ids: hits.map(h => h.id) } : { kind: "unknown", code };
    }
  }
  paintScanResult();
}
function refreshScan() { if (S.view === "scan") setTimeout(paintScanResult, 60); }
function confirmUpc(pid, code) {
  const p = S.products.get(pid); if (!p) { S.pendingUpcFor = null; return; }
  const other = Array.from(S.products.values()).find(x => x.upc === code && x.id !== pid);
  if (other) { toast("That barcode already belongs to " + productName(other) + ".", true); return; }
  confirmModal("Set UPC", "<p>Set <b class=\"mono\">" + esc(code) + "</b> as the UPC of <b>" + esc(productName(p)) + "</b>? Scanning it will find this product from now on.</p>", "Set UPC", async () => {
    S.pendingUpcFor = null; render(true);
    if (await doSaveProduct(p.id, { upc: code, name: productName(p) }, false, ["upc"])) { toast("UPC saved"); S.scan = { kind: "prod", id: p.id }; refreshScan(); }
  });
}
function paintScanResult() {

function bindBoxSheet(root, c, px, after) {

  if (!tabs.some(t => t[0] === S.consoleTab)) { S.consoleTab = "reports"; setHash(); }

    tabs.map(([k, l]) => '<button type="button" role="tab" aria-selected="' + (S.consoleTab === k) + '" class="' + (S.consoleTab === k ? "on" : "") + '" data-act="consoleTab" data-tab="' + k + '">' + l + "</button>").join("") + "</div></div>";

}

/* the range is read once per From and To (and on Refresh); listeners keep the rest live */
async function repLoad(force) {
  const r = rrGet(), key = r.from + "|" + r.to, d = rrDates();
  if (!force && S.rep && S.rep.key === key) return;
  if (isNaN(d.from) || isNaN(d.to)) { S.rep = { key, err: "Pick both dates.", bad: true }; return; }
  if (d.from > d.to) { S.rep = { key, err: "From is after To. Pick a From date on or before the To date.", bad: true }; return; }
  S.rep = { key, loading: true };
  try {
    const [mvs, olines] = await Promise.all([DB.movementsBetween(d.from, d.to), DB.getAll("loadout_order_lines")]);
    if (!S.rep || S.rep.key !== key) return;
    S.rep = { key, mvs, olines, at: new Date() };
  } catch (e) {
    console.warn("Report read failed:", e);
    if (S.rep && S.rep.key === key) S.rep = { key, err: "Could not read the data for this range. Check your connection and try again." };
  }
  scheduleRender();
}

  }
  return ops;
}

async function importLoad(buf, fileName) {
  const XLSX = await ensureXLSX();
  const wb = XLSX.read(buf, { type: "array", cellDates: true });
  const mapping = {};
  wb.SheetNames.forEach(n => { mapping[n] = TAB_DEFAULTS[n.trim().toLowerCase()] || ""; });
  S.imp = { fileName, wb, mapping, aliases: {}, plan: null, doneKeys: await importDoneKeys() };
  S.imp.plan = buildImportPlan(S.imp);
  if (S.view === "more" && S.moreTab === "import") render(true);
  return S.imp.plan;
}

function bindImport(el) {
  const f = $("#impFile", el);
  const pick = $("#impPick", el);
  pick.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); f.click(); } });
  f.addEventListener("change", async () => {
    const file = f.files && f.files[0]; if (!file) return;
    $("#impBusy", el).hidden = false;
    try { await importLoad(await file.arrayBuffer(), file.name); }
    catch (e) { console.warn(e); toast("Could not read that file: " + (e.message || e), true); $("#impBusy", el).hidden = true; }
  });
  $$("select[data-imptab]", el).forEach(s => s.addEventListener("change", () => { S.imp.mapping[s.dataset.imptab] = s.value; collectAliases(el); S.imp.plan = buildImportPlan(S.imp); render(true); }));

function collectAliases(el) { $$("input[data-alias]", el).forEach(i => S.imp.aliases[i.dataset.alias] = i.value.trim()); }
async function runImport() {
  const pl = S.imp.plan, ops = importOps(pl);
  if (DEMO) { toast("Demo mode: not saved"); return; }
  const chunks = []; for (let i = 0; i < ops.length; i += 450) chunks.push(ops.slice(i, i + 450));
  let done = 0;
  for (const ch of chunks) {
    toast("Writing " + fmtN(done + ch.length) + " of " + fmtN(ops.length));
    const ok = await DB.commit(ch, "import batch");
    if (!ok) { toast("Import stopped after " + fmtN(done) + " writes. Run it again; it picks up where it left off.", true); return; }
    done += ch.length;
  }
  toast("Imported. " + fmtN(pl.counts.productsNew) + " new products, " + fmtN(pl.counts.boxes) + " boxes.");
  S.imp = null; render(true);
}

    case "olBack": { const o = curOrder(), ol = curOl(id); if (o && ol) openBackorder(o, ol); break; }
    case "olNote": { const o = curOrder(), ol = curOl(id); if (o && ol) openOlNote(o, ol); break; }
    case "shipRecv": { const s = S.shipments.get(id); if (s) openReceiveShipment(s); break; }
    case "shipUpd": { const s = S.shipments.get(id); if (s) openShipUpdate(s); break; }
    case "trRecv": { const s = S.shipments.get(id); if (s) openReceiveShipment(s, b.dataset.line); break; }
    case "trNote": { const o = S.orders.get(id), ol = o && S.olines.get(o.id) ? S.olines.get(o.id).get(b.dataset.line) : null; if (o && ol) openOlNote(o, ol); break; }
    /* 0.3.0: week */
    case "wkGo": { const d = +b.dataset.d; S.weekOff = d === 0 ? 0 : S.weekOff + d; setHash(); render(true); break; }
    case "wkWork": S.prefs = Object.assign({}, S.prefs, { workWeek: !wwOn() }); savePrefs(); render(true); { const t = $(".wwt"); if (t) t.focus(); } break;
    case "wkAll": S.prefs = Object.assign({}, S.prefs, { workWeek: false }); savePrefs(); render(true); toast("Work week off: the weekend shows"); break;
    case "wkLine": S.focusLine = { id: b.dataset.line, done: false }; go("ticket", id); break;
    case "mvWeek": mvWeek(+b.dataset.d); render(true); break;
    case "impGo": collectAliases($("#v-more")); S.imp.plan = buildImportPlan(S.imp);
      confirmModal("Import " + S.imp.fileName, "<p>Write " + fmtN(importOps(S.imp.plan).length) + " records: " + fmtN(S.imp.plan.counts.productsNew) + " new products, " + fmtN(S.imp.plan.counts.boxes) + " boxes, " + fmtN(S.imp.plan.counts.items) + " serialized units, and " + fmtN(S.imp.plan.counts.movements) + " movements by Import. Safe to run again later.</p>", "Import", runImport);
      break;
  }
});
document.addEventListener("input", e => {

  else if (t.dataset && t.dataset.mf) { S.mvFilter[t.dataset.mf] = t.value; scheduleRender(); }

  else if (t.dataset && t.dataset.xf && S.x) { if (!S.x.draft) S.x.draft = {}; S.x.draft[t.dataset.xf] = t.type === "checkbox" ? t.checked : t.value; }
});

  else if (t.dataset && t.dataset.ovendor) {

    else doSetVendor(o, t.value).then(ok => { if (ok) toast(t.value ? "Vendor set to " + t.value : "Vendor cleared"); else render(true); });

/* the attributes section in a product panel stays open across redraws */
document.addEventListener("toggle", e => { if (e.target.matches && e.target.matches("details[data-xattr]") && S.x) S.x.attrOpen = e.target.open; }, true);
window.addEventListener("hashchange", () => applyHash());
const VIEWS = ["tickets", "ticket", "stock", "scan", "items", "orders", "order", "tracking", "week", "more", "console"];
function applyHash() {
  const parts = location.hash.replace(/^#/, "").split("/").map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
  let [v, sub] = routeAlias(parts[0], parts[1]);
  const rest = parts.slice(2).join("/");
  if (!VIEWS.includes(v)) return;
  if (v === "console") { S.consoleTab = sub || "reports"; if (S.consoleTab === "reports" && rest && REPORTS.some(r => r.k === rest)) S.repTab = rest; if (parts[1] === "board") setTimeout(scrollToBoard, 80); }
  S.x = null;
  if (v === "stock") { if (sub === "p" && rest) { xSet("p", rest); const p = S.products.get(rest); if (S.stockTab === "locations" || !p || !stockShows(p)) { S.stockTab = "all"; S.search = ""; } } else if (sub === "l" && rest) { S.stockTab = "locations"; xSet("l", rest); } else if (sub) S.stockTab = sub; }
  if (v === "items") { if (sub === "i" && rest) { S.itemsTab = "all"; xSet("i", rest); } else if (sub) S.itemsTab = sub; }
  if (sub && v === "more") S.moreTab = sub;
  if (v === "ticket") { S.ticketId = sub || null; if (DB) DB.syncLines(); }
  if (v === "order") { S.orderId = sub || null; if (DB && DB.syncOrderLines) DB.syncOrderLines(); }
  if (v === "week") S.weekOff = sub ? weekOffFor(sub) : 0;
  if (S.view === "scan" && v !== "scan") stopCamera();
  S.view = v; render(true);
  if (v !== parts[0] || sub !== parts[1]) setHash();
  if (S.x) scrollToX();
}
function scrollToBoard() { const s = $("#bdSect"); if (s) { s.scrollIntoView({ block: "start", behavior: REDUCED ? "auto" : "smooth" }); const f = $("#bdMode"); if (f) f.focus({ preventScroll: true }); } }

/* ==============================================================
   ADD TO HOME SCREEN (0.5.0, PLAN 12)
   A card at the top of More, and once a dismissible strip under the
   header on the phone. Chrome on Android hands over its own install
   prompt (beforeinstallprompt); Safari on iOS has none, so the card
   shows the two steps by hand. Each is remembered as dismissed per
   device. Nothing shows once Loadout runs from the home screen.
   ============================================================== */
const A2 = { evt: null, installed: false, force: null };
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); A2.evt = e; paintA2(); if (S.view === "more") render(true); });
window.addEventListener("appinstalled", () => { A2.evt = null; A2.installed = true; paintA2(); if (S.view === "more") render(true); });
const SHARE_SVG = '<svg class="shareic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
function a2Standalone() { try { return A2.installed || matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch (e) { return false; } }
/* prompt: Chrome's own dialog; ios: the Share steps; menu: another phone browser; none: nothing to offer */
function a2Mode() {
  if (A2.force) return A2.force;
  if (a2Standalone() || BOARD) return "none";
  if (A2.evt) return "prompt";
  const ua = navigator.userAgent || "";
  if (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) return "ios";
  if (matchMedia("(max-width:640px)").matches || matchMedia("(pointer:coarse)").matches) return "menu";
  return "none";
}
function a2Off(k) { try { return localStorage.getItem("loadout.a2hs." + k) === "1"; } catch (e) { return false; } }
function a2Dismiss(k) { try { localStorage.setItem("loadout.a2hs." + k, "1"); } catch (e) {} A2.hidden = Object.assign({}, A2.hidden, { [k]: true }); }
const a2Hidden = k => a2Off(k) || !!(A2.hidden && A2.hidden[k]);
async function a2Prompt() {
  if (DEMO && A2.force === "prompt" && !A2.evt) { toast("Demo mode: the browser's install dialog opens here on a phone"); return; }
  const e = A2.evt; if (!e) return;
  A2.evt = null;
  try { e.prompt(); const r = await e.userChoice; if (r && r.outcome === "accepted") { A2.installed = true; toast("Loadout is on the home screen"); } } catch (err) {}
  paintA2(); if (S.view === "more") render(true);
}
function installCardHTML() {
  const m = a2Mode(); if (m === "none" || a2Hidden("card")) return "";
  const why = "<p>It opens straight to Scan, full screen, and keeps working in the warehouse with no signal.</p>";
  const body = m === "prompt" ? why + '<div class="btnrow"><button type="button" class="btn acc" data-act="a2Add">Add to home screen</button><button type="button" class="btn" data-act="a2Hide" data-k="card">Not now</button></div>'
    : m === "ios" ? why + "<ol><li>Tap Share " + SHARE_SVG + " in Safari's toolbar.</li><li>Scroll down and tap <b style=\"display:inline\">Add to Home Screen</b>.</li></ol>" + '<div class="btnrow"><button type="button" class="btn" data-act="a2Hide" data-k="card">Got it</button></div>'
    : why + "<p>Open the browser menu and pick Add to Home screen or Install app.</p>" + '<div class="btnrow"><button type="button" class="btn" data-act="a2Hide" data-k="card">Got it</button></div>';
  return '<div class="a2card" id="a2Card"><svg class="mk" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="20" width="48" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="5"/><path d="M24 20v-6a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v6" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M8 35h48" stroke="currentColor" stroke-width="4"/><rect x="27" y="31" width="10" height="8" rx="2" fill="currentColor"/></svg>' +
    '<div class="a2t"><b>Add Loadout to the home screen</b>' + body + "</div></div>";
}
function paintA2() {
  const el = $("#a2Strip"); if (!el) return;
  const m = a2Mode();
  /* on More the card says the same thing, so the strip steps aside there */
  if (!S.user || m === "none" || a2Hidden("strip") || S.view === "more") { el.hidden = true; el.innerHTML = ""; el._h = ""; return; }
  /* render() calls this on every redraw; rewrite only on a change so focus stays put */
  const html = '<span class="a2s">' + (m === "ios" ? "Add Loadout to the home screen: tap Share " + SHARE_SVG + ", then Add to Home Screen." : "Add Loadout to the home screen. It opens to Scan and works with no signal.") + "</span>" +
    (m === "prompt" ? '<button type="button" class="btn sm acc" data-act="a2Add">Add</button>' : '<button type="button" class="btn sm" data-act="a2How">Show me how</button>') +
    '<button type="button" class="x" data-act="a2Hide" data-k="strip" aria-label="Dismiss the home screen tip">&times;</button>';
  if (el._h !== html) { el.innerHTML = html; el._h = html; }
  el.hidden = false;
}

/* ==============================================================
   SERVICE WORKER (0.5.0, PLAN 9)
   sw.js keeps the shell, the zxing fallback, and the Firebase modules on
   the device. It registers in demo mode too: the demo is how the offline
   shell gets checked, and the cache is Loadout's own. When a newer sw.js
   takes over a page that is still running the old build, it says so.
   ============================================================== */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").then(reg => {
    /* a phone left open on Scan all day still hears about a release */
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(err => console.warn("Service worker did not register:", err));
  navigator.serviceWorker.addEventListener("message", ev => {
    const d = ev.data || {};
    if (d.type === "loadout-update" && d.version !== VERSION) toastAction("New version available, reload", "Reload", () => location.reload());
  });
}

/* ==============================================================
   BOOT
   ============================================================== */
function setMe(me) {
  S.me = me;
  const prev = S.role;
  S.role = me.active === false ? "none" : (me.role || "tech");
  $("#footRole").textContent = "Role: " + (ROLE_LABEL[S.role] || S.role);
  if (S.role === "board" && !BOARD) { enterBoard(); return; }
  if (prev !== S.role) { _moreBuilt = ""; _conBuilt = ""; render(true); }
}
function startApp(user) {
  S.user = user;
  loadLocalPrefs();
  qLoad();
  try { S.activeLoc = sessionStorage.getItem("loadout.activeLoc") || null; } catch (e) {}
  $("#signin").style.display = "none";
  $("#app").hidden = false;
  $("#demoBar").hidden = !DEMO;
  $("#whoEmail").textContent = user.email;
  $("#footWho").textContent = (DEMO ? "Demo account: " : "Signed in as ") + user.email;
  $("#verBadge").textContent = "v" + VERSION; $("#footVer").textContent = "Loadout v" + VERSION;
  $("#footRole").textContent = "Role: " + (ROLE_LABEL[S.role] || S.role);
  DB = DEMO ? demoStore() : firestoreStore(user);
  DB.start();
  paintSync();
  if (BOARD || S.role === "board") { enterBoard(); return; }
  paintA2();
  if (location.hash) applyHash(); else { S.view = matchMedia("(max-width:640px)").matches ? "scan" : "tickets"; render(true); }
  if (PRINT && DEMO) { S.labelSel = new Set(labelGroups().flatMap(g => g[1].map(x => x.key))); printLabels(Array.from(S.labelSel).map(k => { const i = k.indexOf(":"); return { kind: k.slice(0, i), id: k.slice(i + 1) }; })); }
}
function stopApp() {
  stopCamera(); if (DB) DB.stop(); DB = null;
  S.user = null; S.products = new Map(); S.locations = new Map(); S.stock = new Map(); S.containers = new Map(); S.items = new Map(); S.users = new Map(); S.movements = [];
  S.clients = new Map(); S.jobs = new Map(); S.proposals = new Map(); S.tickets = new Map(); S.lines = new Map(); S.linesLoaded = new Set(); S.tkHist = {};
  if (BOARD) { clearInterval(BD.tick); cancelAnimationFrame(BD.raf); $("#board").hidden = true; BOARD = QUERY.get("board") === "1"; }
  S.loaded = {}; S.errors = {}; S.scan = null; _moreBuilt = ""; const sc = $("#v-scan"); if (sc) { sc.innerHTML = ""; delete sc.dataset.built; }
  closeAllModals();
  S.queue = []; paintA2();
  $("#app").hidden = true;
  $("#signin").style.display = "flex";
}

if (DEMO) {
  /* No Firebase module is imported on this path, so nothing in demo mode can reach Firestore. */
  $("#signoutBtn").textContent = "Leave demo";
  $("#signoutBtn").addEventListener("click", () => { location.href = location.pathname; });
  /* ?demo=1&role=tech|warehouse|accounting|board shows that role's view; admin otherwise */
  const qr = QUERY.get("role"), demoRole = ["tech", "warehouse", "accounting", "board"].includes(qr) ? qr : "admin";
  S.role = demoRole;
  const demoName = { admin: "Warehouse", warehouse: "Warehouse", tech: "Tech", accounting: "Accounting", board: "Board" }[demoRole];
  startApp(demoRole === "tech" ? { uid: "demo-tech", email: "tech@example.com", name: "Tech" } : demoRole === "admin" ? { uid: "demo-warehouse", email: "warehouse@example.com", name: "Warehouse" } : { uid: "demo-" + demoRole, email: demoRole + "@example.com", name: demoName });
  S.me = S.users.get(S.user.uid) || { id: S.user.uid, role: demoRole, active: true };
} else {
  $("#signin").style.display = "flex";
  const mods = await Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-auth.js"), import(SDK + "firebase-firestore.js")]);
  const appMod = mods[0], authMod = mods[1], fsMod = mods[2];
  const fbApp = appMod.initializeApp(firebaseConfig);
  const auth = authMod.getAuth(fbApp);
  const db = fsMod.initializeFirestore(fbApp, { localCache: fsMod.persistentLocalCache({ tabManager: fsMod.persistentMultipleTabManager() }) });
  fb = { fs: fsMod, db, auth, authMod, app: fbApp };

  $("#signinBtn").addEventListener("click", async () => {
    $("#signinErr").hidden = true;
    try {
      const provider = new authMod.GoogleAuthProvider();
      provider.setCustomParameters({ hd: ALLOWED_DOMAIN, prompt: "select_account" });
      await authMod.signInWithPopup(auth, provider);
    } catch (e) {
      $("#signinErr").textContent = "Sign-in failed: " + (e.message || e);
      $("#signinErr").hidden = false;
    }
  });
  $("#signoutBtn").addEventListener("click", () => authMod.signOut(auth));

  authMod.onAuthStateChanged(auth, async user => {
    if (!user) { stopApp(); return; }
    const email = (user.email || "").toLowerCase();
    if (!email.endsWith("@" + ALLOWED_DOMAIN)) {
      await authMod.signOut(auth);
      $("#signinErr").textContent = "Sign-in must be a @" + ALLOWED_DOMAIN + " account.";
      $("#signinErr").hidden = false;
      return;
    }
    const me = { uid: user.uid, email, name: user.displayName || email.split("@")[0] };
    /* roles: the first sign-in writes the person's own doc (admin only for the D2 account; everyone else tech, unconfirmed) */
    const ref = fsMod.doc(db, "loadout_users", user.uid);
    let role = "tech";
    /* offline (0.5.0): read the roster and layout from the device cache
       instead of waiting out the server timeout; the sign-in itself is
       remembered by Firebase Auth from the last time there was signal */
    const getD = r => navigator.onLine ? fsMod.getDoc(r) : fsMod.getDocFromCache(r);
    try {
      const snap = await getD(ref);
      if (!snap.exists()) {
        role = email === ADMIN_EMAIL ? "admin" : "tech";
        await fsMod.setDoc(ref, { email, name: me.name, role, active: true, confirmed: role === "admin", addedBy: "self-sign-in", addedAt: fsMod.serverTimestamp(), lastSeen: fsMod.serverTimestamp() });
      } else {
        const d = snap.data(); role = d.active === false ? "none" : (d.role || "tech");
        fsMod.updateDoc(ref, { lastSeen: fsMod.serverTimestamp(), name: me.name }).catch(() => {});
      }
    } catch (e) { console.warn("Could not read the roster; using tech until it loads.", e); }
    S.role = role;
    try { const pf = await getD(fsMod.doc(db, "users", user.uid)); if (pf.exists() && pf.data().loadoutLayout) { S.user = me; loadLocalPrefs(); S.prefs = Object.assign({}, pf.data().loadoutLayout, S.prefs); } } catch (e) {}
    startApp(me);
    if (S.prefs && Object.keys(S.prefs).length) savePrefs();
  });
}

/* admins seed the staging bays and vans (D4, D5) once the locations have loaded */
setInterval(() => {
  if (DEMO || !S.user || !isAdmin() || S._seeded || !S.loaded.locations || S.errors.locations) return;
  S._seeded = true;
  const missing = SEED_LOCATIONS.filter(l => !S.locations.has(l.id));
  if (!missing.length) return;
  const ops = [];
  missing.forEach(l => {
    const name = composeLocName(l.area, l.shelf);
    ops.push({ op: "set", coll: "loadout_locations", id: l.id, merge: true, data: { area: l.area, shelf: l.shelf, kind: l.kind, name, qr: PAYLOAD.loc(l.id), jobId: null, createdAt: NOW, updatedAt: NOW } });
    ops.push(mv("edit", { toLocationId: l.id, toLocationName: name, note: "Location created (seeded bay or van)" }));
  });
  DB.commit(ops, "the staging bays and vans");
}, 1500);
