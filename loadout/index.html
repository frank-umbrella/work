<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loadout moved</title>
<meta name="robots" content="noindex, nofollow">
<script>
var target = "https://devriz.umbrellaautomation.com/loadout/" + location.search + location.hash;
location.replace(target);
</script>
<meta http-equiv="refresh" content="2;url=https://devriz.umbrellaautomation.com/loadout/">
<link rel="icon" type="image/svg+xml" href="https://devriz.umbrellaautomation.com/loadout/favicon.svg">
<style>
:root{--bg:#f4f6f9;--text:#1a2233;--link:#155cb8;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#12161d;--text:#e6e9ee;--link:#8cb8f2}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;padding:32px 16px;overflow-x:hidden}
main{max-width:560px;margin:0 auto}
h1{font-size:24px;margin:0 0 12px}
a{color:var(--link);overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>Loadout moved</h1>
<p>It now lives at <a href="https://devriz.umbrellaautomation.com/loadout/">https://devriz.umbrellaautomation.com/loadout/</a></p>
<p>Added Loadout to your phone's home screen? Open the new address and add it again, then delete the old icon.</p>
</main>
<script>
window.addEventListener("load", function () {
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) { r.unregister(); });
    }).catch(function () {});
  }
  if ("caches" in window) {
    caches.keys().then(function (keys) {
      keys.forEach(function (k) { if (k.indexOf("loadout-") === 0) caches.delete(k); });
    }).catch(function () {});
  }
});
</script>
</body>
</html>
