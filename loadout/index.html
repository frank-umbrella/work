<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loadout v0.2.0</title>
<meta name="robots" content="noindex, nofollow">
<meta name="loadout-version" content="0.2.0">
<meta name="description" content="Umbrella Automation shop inventory. Restricted to @umbrellaautomation.com accounts.">
<meta name="theme-color" content="#1e6fd9">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Loadout">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Umbrella Automation">
<meta property="og:title" content="Loadout">
<meta property="og:description" content="Shelf counts, wire boxes, and who has which unit. Restricted to @umbrellaautomation.com accounts.">
<meta property="og:image" content="og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Loadout">
<meta name="twitter:description" content="Shelf counts, wire boxes, and who has which unit.">
<meta name="twitter:image" content="og-image.png">
<script src="qr.js"></script>
<style>
/* Ledger (direction B in design-preview.html): light business palette that
   sits beside Backup Audits and Sundial. One accent (blue), three status hues,
   status text always through the --m-*-text values checked at 4.5:1. */
:root{
  --m-bg:#f4f6f9;--m-bg2:#e9edf3;--m-card:#ffffff;--m-card2:#f1f4f8;--m-line:#dde3ea;--m-line2:#c7d0da;
  --m-text:#1a2233;--m-muted:#5b6675;--m-accent:#1e6fd9;--m-accent2:#155cb8;--m-onaccent:#ffffff;
  --m-ok:#1f9d5a;--m-warn:#d98b1e;--m-danger:#d3403a;--m-info:#1e6fd9;
  --m-ok-text:#166b3e;--m-warn-text:#8a5a14;--m-bad-text:#a82e29;--m-info-text:#1a5cb5;
  --m-topbar:#ffffff;--m-toptext:#1a2233;--m-topmuted:#5b6675;--m-brandmark:#1e6fd9;--m-navon:#e8f0fc;
  --m-font:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  --m-mono:Consolas,"Cascadia Mono",Menlo,monospace;
  --m-radius:8px;--m-tap:38px;--m-tapsm:30px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--m-bg);color:var(--m-text);font:14px/1.45 var(--m-font);overflow-x:hidden;min-height:100vh}
a{color:var(--m-accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--m-accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---------- sign-in ---------- */
#signin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.signin-card{background:var(--m-card);border:1px solid var(--m-line);border-radius:12px;padding:30px 26px;max-width:380px;width:100%;text-align:center}
.signin-card svg.mark{width:52px;height:52px;color:var(--m-brandmark)}
.signin-card h1{margin:10px 0 2px;font-size:24px}
.signin-card .sub{color:var(--m-muted);margin:0 0 20px}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;width:100%;border:1px solid var(--m-line2);background:#fff;border-radius:var(--m-radius);font-weight:600;cursor:pointer}
.gbtn:hover{border-color:var(--m-muted)}
.signin-card .domain{font-size:12.5px;color:var(--m-muted);margin-top:14px}
.signin-card .err{margin-top:12px;color:var(--m-bad-text);font-size:13px}
.signin-card .demo{display:inline-flex;align-items:center;min-height:44px;margin-top:6px}

/* ---------- demo banner ---------- */
.demobar{background:#ffd84d;color:#1a2233;font-size:13px;font-weight:600;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;justify-content:center;padding:6px 16px;text-align:center}
.demobar a{color:#1a2233;display:inline-flex;align-items:center;min-height:32px}

/* ---------- app chrome ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px 14px;padding:8px 18px;background:var(--m-topbar);color:var(--m-toptext);border-bottom:1px solid var(--m-line);flex-wrap:wrap;min-height:58px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;letter-spacing:.01em}
.brand svg{width:26px;height:26px;flex:none;color:var(--m-brandmark)}
.brand .v{font:500 11px var(--m-mono);color:var(--m-topmuted);border:1px solid var(--m-line);border-radius:4px;padding:1px 5px;letter-spacing:0}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav button{background:none;border:0;color:var(--m-topmuted);padding:7px 12px;border-radius:var(--m-radius);font-size:14px;cursor:pointer;min-height:36px}
.nav button:hover{color:var(--m-toptext)}
/* the darker accent on the tinted pill keeps 4.5:1 (the base accent reads 4.2:1 there) */
.nav button.on{color:var(--m-accent2);background:var(--m-navon);font-weight:600}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--m-topmuted);border:1px solid var(--m-line);border-radius:999px;padding:3px 10px;margin-left:auto;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--m-ok)}
.sync.off i{background:var(--m-danger)}
.sync.busy i{background:var(--m-warn)}
.sync.demo i{background:var(--m-muted)}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--m-topmuted)}
.who span{border:1px solid var(--m-line);border-radius:999px;padding:3px 10px;overflow-wrap:anywhere}
.locchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 4px 2px 10px;border-radius:999px;border:1px solid var(--m-line);color:var(--m-text);background:var(--m-card2);max-width:100%}
.locchip b{font-weight:600;overflow-wrap:anywhere}
.locchip button{border:0;background:none;color:var(--m-muted);cursor:pointer;min-width:28px;min-height:28px;border-radius:50%;font-size:16px;line-height:1}
.body{max-width:1280px;margin:0 auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.foot{max-width:1280px;margin:0 auto;padding:10px 18px 24px;font-size:12px;color:var(--m-muted);display:flex;gap:6px 16px;flex-wrap:wrap}
.tabbar{display:none}

/* ---------- building blocks ---------- */
.mcard{background:var(--m-card);border:1px solid var(--m-line);border-radius:var(--m-radius);padding:16px 18px;min-width:0}
/* uppercase labels with light tracking (.04em): they read as field labels beside dense numbers */
.h4,.mcard h4{margin:0 0 10px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--m-muted);font-weight:600}
h2.vt{margin:0;font-size:22px;font-weight:700;line-height:1.2}
.thead{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-bottom:10px}
.thead h4{margin:0}
.thead .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--m-mono)}
.z{color:var(--m-muted)}
.hint{font-size:12px;color:var(--m-muted);margin:6px 0 0}
.err{color:var(--m-bad-text);font-size:13px;margin:6px 0 0}
.lab{display:block;font-size:12px;color:var(--m-muted);margin:10px 0 4px;font-weight:600}
.lab abbr{text-decoration:none;cursor:help;border-bottom:1px dotted var(--m-muted)}
.fld{width:100%;min-height:var(--m-tap);background:var(--m-card);color:var(--m-text);border:1px solid var(--m-line2);border-radius:var(--m-radius);padding:6px 11px;font-size:14px}
textarea.fld{min-height:76px;resize:vertical}
.fld::placeholder{color:#6b7480}
.fld[disabled]{background:var(--m-card2);color:var(--m-muted)}
select.fld{appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--m-muted) 50%),linear-gradient(135deg,var(--m-muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
/* attention glow (Playbook rule for unset decision dropdowns): stays on, pulses three times on load, then rests */
.fld.glow{border-color:var(--m-warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--m-warn) 30%,transparent);animation:glow 2.2s ease-in-out 3}
@keyframes glow{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--m-warn) 14%,transparent)}}
@media (prefers-reduced-motion:reduce){.fld.glow{animation:none}}
.money{position:relative}
.money .fld{padding-left:24px}
.money:before{content:"$";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--m-muted);pointer-events:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:0 14px}
.chk{display:flex;align-items:center;gap:10px;min-height:38px;cursor:pointer;font-size:14px}
.chk input{width:18px;height:18px;flex:none;accent-color:var(--m-accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:var(--m-tap);border:1px solid var(--m-line2);background:var(--m-card2);color:var(--m-text);border-radius:var(--m-radius);padding:0 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--m-muted)}
.btn.acc{background:var(--m-accent);border-color:var(--m-accent);color:var(--m-onaccent)}
.btn.acc:hover{background:var(--m-accent2)}
.btn.sm{min-height:var(--m-tapsm);padding:0 10px;font-size:12.5px}
.btn.danger{color:var(--m-bad-text);border-color:color-mix(in srgb,var(--m-danger) 50%,var(--m-line))}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.linkbtn{background:none;border:0;padding:0;color:var(--m-text);cursor:pointer;text-align:left;font:inherit}
.linkbtn:hover .pn{text-decoration:underline}
.textbtn{background:none;border:0;padding:0 2px;color:var(--m-accent);cursor:pointer;font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px;min-height:30px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btnrow.end{justify-content:flex-end}

.st{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--m-muted);background:color-mix(in srgb,var(--m-muted) 14%,transparent)}
.st.ok{color:var(--m-ok-text);background:color-mix(in srgb,var(--m-ok) 14%,transparent)}
.st.warn{color:var(--m-warn-text);background:color-mix(in srgb,var(--m-warn) 16%,transparent)}
.st.bad{color:var(--m-bad-text);background:color-mix(in srgb,var(--m-danger) 13%,transparent)}
.st.info{color:var(--m-info-text);background:color-mix(in srgb,var(--m-info) 14%,transparent)}
.st.big{font-size:14px;padding:4px 13px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;border:1px solid var(--m-line);background:var(--m-card2);font-size:12px;color:var(--m-text);max-width:100%;overflow-wrap:anywhere}
.chip i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--m-muted)}
.chip.ok i{background:var(--m-ok)}
.chip.warn{border-color:color-mix(in srgb,var(--m-warn) 55%,var(--m-line));color:var(--m-warn-text)}
.chip.warn i{background:var(--m-warn)}
.chip.info i{background:var(--m-info)}

/* segmented tabs */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--m-card2);border:1px solid var(--m-line);border-radius:var(--m-radius);padding:3px;max-width:100%}
.seg button{border:0;background:none;padding:5px 11px;border-radius:calc(var(--m-radius) - 2px);font-size:13px;cursor:pointer;white-space:nowrap;color:var(--m-text);min-height:32px}
.seg button b{font-weight:600;color:var(--m-muted);margin-left:5px;font-size:12px;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--m-accent);color:var(--m-onaccent);font-weight:600}
.seg button.on b{color:inherit}
.seg button.warnt b{color:var(--m-warn-text)}
.seg button.on.warnt b{color:inherit}
.search{flex:1 1 220px;width:auto;min-width:0}

/* ---------- tables (card-stack under 640px of container width) ---------- */
.tblwrap{container-type:inline-size;min-width:0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--m-muted);font-weight:600;border-bottom:1px solid var(--m-line);padding:0;text-align:left;white-space:nowrap}
.tbl th .thb{background:none;border:0;padding:8px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center;width:100%;justify-content:inherit}
.tbl th.r .thb{justify-content:flex-end}
.tbl th .sa{font-size:9px;color:var(--m-accent);min-width:8px}
.tbl th.plain{padding:8px}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--m-line);vertical-align:top;min-width:0;overflow-wrap:anywhere}
.tbl td.nw{white-space:nowrap}
.tbl td.act{white-space:nowrap;text-align:right}
.tbl td.act .btn+.btn{margin-left:6px}
.tbl tr.need td{background:color-mix(in srgb,var(--m-warn) 9%,transparent)}
/* left stripe on a .need row marks a real state (below par / needs attention), not decoration */
.tbl tr.need td:first-child{box-shadow:inset 3px 0 0 var(--m-warn)}
.tbl tr.dim td{color:var(--m-muted)}
.tbl tr.skel td{padding:12px 8px}
.skelbar{display:block;height:12px;border-radius:4px;background:var(--m-bg2)}
.pn{font-weight:500}
.pn b{font-weight:700}
.pd{font-size:12px;color:var(--m-muted);margin-top:1px}
.unit{font-size:11px;color:var(--m-muted);margin-left:2px}
.locs{font-size:12.5px;color:var(--m-muted)}
.locs b{color:var(--m-text);font-weight:600}
@container (max-width:640px){
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border:1px solid var(--m-line);border-radius:var(--m-radius);margin-bottom:10px;padding:6px 10px;background:var(--m-card)}
  .tbl td{border:0;padding:4px 0 4px 104px;position:relative;text-align:left!important;min-height:26px}
  .tbl td:before{content:attr(data-l);position:absolute;left:0;top:6px;width:96px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--m-muted);font-weight:600}
  .tbl td.full{padding-left:0}
  .tbl td.full:before{display:none}
  .tbl td.act{white-space:normal;padding-top:8px;padding-left:0}
  .tbl td.act:before{display:none}
  .tbl td.act .btn{margin:0 6px 6px 0}
  .tbl td.act .btn+.btn{margin-left:0}
  .tbl td .st{white-space:normal}
  .tbl tr.need{box-shadow:inset 3px 0 0 var(--m-warn)}
  .tbl tr.need td:first-child{box-shadow:none}
  .tbl tr.skel td{padding-left:0}
  .tbl tr.grp{border:0;border-radius:0;padding:0;margin:14px 0 6px;background:transparent}
  .tbl tr.grp td{padding:8px 0 6px;min-height:0}
  .tbl tr.grp td:before{display:none}
}
.empty{padding:22px 8px;text-align:center;color:var(--m-muted)}
.empty p{margin:0 0 10px;color:var(--m-text)}
.loadmsg{font-size:13px;color:var(--m-muted);margin:8px 0 0}
.errbox{border:1px solid color-mix(in srgb,var(--m-danger) 45%,var(--m-line));background:color-mix(in srgb,var(--m-danger) 6%,var(--m-card));border-radius:var(--m-radius);padding:14px 16px;color:var(--m-bad-text)}
.errbox p{margin:0 0 10px}

/* ---------- stat strip ---------- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:10px}
.sv{background:var(--m-card2);border:1px solid var(--m-line);border-radius:var(--m-radius);padding:10px 12px;min-width:0}
.sv .k{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--m-muted);font-weight:600}
.sv .v{display:block;font-size:26px;font-weight:700;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.sv .u{font-size:12px;color:var(--m-muted)}
.sv.warn{border-color:color-mix(in srgb,var(--m-warn) 55%,var(--m-line))}
.sv.warn .v{color:var(--m-warn-text)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px 16px;margin:12px 0 0}
.meta div{min-width:0}
.meta dt{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--m-muted);font-weight:600}
.meta dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.meta dd small{display:block;font-weight:400;color:var(--m-muted);font-size:12px}

/* ---------- consumables (by the foot) ---------- */
.cons{border:1px solid var(--m-line);border-radius:var(--m-radius);padding:12px 14px;margin-top:12px;background:var(--m-card)}
.cons.low{border-color:var(--m-warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--m-warn) 18%,transparent)}
.chead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.chead .pn{font-size:15px}
.chead .tot{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chead .tot .n{font-size:18px;font-weight:700}
.ctr{margin-top:10px;border-top:1px dashed var(--m-line);container-type:inline-size}
.crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,2fr) 80px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--m-line);font-size:13px}
.crow:last-child{border-bottom:0}
.crow .cl{font-weight:600;min-width:0;overflow-wrap:anywhere;font-family:var(--m-mono)}
.crow .loc,.crow .rd{color:var(--m-muted);min-width:0;overflow-wrap:anywhere}
.crow .ft{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bar{display:block;height:10px;border-radius:999px;background:var(--m-card2);border:1px solid var(--m-line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--m-ok)}
.bar.lo i{background:var(--m-warn)}
@container (max-width:640px){
  .crow{grid-template-columns:minmax(0,1fr) auto}
  .crow .bar{grid-column:1/-1}
  .crow .rd{text-align:right}
  .crow .go{grid-column:1/-1}
  .crow .go .btn{width:100%}
}

/* ---------- timeline ---------- */
.tl{list-style:none;margin:0;padding:0;container-type:inline-size}
.tl li{display:grid;grid-template-columns:128px 90px 84px minmax(0,1fr);gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--m-line);font-size:13px;align-items:baseline}
.tl li:last-child{border-bottom:0}
.tl .when{color:var(--m-muted);font-size:12px;white-space:nowrap}
.tl .by{font-weight:600;overflow-wrap:anywhere}
.tl .what{min-width:0;overflow-wrap:anywhere}
.mv{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--m-muted)}
.mv.pick,.mv.transfer,.mv.checkout{color:var(--m-info-text)}
.mv.receive,.mv.checkin{color:var(--m-ok-text)}
.mv.reading,.mv.cut,.mv.adjust{color:var(--m-warn-text)}
@container (max-width:520px){
  .tl li{grid-template-columns:auto auto minmax(0,1fr)}
  .tl .what{grid-column:1/-1}
}

/* ---------- scan ---------- */
.scangrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.scangrid{grid-template-columns:minmax(0,1fr)}}
.cam{position:relative;height:280px;border-radius:calc(var(--m-radius) + 4px);overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#39424c 0,#1b2026 48%,#090a0c 100%)}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .box{position:absolute;left:14%;right:14%;top:22%;bottom:26%;border:2px solid rgba(255,255,255,.92);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.28);pointer-events:none}
.cam .laser{position:absolute;left:18%;right:18%;top:47%;height:2px;background:var(--m-accent);opacity:.9;pointer-events:none}
.cam .read{position:absolute;left:50%;bottom:30%;transform:translate(-50%,50%);font:600 11px var(--m-mono);background:rgba(0,0,0,.65);color:#fff;padding:2px 8px;border-radius:999px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.cam .camhint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12.5px;color:#fff;text-shadow:0 1px 2px #000;padding:0 10px}
.cam .torch{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.5);display:grid;place-items:center;color:#fff;cursor:pointer}
.cam .torch[aria-pressed="true"]{background:#fff;color:#1a2233}
.cam .torch svg{width:20px;height:20px}
.cam .startcam{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.camoff{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;padding:16px;text-align:center;color:#fff;font-size:14px}
.camoff p{margin:0;max-width:34ch}
.manual{display:flex;gap:8px;margin:10px 0 0}
.manual .fld{font-size:16px;font-family:var(--m-mono)}
.res{scroll-margin-top:70px}
.res .rk{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--m-muted);font-weight:600}
.res .rt{font-size:20px;font-weight:700;margin-top:4px;overflow-wrap:anywhere}
.res .rt.mono{font-size:22px}
.res .rm{font-size:13px;color:var(--m-muted);overflow-wrap:anywhere}
.res .rm b{color:var(--m-text)}
.bignum{display:flex;align-items:center;gap:10px}
.bignum .fld{font:700 40px/1 var(--m-font);font-variant-numeric:tabular-nums;height:66px;padding:0 14px;text-align:right;flex:1;min-width:0;border-width:2px;border-color:var(--m-accent)}
.bignum span{font-size:18px;color:var(--m-muted);font-weight:600}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.quick .btn{min-height:46px;padding:0 4px;font-size:16px;font-variant-numeric:tabular-nums}
.save{width:100%;min-height:52px;margin-top:12px;font-size:17px}
.onhand{list-style:none;margin:8px 0 0;padding:0}
.onhand li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--m-line);font-size:13.5px}
.onhand li:last-child{border-bottom:0}
.onhand li b{font-variant-numeric:tabular-nums}

/* ---------- toast + modal ---------- */
.toast{position:fixed;left:50%;top:66px;transform:translate(-50%,-8px);z-index:200;background:#1a2233;color:#fff;padding:10px 16px;border-radius:var(--m-radius);font-size:14px;font-weight:600;max-width:min(92vw,520px);text-align:center;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:#a82e29}
.modal{position:fixed;inset:0;z-index:100;background:rgba(15,20,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.mbox{background:var(--m-card);border-radius:10px;border:1px solid var(--m-line);width:100%;max-width:520px;min-width:0;box-shadow:0 12px 40px rgba(20,30,50,.25)}
.mbox.wide{max-width:920px}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--m-line)}
.mh b{font-size:16px;overflow-wrap:anywhere;min-width:0}
.mh .x{margin-left:auto;flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--m-line);background:var(--m-card2);font-size:20px;line-height:1;cursor:pointer}
.mbody{padding:14px 18px;min-width:0}
.mbox .btnrow.end{padding:0 18px 16px;margin-top:0}
.sect{margin-top:18px}
.sect:first-child{margin-top:0}
details.more{margin-top:12px}
details.more summary{cursor:pointer;font-weight:600;color:var(--m-accent);min-height:32px;display:flex;align-items:center}
.collist{list-style:none;margin:0;padding:0}
.collist li{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--m-line)}
.collist li .chk{flex:1;min-width:0}
.collist li .btn{min-width:38px;padding:0 8px}

/* ---------- labels print sheet ---------- */
#printSheet{display:none}
.lbl-pick{max-height:320px;overflow-y:auto;border:1px solid var(--m-line);border-radius:var(--m-radius);padding:4px 10px}
.sheet{background:#fff;color:#000;width:8.5in;height:11in;position:relative;overflow:hidden;page-break-after:always;break-after:page}
.sheet:last-child{page-break-after:auto;break-after:auto}
.sheet.s5160{padding:.5in .1875in 0;display:grid;grid-template-columns:repeat(3,2.625in);grid-auto-rows:1in;column-gap:.125in;align-content:start}
.sheet.s5163{padding:.5in .15625in 0;display:grid;grid-template-columns:repeat(2,4in);grid-auto-rows:2in;column-gap:.1875in;align-content:start}
.label{display:flex;align-items:center;gap:.08in;padding:.06in .1in;overflow:hidden;min-width:0}
.label svg{flex:none}
.s5160 .label svg{width:.82in;height:.82in}
.s5163 .label svg{width:1.6in;height:1.6in}
.label .lt{min-width:0;font-family:Arial,Helvetica,sans-serif;line-height:1.15}
.label .lt b{display:block;font-size:10pt;overflow:hidden;max-height:2.4em}
.s5163 .label .lt b{font-size:15pt}
.label .lt span{display:block;font-family:Consolas,"Courier New",monospace;font-size:7pt;overflow-wrap:anywhere;margin-top:2px}
.s5163 .label .lt span{font-size:9pt}
.label .lt small{display:block;font-size:7.5pt;margin-top:2px}
.s5163 .label .lt small{font-size:10pt}
body.preview #app,body.preview #signin,body.preview .demobar{display:none!important}
body.preview #printSheet{display:block;background:var(--m-bg2);padding:64px 12px 24px;overflow-x:auto}
body.preview #printSheet .sheet{margin:0 auto 16px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.pvbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:var(--m-card);border-bottom:1px solid var(--m-line)}
.pvbar span{font-size:13px;color:var(--m-muted)}
@media (max-width:900px){body.preview #printSheet .sheet{zoom:.42}}
@media print{
  @page{size:letter;margin:0}
  body{background:#fff}
  #app,#signin,.demobar,.toast,#modalRoot,.pvbar,#board{display:none!important}
  #printSheet,body.preview #printSheet{display:block!important;padding:0!important;background:#fff!important}
  body.preview #printSheet .sheet{margin:0!important;box-shadow:none!important;zoom:1!important}
}

/* ---------- pick tickets (0.2.0) ---------- */
.mv.stage,.mv.deliver{color:var(--m-info-text)}
.mv.return{color:var(--m-ok-text)}
/* Ledger motif: area headers are a ruled line, not a filled band */
.tbl tr.grp td{background:transparent;border-bottom:1.5px solid var(--m-text);padding:16px 0 6px;font-weight:700;font-size:13.5px;overflow-wrap:anywhere}
.tbl tbody tr.grp:first-child td{padding-top:6px}
.tbl tr.grp td span{font-weight:400;color:var(--m-muted);margin-left:8px;font-size:12px}
.crumb{font-size:12px;color:var(--m-muted);margin-bottom:4px}
.tkrow{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.tktitle{margin:0;font-size:24px;font-weight:700;line-height:1.2}
.tkbtns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.prog{display:flex;height:10px;border-radius:999px;background:var(--m-card2);border:1px solid var(--m-line);overflow:hidden;margin:14px 0 6px}
.prog i{display:block;height:100%}
.prog .p1{background:var(--m-ok)}
.prog .p2{background:var(--m-warn);opacity:.55}
.pkey{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--m-muted)}
.pkey span{display:inline-flex;align-items:center;gap:6px}
.pkey i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mini{display:flex;align-items:center;gap:8px;white-space:nowrap}
.mini .bar{width:64px;flex:none;height:8px}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
pre.note{margin:0;background:var(--m-card2);border:1px solid var(--m-line);border-radius:var(--m-radius);padding:12px 14px;font:12.5px/1.55 var(--m-mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--m-text)}
.chip.new{border-style:dashed}
.chip.new i{background:var(--m-accent)}
.chip.bad{border-color:color-mix(in srgb,var(--m-danger) 50%,var(--m-line));color:var(--m-bad-text)}
.chip.bad i{background:var(--m-danger)}
.lnote{font-size:12.5px;margin-top:4px;padding-left:8px;border-left:2px solid var(--m-line2);overflow-wrap:anywhere}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:0 14px;align-items:end;margin-bottom:12px}
.filters .chk{margin-top:10px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--m-line2);border-radius:var(--m-radius);padding:18px 12px;text-align:center;background:var(--m-card2)}
.drop.over{border-color:var(--m-accent);background:color-mix(in srgb,var(--m-accent) 8%,var(--m-card))}
.drop p{margin:0;color:var(--m-muted);font-size:13px}
.step{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font-size:14px;font-weight:700}
.step:first-child{margin-top:4px}
.step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--m-accent);color:var(--m-onaccent);font-size:12px;flex:none}
.hline{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) 84px auto;gap:6px 8px;align-items:end;padding:8px 0;border-bottom:1px dashed var(--m-line)}
.hline .lab{margin-top:0}
.hline .x{min-width:38px;padding:0 8px}
.hline .mch{grid-column:1/-1}
@media (max-width:640px){.hline{grid-template-columns:minmax(0,1fr) 84px}.hline .hp{grid-column:1/-1}}
.pickunits{max-height:220px;overflow-y:auto;border:1px solid var(--m-line);border-radius:var(--m-radius);padding:2px 10px;margin-top:6px}
.radio{display:flex;align-items:flex-start;gap:10px;min-height:38px;cursor:pointer;padding:6px 0}
.radio input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--m-accent)}
.forticket{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--m-line);border-radius:999px;padding:3px 4px 3px 12px;background:var(--m-card2);margin-top:10px;max-width:100%}
.forticket label{font-size:12px;font-weight:600;color:var(--m-muted)}
.forticket select.fld{flex:1 1 180px;min-width:0;width:auto;border-radius:999px;min-height:32px}

/* ---------- ticket print (pick list) ---------- */
.picksheet{background:#fff;color:#000;max-width:8.5in;margin:0 auto;padding:.5in;font:11pt/1.35 Arial,Helvetica,sans-serif;page:pick}
.picksheet h1{font-size:18pt;margin:0 0 4px}
.picksheet .pmeta{display:flex;flex-wrap:wrap;gap:4px 24px;font-size:10pt;margin-bottom:12px}
.picksheet table{width:100%;border-collapse:collapse;font-size:10pt}
.picksheet th{text-align:left;border-bottom:1.5px solid #000;padding:4px;font-size:9pt;text-transform:uppercase;letter-spacing:.04em}
.picksheet td{border-bottom:1px solid #999;padding:5px 4px;vertical-align:top;overflow-wrap:anywhere}
.picksheet td.r,.picksheet th.r{text-align:right}
.picksheet tr.ga td{font-weight:700;border-bottom:1.5px solid #000;padding-top:10px}
.picksheet .box{display:inline-block;width:12px;height:12px;border:1.5px solid #000}
.picksheet .sign{margin-top:24px;display:flex;flex-wrap:wrap;gap:12px 40px;font-size:10pt}
@page pick{size:letter;margin:.4in}
@media print{.picksheet{padding:0;max-width:none}}
body.preview #printSheet .picksheet{box-shadow:0 2px 10px rgba(0,0,0,.15)}
@media (max-width:640px){body.preview #printSheet .picksheet{padding:16px;font-size:10pt}}

/* ---------- wall board (?board=1, role board) ----------
   Read from three to five meters: 30px lines, 44px counts, 24px headers.
   Dark by default because the TV sits in a dim corner by the bays; every
   text color below was checked at 4.5:1 or better on --b-bg and --b-card. */
#board{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;overflow:hidden;cursor:none;background:var(--b-bg);color:var(--b-text);font-family:var(--m-font)}
#board[data-theme="dark"]{--b-bg:#0e1116;--b-card:#161b22;--b-line:#2b333d;--b-text:#f2f5f8;--b-muted:#aab4c0;--b-dim:#97a2ae;--b-amber:#f2b34a;--b-red:#ff8a80;--b-ok:#5fd39a;color-scheme:dark}
#board[data-theme="light"]{--b-bg:#f4f6f9;--b-card:#ffffff;--b-line:#c7d0da;--b-text:#1a2233;--b-muted:#4f5a68;--b-dim:#5b6675;--b-amber:#8a5a14;--b-red:#a82e29;--b-ok:#166b3e;color-scheme:light}
.bd-rot{flex:none;height:6px;background:var(--b-line)}
.bd-rot i{display:block;height:100%;width:0;background:var(--b-muted)}
.bd-live{flex:none;background:#a82e29;color:#fff;font-size:24px;font-weight:700;padding:10px 40px}
.bd-main{flex:1;min-height:0;display:flex;flex-direction:column;padding:22px 40px 0}
.bd-head{flex:none;display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 28px}
.bd-client{font-size:40px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.bd-sub{font-size:24px;color:var(--b-muted);overflow-wrap:anywhere}
.bd-sub .mono{font-family:var(--m-mono)}
.bd-bay{margin-left:auto;text-align:right;font-size:24px;color:var(--b-muted)}
.bd-bay b{display:block;font-size:44px;color:var(--b-text);line-height:1.1}
.bd-count{flex:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:14px 0 8px;font-size:24px;color:var(--b-muted)}
.bd-count b{font-size:44px;color:var(--b-text);font-variant-numeric:tabular-nums}
.bd-bar{flex:none;height:16px;border-radius:999px;background:var(--b-line);overflow:hidden}
.bd-bar i{display:block;height:100%;background:var(--b-ok)}
.bd-list{flex:1;min-height:0;overflow:hidden;margin-top:12px;padding-bottom:24px}
.bd-grp{font:700 24px var(--m-mono);color:var(--b-muted);border-bottom:2px solid var(--b-line);padding:16px 0 6px;overflow-wrap:anywhere}
.bd-line{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:4px 24px;align-items:center;padding:12px 0;border-bottom:1px solid var(--b-line)}
.bd-st{font-size:24px;font-weight:700;display:flex;align-items:center;gap:8px}
.bd-st svg{width:28px;height:28px;flex:none}
.bd-name{font-size:30px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.bd-meta{font-size:24px;color:var(--b-muted);overflow-wrap:anywhere}
.bd-qty{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bd-qty small{font-size:24px;font-weight:600}
.bd-line.picked .bd-st,.bd-line.picked .bd-name,.bd-line.picked .bd-qty,.bd-line.picked .bd-meta{color:var(--b-dim)}
.bd-line.amber .bd-st,.bd-line.amber .bd-qty{color:var(--b-amber)}
.bd-line.red .bd-st,.bd-line.red .bd-qty{color:var(--b-red)}
.bd-line .bd-also{color:var(--b-amber)}
.bd-line .bd-also.red{color:var(--b-red)}
.bd-idle{flex:1;min-height:0;overflow:hidden auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:16px;text-align:center;padding:24px}
.bd-idle svg.mark{width:96px;height:96px;color:var(--b-muted)}
.bd-idle h1{margin:0;font-size:56px}
.bd-idle p{margin:0;font-size:30px;color:var(--b-muted);max-width:28ch}
.bd-clock{font-size:96px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.bd-low{list-style:none;margin:8px 0 0;padding:0;font-size:30px;width:min(100%,900px)}
.bd-low li{display:flex;justify-content:space-between;gap:24px;padding:10px 0;border-bottom:1px solid var(--b-line);text-align:left}
.bd-low li b{color:var(--b-amber);white-space:nowrap}
@media (max-width:760px){
  .bd-main{padding:14px 16px 0}
  .bd-live{padding:8px 16px;font-size:18px}
  .bd-client{font-size:28px}.bd-sub,.bd-bay,.bd-count,.bd-meta,.bd-st,.bd-grp{font-size:18px}
  .bd-bay{margin-left:0;text-align:left}.bd-bay b,.bd-count b,.bd-qty{font-size:30px}
  .bd-name{font-size:22px}
  .bd-line{grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}
  .bd-line .bd-st{grid-column:1/-1}
  .bd-idle h1{font-size:36px}.bd-idle p,.bd-low{font-size:20px}.bd-clock{font-size:64px}
}

/* ---------- phone ---------- */
@media (max-width:640px){
  .top{padding:8px 12px;min-height:54px;gap:6px 10px}
  .nav,.who .em{display:none}
  .body{padding:12px;padding-bottom:96px}
  .foot{padding-bottom:96px}
  .mcard{padding:14px}
  .fld{font-size:16px}
  /* thumbs, not cursors: every control grows to the 44px floor on the phone */
  .btn,.btn.sm,.fld,select.fld,.seg button,.chk,.textbtn,.linkbtn,.gbtn,.locchip button,.mh .x,details.more summary,.demobar a,.radio,.forticket select.fld{min-height:44px}
  .linkbtn{display:flex;align-items:center;width:100%}
  .locchip button,.mh .x{min-width:44px}
  .tbl th .thb{min-height:44px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--m-card);border-top:1px solid var(--m-line);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--m-muted);background:none;border:0;padding:4px 0;cursor:pointer;min-height:52px}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.on{color:var(--m-accent);font-weight:600}
  .tabbar button.scan svg{width:42px;height:42px;padding:9px;border-radius:50%;margin-top:-16px;background:var(--m-card2);border:1px solid var(--m-line)}
  .tabbar button.scan.on svg{background:var(--m-accent);color:var(--m-onaccent);border-color:var(--m-accent)}
  .modal{padding:12px 8px}
  .mbody{padding:12px 14px}
  .mh{padding:10px 14px}
  .cam{height:230px}
  .toast{top:60px}
}
</style>
</head>

    s.onerror = () => { _xlsxPromise = null; reject(new Error("Could not load the spreadsheet reader. Check your connection.")); };
    document.head.appendChild(s);
  });
  return _xlsxPromise;
}

/* ---------------- QR (vendored qrcode-generator in qr.js) ---------------- */
function qrSvg(text) {
  if (typeof window.qrcode !== "function") return '<svg viewBox="0 0 10 10"><text x="0" y="6" font-size="3">QR</text></svg>';
  const q = window.qrcode(0, "M"); q.addData(text); q.make();
  const n = q.getModuleCount(), m = 2; let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += "M" + (c + m) + " " + (r + m) + "h1v1h-1z";
  return '<svg viewBox="0 0 ' + (n + m * 2) + " " + (n + m * 2) + '" shape-rendering="crispEdges" aria-hidden="true"><rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}
const PAYLOAD = { loc: id => "loadout:loc:" + id, ctr: id => "loadout:ctr:" + id, item: id => "loadout:item:" + id, prod: id => "loadout:prod:" + id };

/* ==============================================================
   DATA LAYER
   One surface for both stores. Writes are lists of ops:
     {op:"set"|"update", coll, id, data, merge}  and  {op:"add", coll, data}
   with INC(n) and NOW as placeholders. The demo store refuses every
   write; the Firestore store sends one batch per list (the persistent
   cache queues it while offline, and the sync pill counts it).
   ============================================================== */
const INC = n => ({ __inc: n });
const NOW = { __now: true };
let fb = null;      // { fs, db, auth, authMod }
let DB = null;

function demoStore() {
  return {
    start() { loadDemo(); COLLS.forEach(c => S.loaded[c] = true); scheduleRender(); },
    stop() {},
    /* every write is refused; the last refused batch is kept on the demo
       hook (window.Loadout.state.lastOps) so a script can check what a
       button would have written */
    commit(ops, what) { S.lastOps = ops; S.lastWhat = what || ""; toast("Demo mode: not saved"); return Promise.resolve(false); },
    async getAll(coll) {
      const key = coll.replace("loadout_", "");
      if (key === "movements") return S.movements.slice();
      if (key === "settings") return [Object.assign({ id: "general" }, S.general), Object.assign({ id: "board" }, S.board)];
      if (key === "ticket_lines") { const out = []; S.lines.forEach((m, tid) => m.forEach(l => out.push(Object.assign({ ticketId: tid }, l)))); return out; }
      const m = S[key]; return m ? Array.from(m.values()) : [];
    },
    async movementsWhere(field, id) { return S.movements.filter(m => m[field] === id); },
    syncLines() {},
    async savePrefs() { /* demo keeps layout in memory and this browser only */ }
  };
}

function firestoreStore(user) {
  const fs = fb.fs, db = fb.db;
  let unsubs = [];
  function conv(data) {
    const out = {};
    Object.keys(data).forEach(k => {
      const v = data[k];
      if (v && typeof v === "object" && v.__inc != null) out[k] = fs.increment(v.__inc);
      else if (v === NOW) out[k] = fs.serverTimestamp();
      else out[k] = v;
    });
    return out;
  }
  function listen(name, q, onDocs, meta) {
    S.loaded[name] = false; S.errors[name] = null;
    const u = fs.onSnapshot(q, { includeMetadataChanges: !!meta }, snap => {
      S.loaded[name] = true; S.errors[name] = null;
      if (meta) setLive(!snap.metadata.fromCache);
      onDocs(snap.docs.map(d => Object.assign({ id: d.id }, d.data({ serverTimestamps: "estimate" }))));
      paintSync(); scheduleRender();
    }, err => {
      console.warn("Listener failed for " + name + ":", err);
      S.errors[name] = err; S.loaded[name] = true; setLive(false); paintSync(); scheduleRender();
    });
    unsubs.push(u);
  }
  /* Ticket lines live in a subcollection per ticket. Every ticket that is
     not closed gets a listener (the board, Scan, and the list need them);
     a closed ticket's lines load while it is open on screen. Pending
     writes mark the line so the row can show a "pending" chip. */
  const lineUnsubs = new Map();
  function syncLines() {
    const want = new Set();
    S.tickets.forEach(t => { if (t.status !== "closed") want.add(t.id); });
    if (S.ticketId) want.add(S.ticketId);
    lineUnsubs.forEach((u, id) => { if (!want.has(id)) { try { u(); } catch (e) {} lineUnsubs.delete(id); S.lines.delete(id); S.linesLoaded.delete(id); } });
    want.forEach(id => {
      if (lineUnsubs.has(id)) return;
      const u = fs.onSnapshot(fs.collection(db, "loadout_tickets", id, "lines"), { includeMetadataChanges: true }, snap => {
        const m = new Map();
        snap.docs.forEach(d => m.set(d.id, Object.assign({ id: d.id, _pending: d.metadata.hasPendingWrites }, d.data({ serverTimestamps: "estimate" }))));
        S.lines.set(id, m); S.linesLoaded.add(id); S.errors.lines = null;
        scheduleRender();
      }, err => { console.warn("Lines listener failed for ticket " + id + ":", err); S.errors.lines = err; S.linesLoaded.add(id); setLive(false); scheduleRender(); });
      lineUnsubs.set(id, u);
    });
  }
  const toMap = (key) => docs => { const m = new Map(); docs.forEach(d => m.set(d.id, d)); S[key] = m; _lastMv = null; };
  return {
    start() {
      listen("products", fs.collection(db, "loadout_products"), toMap("products"));
      listen("locations", fs.collection(db, "loadout_locations"), toMap("locations"));
      listen("stock", fs.collection(db, "loadout_stock"), toMap("stock"));
      listen("containers", fs.collection(db, "loadout_containers"), toMap("containers"));
      listen("items", fs.collection(db, "loadout_items"), toMap("items"));
      listen("users", fs.collection(db, "loadout_users"), docs => { toMap("users")(docs); const me = S.users.get(user.uid); if (me) setMe(me); });
      listen("settings", fs.collection(db, "loadout_settings"), docs => {
        const g = docs.find(d => d.id === "general");
        S.general = Object.assign({}, DEFAULT_GENERAL, g || {});
        S.general.boxStart = Object.assign({}, DEFAULT_GENERAL.boxStart, (g && g.boxStart) || {});
        S.board = Object.assign({}, DEFAULT_BOARD, docs.find(d => d.id === "board") || {});
        S.importMap = docs.find(d => d.id === "importMap") || null;
      });
      listen("movements", fs.query(fs.collection(db, "loadout_movements"), fs.orderBy("at", "desc"), fs.limit(500)), docs => { S.movements = docs; _lastMv = null; });
      listen("clients", fs.collection(db, "loadout_clients"), toMap("clients"));
      listen("jobs", fs.collection(db, "loadout_jobs"), toMap("jobs"));
      listen("proposals", fs.collection(db, "loadout_proposals"), toMap("proposals"));
      listen("tickets", fs.collection(db, "loadout_tickets"), docs => { toMap("tickets")(docs); syncLines(); }, true);
    },
    stop() { unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = []; lineUnsubs.forEach(u => { try { u(); } catch (e) {} }); lineUnsubs.clear(); },
    syncLines,
    retry(name) { this.stop(); this.start(); },
    commit(ops, what) {
      if (!ops.length) return Promise.resolve(true);
      const batch = fs.writeBatch(db);
      ops.forEach(o => {
        if (o.op === "add") { batch.set(fs.doc(fs.collection(db, o.coll)), conv(o.data)); return; }
        const ref = fs.doc(db, o.coll, o.id);
        if (o.op === "set") batch.set(ref, conv(o.data), o.merge ? { merge: true } : {});
        else batch.update(ref, conv(o.data));
      });
      S.pending++; paintSync();
      return batch.commit().then(() => true).catch(err => {
        console.warn("Write failed:", what, err);
        toast("Could not save " + (what || "that change") + ". Try again.", true);
        return false;
      }).finally(() => { S.pending = Math.max(0, S.pending - 1); paintSync(); });
    },
    async getAll(coll) {
      if (coll === "loadout_ticket_lines") {
        /* lines sit under each ticket; the export flattens them into one tab with the ticket id beside each */
        const out = [];
        const ts = await fs.getDocs(fs.collection(db, "loadout_tickets"));
        for (const t of ts.docs) { const ls = await fs.getDocs(fs.collection(db, "loadout_tickets", t.id, "lines")); ls.docs.forEach(d => out.push(Object.assign({ id: d.id, ticketId: t.id }, d.data()))); }
        return out;
      }
      const snap = await fs.getDocs(fs.collection(db, coll));
      return snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    },
    async movementsWhere(field, id) {
      const snap = await fs.getDocs(fs.query(fs.collection(db, "loadout_movements"), fs.where(field, "==", id)));
      return snap.docs.map(d => Object.assign({ id: d.id }, d.data({ serverTimestamps: "estimate" })));
    },
    async savePrefs(prefs) {
      try { await fs.setDoc(fs.doc(db, "users", user.uid), { loadoutLayout: prefs }, { merge: true }); }
      catch (e) { console.warn("Layout not saved:", e); }
    }
  };
}

      fromLocationId: f.fromLocationId || null, fromLocationName: f.fromLocationId ? (f.fromLocationName || locName(f.fromLocationId)) : null,
      toLocationId: f.toLocationId || null, toLocationName: f.toLocationId ? (f.toLocationName || locName(f.toLocationId)) : null,
      cut: f.cut || null,

      jobName: f.jobName || null,

async function doReceiveUnits(p, locId, qty, cost, serialize, serials, note) {
  const ops = [];
  if (serialize) {
    for (let i = 0; i < qty; i++) {
      const id = rid() + i;
      const serial = (serials[i] || "").trim() || null;
      ops.push({ op: "set", coll: "loadout_items", id, data: {
        productId: p.id, productName: productName(p), serial, cost: cost == null ? null : cost, qr: PAYLOAD.item(id),
        status: "in_stock", locationId: locId, locationName: locName(locId), holderUid: null, holderName: null,
        jobId: null, jobName: null, ticketId: null, ticketLineId: null, checkedOutAt: null, checkedInAt: null, condition: "good",
        orderId: null, shipmentId: null, createdAt: NOW, updatedAt: NOW } });

async function doBox(c, markNow, cut, recount, jobName, note, locId, tk) {
  /* tk = {ticket, line}: the box sheet's For ticket chip. The cut is tagged
     with the ticket, and the feet count as staged on the ticket's line for
     this product when it has one. */
  const tkf = tk && tk.ticket ? { ticketId: tk.ticket.id, ticketNumber: tk.ticket.number, ticketLineId: tk.line ? tk.line.id : null } : {};
  if (tk && tk.ticket && !jobName) jobName = tk.ticket.jobName || null;
  const p = S.products.get(c.productId);
  const prevFt = num(c.ftLeft);
  const data = { ftLeft: markNow, lastMark: markNow, status: markNow <= 0 ? "empty" : "open", lastReadingAt: NOW, lastReadingBy: S.user.name };
  if (locId && locId !== c.locationId) { data.locationId = locId; data.locationName = locName(locId); data.confirmLocation = false; }
  else if (locId) data.confirmLocation = false;
  const ops = [{ op: "update", coll: "loadout_containers", id: c.id, data }];
  const delta = markNow - prevFt;
  if (recount) {
    ops.push(mv("reading", Object.assign({ productId: c.productId, containerId: c.id, containerLabel: c.label, qty: delta, toLocationId: locId || c.locationId, jobName, note: "recount" + (note ? ". " + note : "") }, tkf)));
  } else {
    const from = num(c.lastMark != null ? c.lastMark : c.ftLeft);
    ops.push(mv("cut", Object.assign({ productId: c.productId, containerId: c.id, containerLabel: c.label, qty: -cut, toLocationId: locId || c.locationId,
      cut: { fromMark: from, toMark: markNow, length: cut }, jobName, note: (markNow <= 0 ? "Box emptied. " : "") + (note || "") }, tkf)));
    if (tk && tk.ticket && tk.line && cut > 0) ops.push(...lineBumpOps(tk.ticket, tk.line, { qtyStaged: cut }));
  }
  if (delta !== 0 && p) ops.push(productInc(p.id, delta));
  return DB.commit(ops, (recount ? "Reading" : "Cut") + " on box " + c.label);
}

/* ==============================================================
   PICK TICKETS (0.2.0): clients, jobs, proposals, tickets, lines
   Quantities on a line, all in the product's unit:
     qtyNeeded     from the proposal
     qtyFromStock  pulled off our own shelves (Pull from stock)
     qtyToOrder    what stock cannot cover: needed - staged - what is
                   still on the shelves; recomputed when a writer saves
     qtyStaged     laid out in the bay (a pull, Stage, or a box cut)
     qtyDelivered  taken to site (Deliver to site)
   The ticket's status and summary are line counts, rewritten in the
   same batch as every line change.
   ============================================================== */
const linesColl = tid => "loadout_tickets/" + tid + "/lines";
function ticketLines(tid) { const m = S.lines.get(tid); return m ? Array.from(m.values()).sort((a, b) => num(a.sort) - num(b.sort) || String(a.id).localeCompare(String(b.id))) : []; }
function lineProduct(l) { return l && l.productId ? S.products.get(l.productId) || null : null; }
function lineName(l) { const p = lineProduct(l); if (p) return productName(p); return l.productName || [l.brand, l.model].filter(Boolean).join(" ") || l.description || "Unnamed line"; }
function lineIsFt(l) { const p = lineProduct(l); return p ? p.unit === "ft" : /^(ft|feet|foot)$/i.test(String(l.unit || "")); }
function lqty(l, n) { return fmtN(n) + (lineIsFt(l) ? " ft" : ""); }
const lineDone = (l, f) => num(l[f]) >= num(l.qtyNeeded);
const lineLeft = l => Math.max(0, num(l.qtyNeeded) - num(l.qtyStaged));
function summarize(lines) {
  return { lines: lines.length, needed: lines.filter(l => num(l.qtyNeeded) > 0).length,
    fromStock: lines.filter(l => num(l.qtyFromStock) > 0).length, toOrder: lines.filter(l => num(l.qtyToOrder) > 0).length,
    staged: lines.filter(l => lineDone(l, "qtyStaged")).length, delivered: lines.filter(l => lineDone(l, "qtyDelivered")).length };
}
function statusFrom(lines, cur) {
  if (cur === "closed") return "closed";
  if (!lines.length) return "open";
  if (lines.every(l => lineDone(l, "qtyDelivered"))) return "delivered";
  if (lines.every(l => lineDone(l, "qtyStaged"))) return "staged";
  if (lines.some(l => num(l.qtyStaged) > 0)) return "picking";
  return "open";
}
function tkSummary(t) { return S.linesLoaded.has(t.id) ? summarize(ticketLines(t.id)) : Object.assign({ lines: 0, needed: 0, fromStock: 0, toOrder: 0, staged: 0, delivered: 0 }, t.summary || {}); }
function tkStatus(t) { return t.status === "closed" ? "closed" : S.linesLoaded.has(t.id) ? statusFrom(ticketLines(t.id), t.status) : (t.status || "open"); }
const openTickets = () => Array.from(S.tickets.values()).filter(t => t.status !== "closed").sort((a, b) => (toDate(b.createdAt) || 0) - (toDate(a.createdAt) || 0));
function tkBay(t) { return t && t.stagingLocationId ? locName(t.stagingLocationId) : ""; }
function tkWho(t) { return [t.clientName, t.jobName].filter(Boolean).join(", "); }
function tkBaseFields(t, l) { return { ticketId: t.id, ticketNumber: t.number, ticketLineId: l ? l.id : null, jobName: t.jobName || null }; }
/* stock a line can still be pulled from: shelves and areas, never a bay or a van */
function pullableLoc(id) { const L = S.locations.get(id); return !L || (L.kind !== "bay" && L.kind !== "van"); }
function availableFor(p) {
  if (!p) return 0;
  let n = 0;
  stockRowsFor(p.id).forEach(r => { if (pullableLoc(r.locationId) && num(r.qty) > 0) n += num(r.qty); });
  openBoxesFor(p.id).forEach(c => { if (pullableLoc(c.locationId)) n += num(c.ftLeft); });
  itemsFor(p.id).forEach(i => { if (i.status === "in_stock" && pullableLoc(i.locationId)) n += 1; });
  return n;
}
/* where a product can be pulled from, default location first, then the most stock */
function pullSources(p) {
  const m = new Map();
  const get = id => { if (!m.has(id)) m.set(id, { locationId: id, qty: 0, counted: 0, items: [], boxes: [] }); return m.get(id); };
  stockRowsFor(p.id).forEach(r => { if (r.locationId && pullableLoc(r.locationId) && num(r.qty) > 0) { const e = get(r.locationId); e.qty += num(r.qty); e.counted += num(r.qty); } });
  itemsFor(p.id).forEach(i => { if (i.status === "in_stock" && i.locationId && pullableLoc(i.locationId)) { const e = get(i.locationId); e.qty += 1; e.items.push(i); } });
  openBoxesFor(p.id).forEach(c => { if (pullableLoc(c.locationId)) { const e = get(c.locationId || ""); e.qty += num(c.ftLeft); e.boxes.push(c); } });
  return Array.from(m.values()).filter(e => e.qty > 0).sort((a, b) => (b.locationId === p.defaultLocationId) - (a.locationId === p.defaultLocationId) || b.qty - a.qty);
}
function toOrderFor(l, p, staged, avail) { return Math.max(0, num(l.qtyNeeded) - staged - (p ? Math.max(0, avail) : 0)); }
function ticketStatusOp(t, lines, extra) {
  return { op: "update", coll: "loadout_tickets", id: t.id, data: Object.assign({ status: statusFrom(lines, t.status), summary: summarize(lines), updatedAt: NOW }, extra || {}) };
}
/* collects line changes for one ticket and closes with one ticket update */
function tkBatch(t) {
  const cur = new Map(ticketLines(t.id).map(l => [l.id, Object.assign({}, l)]));
  const ops = [];
  return {
    ops,
    bump(l, d, extra) {
      const y = cur.get(l.id) || Object.assign({}, l); cur.set(l.id, y);
      const data = { updatedAt: NOW };
      Object.keys(d).forEach(k => { if (d[k]) { data[k] = INC(d[k]); y[k] = num(y[k]) + num(d[k]); } });
      const ex = typeof extra === "function" ? extra(y) : extra;
      if (ex) { Object.assign(data, ex); Object.assign(y, ex); }
      ops.push({ op: "update", coll: linesColl(t.id), id: l.id, data });
    },
    finish(extra) { ops.push(ticketStatusOp(t, Array.from(cur.values()), extra)); return ops; }
  };
}
function lineBumpOps(t, l, d) { const b = tkBatch(t); b.bump(l, d); return b.finish(); }
/* Firestore takes 500 writes a batch; large closes and imports go in chunks.
   The demo store keeps the whole list in one refused batch so it can be read back. */
async function commitChunks(ops, what) {
  if (DEMO || ops.length <= 450) return DB.commit(ops, what);
  for (let i = 0; i < ops.length; i += 450) { if (!(await DB.commit(ops.slice(i, i + 450), what))) return false; }
  return true;
}

/* o = {from, qty, items: [unit records], box: container, bayId} */
async function doPull(t, l, o) {
  const p = lineProduct(l), bay = o.bayId || t.stagingLocationId, tf = tkBaseFields(t, l);
  const b = tkBatch(t), ops = b.ops, q = o.qty;
  if (o.box) {
    const c = o.box, from = num(c.lastMark != null ? c.lastMark : c.ftLeft), mark = from - q;
    ops.push({ op: "update", coll: "loadout_containers", id: c.id, data: { ftLeft: mark, lastMark: mark, status: mark <= 0 ? "empty" : "open", lastReadingAt: NOW, lastReadingBy: S.user.name } });
    ops.push(mv("cut", Object.assign({ productId: p.id, containerId: c.id, containerLabel: c.label, qty: -q, toLocationId: c.locationId, cut: { fromMark: from, toMark: mark, length: q }, note: "Pulled from stock" }, tf)));
    ops.push(productInc(p.id, -q));
  } else {
    const counted = q - o.items.length;
    if (counted > 0) {
      ops.push(stockInc(p, o.from, -counted), stockInc(p, bay, counted));
      ops.push(mv("pick", Object.assign({ productId: p.id, qty: counted, fromLocationId: o.from, toLocationId: bay, note: null }, tf)));
    }
    o.items.forEach(it => {
      ops.push({ op: "update", coll: "loadout_items", id: it.id, data: { status: "staged", locationId: bay, locationName: locName(bay), ticketId: t.id, ticketLineId: l.id, jobId: t.jobId || null, jobName: t.jobName || null, updatedAt: NOW } });
      ops.push(mv("pick", Object.assign({ productId: p.id, itemId: it.id, itemLabel: itemLabel(it), qty: 1, fromLocationId: it.locationId, toLocationId: bay, note: null }, tf)));
    });
  }
  const avail = availableFor(p) - q;
  b.bump(l, { qtyFromStock: q, qtyStaged: q }, y => ({ qtyToOrder: toOrderFor(y, p, num(y.qtyStaged), avail),
    pickedFromName: o.box ? "Box " + o.box.label : locName(o.from), pickedByName: S.user.name, pickedAt: NOW }));
  const extra = !t.stagingLocationId && bay ? { stagingLocationId: bay, stagingLocationName: locName(bay) } : null;
  return commitChunks(b.finish(extra), "Pull on " + lineName(l));
}
async function doStage(t, l, q, note) {
  const b = tkBatch(t);
  b.ops.push(mv("stage", Object.assign({ productId: l.productId || null, productName: lineName(l), qty: q, toLocationId: t.stagingLocationId || null, note: note || "Laid out in the bay" }, tkBaseFields(t, l))));
  b.bump(l, { qtyStaged: q });

}
/* Deliver to site: what is staged and not yet delivered leaves the bay.
   Serialized units on the line check out to the person delivering, so a
   van load of five access points is five records in one tap (PLAN 8b). */
function deliverPlan(t, l) {
  const p = lineProduct(l), q = Math.max(0, num(l.qtyStaged) - num(l.qtyDelivered));
  const items = Array.from(S.items.values()).filter(i => i.ticketId === t.id && i.ticketLineId === l.id && i.status === "staged");
  const bay = t.stagingLocationId;
  const counted = p && p.unit !== "ft" && bay ? Math.min(Math.max(0, q - items.length), stockQty(p, bay)) : 0;
  return { p, q, items, counted, bay };
}
async function doDeliver(t, l) {
  const d = deliverPlan(t, l); if (d.q <= 0) return false;
  const me = { uid: S.user.uid, name: S.user.name }, tf = tkBaseFields(t, l), b = tkBatch(t), ops = b.ops;
  d.items.forEach(it => {
    ops.push({ op: "update", coll: "loadout_items", id: it.id, data: { status: "checked_out", holderUid: me.uid, holderName: me.name, jobId: t.jobId || null, jobName: t.jobName || null,
      ticketId: t.id, ticketLineId: l.id, locationId: null, locationName: null, checkedOutAt: NOW, updatedAt: NOW } });
    ops.push(mv("checkout", Object.assign({ productId: it.productId, itemId: it.id, itemLabel: itemLabel(it), qty: 1, fromLocationId: it.locationId, holderUid: me.uid, holderName: me.name, note: "Delivered to site" }, tf)));
  });
  if (d.counted > 0) ops.push(stockInc(d.p, d.bay, -d.counted));
  const off = d.items.length + d.counted;
  if (d.p && off > 0) ops.push(productInc(d.p.id, -off));
  ops.push(mv("deliver", Object.assign({ productId: l.productId || null, productName: lineName(l), qty: d.q, fromLocationId: d.bay || null, holderUid: me.uid, holderName: me.name,
    note: d.items.length ? d.items.length + " serialized unit" + (d.items.length > 1 ? "s" : "") + " checked out to " + me.name : null }, tf)));
  b.bump(l, { qtyDelivered: d.q });
  return DB.commit(b.finish(), "Deliver on " + lineName(l));
}
async function doLineNote(t, l, text) {

/* Close: leftovers in the bay go back to a shelf or are written off, and
   every unit still out on this ticket becomes installed at the job. */
function closeLeftovers(t) {
  const bay = t.stagingLocationId;
  return ticketLines(t.id).map(l => {
    const p = lineProduct(l); if (!p) return null;
    const items = Array.from(S.items.values()).filter(i => i.ticketId === t.id && i.ticketLineId === l.id && i.status === "staged");
    const left = Math.max(0, num(l.qtyStaged) - num(l.qtyDelivered));
    const counted = p.unit === "ft" || !bay ? 0 : Math.min(Math.max(0, left - items.length), stockQty(p, bay));
    return items.length || counted ? { line: l, p, items, counted } : null;
  }).filter(Boolean);
}
const installsFor = t => Array.from(S.items.values()).filter(i => i.ticketId === t.id && i.status === "checked_out");
async function doClose(t, o) {
  const bay = t.stagingLocationId, ops = [], lo = closeLeftovers(t), drop = new Map();
  const tf = l => tkBaseFields(t, l), ret = o.mode === "return";
  const less = (pid, n) => drop.set(pid, (drop.get(pid) || 0) + n);
  lo.forEach(x => {
    if (x.counted > 0) {
      ops.push(stockInc(x.p, bay, -x.counted));
      if (ret) { ops.push(stockInc(x.p, o.locId, x.counted)); ops.push(mv("return", Object.assign({ productId: x.p.id, qty: x.counted, fromLocationId: bay, toLocationId: o.locId, note: "Leftover from ticket #" + t.number + ", back to stock" }, tf(x.line)))); }
      else { less(x.p.id, x.counted); ops.push(mv("adjust", Object.assign({ productId: x.p.id, qty: -x.counted, fromLocationId: bay, note: "Written off at close of ticket #" + t.number + ": " + o.reason }, tf(x.line)))); }
    }
    x.items.forEach(it => {
      if (ret) {
        ops.push({ op: "update", coll: "loadout_items", id: it.id, data: { status: "in_stock", locationId: o.locId, locationName: locName(o.locId), ticketId: null, ticketLineId: null, jobId: null, jobName: null, updatedAt: NOW } });
        ops.push(mv("return", Object.assign({ productId: it.productId, itemId: it.id, itemLabel: itemLabel(it), qty: 1, fromLocationId: it.locationId, toLocationId: o.locId, note: "Leftover from ticket #" + t.number + ", back to stock" }, tf(x.line))));
      } else {
        less(it.productId, 1);
        ops.push({ op: "update", coll: "loadout_items", id: it.id, data: { status: "retired", locationId: null, locationName: null, retiredReason: o.reason, updatedAt: NOW } });
        ops.push(mv("adjust", Object.assign({ productId: it.productId, itemId: it.id, itemLabel: itemLabel(it), qty: -1, fromLocationId: it.locationId, note: "Written off at close of ticket #" + t.number + ": " + o.reason }, tf(x.line))));
      }
    });
  });
  installsFor(t).forEach(it => {
    ops.push({ op: "update", coll: "loadout_items", id: it.id, data: { status: "installed", locationId: null, locationName: null, jobId: t.jobId || null, jobName: t.jobName || null, updatedAt: NOW } });
    ops.push(mv("adjust", Object.assign({ productId: it.productId, itemId: it.id, itemLabel: itemLabel(it), qty: 0, holderName: it.holderName, note: "Installed at " + (t.jobName || "the job") + " (ticket #" + t.number + " closed)" }, tf({ id: it.ticketLineId }))));
  });
  drop.forEach((n, pid) => ops.push(productInc(pid, -n)));
  ops.push(mv("edit", Object.assign({ note: "Ticket #" + t.number + " closed" + (lo.length ? ", leftovers " + (ret ? "returned to " + locName(o.locId) : "written off: " + o.reason) : "") + (o.note ? ". " + o.note : "") }, tf(null))));
  ops.push({ op: "update", coll: "loadout_tickets", id: t.id, data: { status: "closed", summary: summarize(ticketLines(t.id)), closedAt: NOW, closedBy: S.user.email, closedByName: S.user.name, closeNote: o.note || null, updatedAt: NOW } });
  return commitChunks(ops, "Close of ticket #" + t.number);
}

/* Copy for Portal (PLAN 6, T0): a status block to paste into the proposal's internal notes */
function wrap80(s) {
  const out = []; let line = "";
  s.split(/\s+/).forEach(w => { if (line && (line + " " + w).length > 80) { out.push(line); line = w; } else line = line ? line + " " + w : w; });
  if (line) out.push(line);
  return out.join("\n");
}
function portalBlock(t) {
  const d = new Date(), lines = ticketLines(t.id), s = summarize(lines);
  const stamp = isoDay(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  const head = "[Loadout " + stamp + "] Pick ticket #" + t.number + " - " + (tkWho(t) || "no client");
  const bits = ["Staged " + s.staged + "/" + s.lines + " lines" + (t.stagingLocationId ? " in " + tkBay(t) : "") + ".", "Delivered " + s.delivered + "/" + s.lines + "."];
  const order = lines.filter(l => num(l.qtyToOrder) > 0);
  if (order.length) bits.push("To order: " + order.length + " line" + (order.length > 1 ? "s" : "") + ", no PO yet: " + order.map(l => lineName(l) + " x" + fmtN(l.qtyToOrder) + (lineIsFt(l) ? " ft" : "")).join(", ") + ".");
  else if (lines.length) bits.push("Nothing to order.");
  if (t.status === "closed") bits.push("Closed " + fmtDate(t.closedAt) + ".");
  return head + "\n" + wrap80(bits.join(" "));
}

}

const TABLES = {};
function layoutKey() { return "loadout.layout." + (S.user ? S.user.uid : "anon"); }

function savePrefs() {

function visibleCols(id, cols) {
  const pr = S.prefs[id];

    const v = pr.cols.map(k => cols.find(c => c.k === k)).filter(Boolean);
    if (v.length) return v;

}
function sortRows(id, cols, rows, defaultSort) {
  const pr = S.prefs[id] || {};

  const out = rows.slice();
  if (col) {
    const dir = pr.sortDir === "desc" ? -1 : 1;
    const g = col.sort || col.text || (() => "");
    out.sort((a, b) => {
      let x = g(a), y = g(b);
      if (x == null || x === "") return 1; if (y == null || y === "") return -1;
      if (x instanceof Date) x = x.getTime(); if (y instanceof Date) y = y.getTime();
      if (typeof x === "number" && typeof y === "number") return (x - y) * dir;
      return String(x).localeCompare(String(y), undefined, { numeric: true, sensitivity: "base" }) * dir;
    });

  return out;
}
function tableHTML(id, cols, rows, opts = {}) {

    } else { clientId = I.client; clientNm = (S.clients.get(clientId) || {}).name || ""; }

    if (I.job === "__new") {
      jobNm = clean(I.newJob); if (!jobNm) { err("Type the new job's name."); return; }
      jobId = clientId + "--" + slug(jobNm);
      if (S.jobs.has(jobId)) { err("That job already exists for " + clientNm + ". Pick it from the list."); return; }
      ops.push({ op: "set", coll: "loadout_jobs", id: jobId, data: { clientId, clientName: clientNm, name: jobNm, address: clean(I.newAddr), status: "open", stagingLocationId: I.bay || null, stagingLocationName: I.bay ? locName(I.bay) : null, createdAt: NOW, updatedAt: NOW } });

      if (pid && !S.products.has(pid) && !ops.some(o => o.coll === "loadout_products" && o.id === pid)) {
        const ft = l.unit === "ft", name = composeName({ brand: l.brand, model: l.model });
        ops.push({ op: "set", coll: "loadout_products", id: pid, data: { brand: l.brand, model: l.model, name, kind: ft ? "wire" : "device", unit: ft ? "ft" : "each", type: l.itemType || "", category: "", description: l.description || "",
          upc: null, consumable: ft, parLevel: null, defaultLocationId: null, portalItemId: l.portalItemId || null, imageUrl: null, onHand: 0, lastCountAt: null, createdAt: NOW, updatedAt: NOW } });

      const y = Object.assign({}, old, { qtyNeeded: l.qtyNeeded }); y.qtyToOrder = state === "new" ? Math.max(0, l.qtyNeeded - num(old.qtyStaged)) : toOrderFor(y, p, num(old.qtyStaged), availableFor(p));

    source, createdAt: NOW, createdBy: S.user.email, createdByName: S.user.name, updatedAt: NOW, summary: summarize(allLines) } });
  if (clean(I.proposal) && !addTo) ops.push({ op: "set", coll: "loadout_proposals", id: slug(I.proposal), merge: true, data: { number: clean(I.proposal), name: I.proposalName || jobNm || null, jobId, jobName: jobNm, clientId, clientName: clientNm, importedAt: NOW, importSource: source, portalId: null } });
  if (I.tab === "csv" && I.headers.length) {
    const cols = {}; IMP_FIELDS.forEach(f => { const i = I.map[f.k]; if (i != null && i >= 0) cols[I.headers[i]] = f.k; });
    const saved = (S.importMap && S.importMap.columns) || {};

/* ==============================================================
   SCAN VIEW
   The camera shell is built once; only the result card re-renders,
   so the video stream and anything being typed survive data updates.
   ============================================================== */
const TORCH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8l-2 7h-4z"/><path d="M10 9v11a2 2 0 0 0 4 0V9"/></svg>';
const CAM = { stream: null, track: null, timer: null, still: null, reader: null, last: "", lastAt: 0, torch: false };
function renderScan() {
  const el = $("#v-scan");
  if (!el.dataset.built) {
    el.dataset.built = "1";
    el.innerHTML = '<div class="scangrid"><div class="mcard"><div class="thead"><h2 class="vt">Scan</h2><span class="sp" id="locChipWrap"></span></div>' +
      '<div class="cam" id="cam"></div>' +
      '<form class="manual" id="manualForm" autocomplete="off"><label class="sr" for="manualCode">Code</label><input class="fld" id="manualCode" placeholder="UPC, model, box label, or QR text" title="For a torn label or no camera. Type a UPC, a model like U6-Pro, a box label like A826, or the line printed under a QR."><button type="submit" class="btn acc">Look up</button></form>' +
      '<p class="hint" id="upcPending" hidden></p></div>' +
      '<div class="mcard res" id="scanResult" aria-live="polite"></div></div>';
    $("#manualForm").addEventListener("submit", e => { e.preventDefault(); const v = $("#manualCode").value.trim(); if (v) { route(v); $("#manualCode").value = ""; } });
    paintCam("idle");
    paintScanResult();
  }
  paintLocChip();
  if (S.retryCode && S.loaded.products && !S.errors.products) { const code = S.retryCode; S.retryCode = null; route(code); }
  const up = $("#upcPending");
  if (S.pendingUpcFor && S.products.get(S.pendingUpcFor)) { up.hidden = false; up.innerHTML = "Waiting for a barcode to set as the UPC of <b>" + esc(productName(S.products.get(S.pendingUpcFor))) + '</b>. <button type="button" class="textbtn" data-act="cancelUpc">Cancel</button>'; }
  else up.hidden = true;
  if (!CAM.stream && !CAM.starting) autoStartCamera();
}
function paintLocChip() {
  const w = $("#locChipWrap"); if (!w) return;
  w.innerHTML = S.activeLoc && S.locations.get(S.activeLoc)
    ? '<span class="locchip" title="Active location, set by scanning a shelf or bay label. Receive, Count, and Check in start here."><b>' + esc(locName(S.activeLoc)) + '</b><button type="button" data-act="clearLoc" aria-label="Clear the active location">&times;</button></span>'
    : '<span class="hint" style="margin:0">Scan a shelf label to set the location</span>';
}
function setActiveLoc(id) { S.activeLoc = id; try { sessionStorage.setItem("loadout.activeLoc", id || ""); } catch (e) {} paintLocChip(); }
function paintCam(state, msg) {
  const cam = $("#cam"); if (!cam) return;
  if (state === "on") {
    cam.innerHTML = '<video id="camVideo" playsinline muted></video><div class="box"></div><div class="laser"></div><span class="read" id="camRead" hidden></span>' +
      '<button type="button" class="torch" id="torchBtn" aria-pressed="false" aria-label="Torch" title="Torch" hidden>' + TORCH_SVG + '</button><span class="camhint" id="camHint">Point at a UPC or a Loadout label</span>';
    $("#torchBtn").addEventListener("click", toggleTorch);
  } else if (state === "off") {
    cam.innerHTML = '<div class="camoff"><p>' + esc(msg || "Camera is off. Allow it in the browser, or type the code below.") + '</p><button type="button" class="btn" data-act="startCam">Try the camera again</button></div>';
  } else {
    cam.innerHTML = '<div class="camoff"><p>Scan UPCs on boxes and Loadout QR labels with the phone camera.</p><button type="button" class="btn acc" data-act="startCam">Start camera</button></div>';
  }
}
async function autoStartCamera() {
  try {
    if (navigator.permissions && navigator.permissions.query) {
      const st = await navigator.permissions.query({ name: "camera" });
      if (st.state === "granted") startCamera();
      else if (st.state === "denied") { paintCam("off"); }
    }
  } catch (e) { /* Safari has no camera permission query; wait for the button */ }
}
async function startCamera() {
  if (CAM.stream || CAM.starting) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { paintCam("off", "Camera is off. This browser has no camera access here. Type the code below."); focusManual(); return; }
  CAM.starting = true;
  try {
    CAM.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
  } catch (e) {
    CAM.starting = false; CAM.stream = null; paintCam("off"); focusManual(); return;
  }
  CAM.starting = false;
  if (S.view !== "scan") { stopCamera(); return; }
  paintCam("on");
  const v = $("#camVideo"); v.srcObject = CAM.stream;
  try { await v.play(); } catch (e) {}
  CAM.track = CAM.stream.getVideoTracks()[0];
  try { const caps = CAM.track.getCapabilities ? CAM.track.getCapabilities() : {}; if (caps.torch) $("#torchBtn").hidden = false; } catch (e) {}
  armStill();
  if ("BarcodeDetector" in window) {
    let formats = ["qr_code", "ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39"];
    try { const sup = await window.BarcodeDetector.getSupportedFormats(); formats = formats.filter(f => sup.includes(f)); } catch (e) {}
    const det = new window.BarcodeDetector({ formats });
    CAM.timer = setInterval(async () => {
      if (!v.videoWidth) return;
      try { const r = await det.detect(v); if (r && r[0]) onCode(r[0].rawValue); } catch (e) {}
    }, 280);
  } else {
    try {
      await loadScript(ZXING_URL);
      const Z = window.ZXing;
      const reader = new Z.BrowserMultiFormatReader();
      CAM.reader = reader;
      const cb = (res) => { if (res) onCode(res.getText ? res.getText() : res.text); };
      if (typeof reader.decodeFromStream === "function") reader.decodeFromStream(CAM.stream, v, cb);
      else reader.decodeFromVideoElementContinuously(v, cb);
    } catch (e) { paintCam("off", "Camera is on but this browser cannot read barcodes. Type the code below."); stopCamera(true); focusManual(); }
  }
}
function armStill() {
  clearTimeout(CAM.still);
  const h = $("#camHint"); if (h) h.textContent = "Point at a UPC or a Loadout label";
  CAM.still = setTimeout(() => { const h2 = $("#camHint"); if (h2) h2.textContent = "Still looking. Hold steady, or type the code below."; }, 6000);
}
function stopCamera(keepCard) {
  clearInterval(CAM.timer); CAM.timer = null; clearTimeout(CAM.still);
  if (CAM.reader) { try { CAM.reader.reset(); } catch (e) {} CAM.reader = null; }
  if (CAM.stream) { CAM.stream.getTracks().forEach(t => t.stop()); CAM.stream = null; }
  CAM.track = null; CAM.torch = false;
  if (!keepCard && $("#cam")) paintCam("idle");
}
async function toggleTorch() {
  if (!CAM.track) return;
  CAM.torch = !CAM.torch;
  try { await CAM.track.applyConstraints({ advanced: [{ torch: CAM.torch }] }); $("#torchBtn").setAttribute("aria-pressed", String(CAM.torch)); }
  catch (e) { CAM.torch = false; toast("The torch is not available on this camera.", true); }
}
function focusManual() { const m = $("#manualCode"); if (m) setTimeout(() => m.focus(), 50); }
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load failed")); document.head.appendChild(s); });
}
function onCode(raw) {
  const code = String(raw || "").trim(); if (!code) return;
  const now = Date.now();
  if (code === CAM.last && now - CAM.lastAt < 3000) return;
  CAM.last = code; CAM.lastAt = now;
  try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {}
  const r = $("#camRead"); if (r) { r.textContent = code; r.hidden = false; }
  armStill();
  route(code);
}

/* routing on the payload prefix; a plain code is a UPC, model, or box label */
function route(code) {
  const m = /^loadout:(loc|ctr|item|prod):(.+)$/i.exec(code.trim());
  if (S.pendingUpcFor && !m) { confirmUpc(S.pendingUpcFor, code); return; }
  if (!S.loaded.products || S.errors.products) { S.scan = { kind: "retry", code }; paintScanResult(); return; }
  if (m) {
    const kind = m[1].toLowerCase(), id = m[2];
    if (kind === "loc") {
      if (S.locations.get(id)) { setActiveLoc(id); S.scan = { kind: "loc", id }; }
      else S.scan = { kind: "unknown", code };
    } else if (kind === "ctr") S.scan = S.containers.get(id) ? { kind: "ctr", id } : { kind: "unknown", code };
    else if (kind === "item") S.scan = S.items.get(id) ? { kind: "item", id } : { kind: "unknown", code };
