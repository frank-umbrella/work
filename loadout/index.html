    if (kind === "splitter") Object.assign(d, { connector1: clean(rec.c1) || null, inputs: numOrText(rec.inputs), connector2: clean(rec.c2) || null, outputs: numOrText(rec.outputs) });
    if (kind === "connector") Object.assign(d, { sex: clean(rec.sex) || null, band: clean(rec.band) || null, pins: numOrText(rec.pins) });
    if (kind === "device") Object.assign(d, { description: clean(rec.description) || "", color: normColor(rec.color) || null });
    const pid = productIdFor(d);
    if (!pid || (!type && !make && !part)) { skip("Not enough detail to name a product"); return; }
    d.name = composeName(d);
    const qv = rec.qty == null || clean(rec.qty) === "" ? 0 : Number(clean(rec.qty));
    if (!Number.isFinite(qv) || qv < 0) { skip("Quantity is not a number"); return; }
    if (clean(rec.qty) === "") warnings.push("Tab " + rec.tab + " row " + rec.row + " has no quantity; it imports as 0.");
    let locId = locFor(rec.area, rec.shelf, rec);
    if (!locId) { locId = "unassigned"; if (!locations.has("unassigned")) locations.set("unassigned", { id: "unassigned", area: "Unassigned", shelf: "", kind: "other", name: "Unassigned", isNew: !S.locations.has("unassigned") }); warnings.push("Tab " + rec.tab + " row " + rec.row + " has no area; it goes to Unassigned."); }
    if (!date) { if (rec.date != null && clean(rec.date)) unknownDates++; }
    const pe = putProduct(pid, d, rec, date);
    const cond = clean(rec.condition);
    if (kind === "device" && cond) {
      const c = "good";
      const have = Array.from(S.items.values()).filter(i => i.productId === pid && String(i.id).startsWith("imp-")).length;
      const base = itemCounter.get(pid) || 0;
      for (let n = 0; n < qv; n++) {
        const k = base + n + 1;
        if (k <= have) continue;
        itemsNew.push({ id: "imp-" + pid + "-" + k, productId: pid, productName: d.name, locationId: locId, condition: c, note: "Condition on the sheet: " + cond, tab: rec.tab, row: rec.row, date });
      }
      itemCounter.set(pid, base + qv);
      if (base + qv < have) warnings.push(d.name + ": the sheet shows fewer units than were imported before. Nothing was retired; check them on the Items view.");
      rec.rep.used++;
      return;
    }
    const sid = pid + "__" + locId;
    if (stock.has(sid)) {
      const s = stock.get(sid); s.qty += qv; s.rows.push(rec.row);
      warnings.push("Tab " + rec.tab + " row " + rec.row + " is the same product and shelf as row " + s.rows[0] + "; the quantities are added together.");
    } else stock.set(sid, { id: sid, productId: pid, locationId: locId, qty: qv, rows: [rec.row], tab: rec.tab, date, prev: S.stock.has(sid) ? num(S.stock.get(sid).qty) : null });
    rec.rep.used++;
  });
  if (unknownDates) warnings.push(unknownDates + " dates were text such as Unknown; those fields are left empty.");

  /* movements: the audit trail starts from the sheet (one adjust per row the first time, then only for changed counts) */
  const note = (tab, row) => fileName + ", tab " + tab + " row " + row;
  stock.forEach(s => {
    const delta = s.qty - (s.prev || 0);
    if (s.prev == null || delta !== 0) movements.push({ productId: s.productId, qty: s.prev == null ? s.qty : delta, toLocationId: s.locationId, at: s.date, note: note(s.tab, s.rows[0]) + (s.prev != null ? ", count changed" : "") });
  });
  containers.forEach(c => {
    const delta = c.ftLeft - (c.prevFt || 0);
    if (c.isNew || delta !== 0) movements.push({ productId: c.productId, containerId: c.id, containerLabel: c.label, qty: c.isNew ? c.ftLeft : delta, toLocationId: c.locationId, at: c.asOf, note: note(c.tab, c.row) + (c.isNew ? "" : ", feet left changed") });
  });
  itemsNew.forEach(i => movements.push({ productId: i.productId, itemId: i.id, itemLabel: shortId(i.id), qty: 1, toLocationId: i.locationId, at: i.date, note: note(i.tab, i.row) + ". " + i.note }));

  const boxes = Array.from(containers.values());
  const counts = {
    tabs: tabs.filter(t => t.kind && t.kind !== "skip").length, tabsTotal: tabs.length,
    rowsRead: tabs.reduce((a, t) => a + t.rows, 0), rowsUsed: tabs.reduce((a, t) => a + t.used, 0), blank: tabs.reduce((a, t) => a + t.blank, 0),
    skipped: tabs.reduce((a, t) => a + t.skipped.length, 0),
    productsNew: Array.from(products.values()).filter(p => p.isNew).length, productsUpd: Array.from(products.values()).filter(p => !p.isNew).length,
    locationsNew: Array.from(locations.values()).filter(l => l.isNew).length, locations: locations.size,
    boxes: boxes.length, boxesOpen: boxes.filter(b => b.status === "open").length, boxesEmpty: boxes.filter(b => b.status === "empty").length, boxesNoLoc: boxes.filter(b => b.confirmLocation).length,
    boxesNew: boxes.filter(b => b.isNew).length, stockRows: stock.size, items: itemsNew.length, movements: movements.length, vendors: vendors.length
  };
  return { tabs, products, locations, stock, containers, itemsNew, movements, vendors: Array.from(new Set(vendors)), grades, aliasRows, warnings, counts, fileName };
}

function importOps(plan) {
  const ops = [];
  plan.locations.forEach(l => { if (l.isNew) ops.push({ op: "set", coll: "loadout_locations", id: l.id, merge: true, data: { area: l.area, shelf: l.shelf, kind: l.kind, name: l.name, qr: PAYLOAD.loc(l.id), jobId: null, createdAt: NOW, updatedAt: NOW } }); });
  /* on-hand recomputed from scratch for every product the sheet touches */
  const onHand = new Map();
  plan.products.forEach(p => {
    let n = 0;
    S.stock.forEach(r => { if (r.productId === p.id && !plan.stock.has(r.id)) n += num(r.qty); });
    plan.stock.forEach(r => { if (r.productId === p.id) n += r.qty; });
    S.containers.forEach(c => { if (c.productId === p.id && !plan.containers.has(c.id) && c.status !== "empty") n += num(c.ftLeft); });
    plan.containers.forEach(c => { if (c.productId === p.id && c.status !== "empty") n += c.ftLeft; });
    S.items.forEach(i => { if (i.productId === p.id && inStockItem(i)) n += 1; });
    plan.itemsNew.forEach(i => { if (i.productId === p.id) n += 1; });
    onHand.set(p.id, n);
  });
  plan.products.forEach(p => {
    const d = Object.assign({}, p.data);
    if (!p.isNew) { delete d.consumable; }
    Object.keys(d).forEach(k => { if (d[k] === undefined) d[k] = null; });
    ops.push({ op: "set", coll: "loadout_products", id: p.id, merge: true, data: Object.assign(d, { onHand: onHand.get(p.id) || 0, lastCountAt: p.lastCountAt || null, updatedAt: NOW },
      p.isNew ? { upc: null, parLevel: null, defaultLocationId: null, portalItemId: null, imageUrl: null, createdAt: NOW } : {}) });
  });
  const pname = id => (plan.products.get(id) || {}).data ? plan.products.get(id).data.name : productName(S.products.get(id));
  const lname = id => id ? (plan.locations.get(id) ? plan.locations.get(id).name : locName(id)) : null;
  plan.stock.forEach(s => ops.push({ op: "set", coll: "loadout_stock", id: s.id, merge: true, data: { productId: s.productId, productName: pname(s.productId), locationId: s.locationId, locationName: lname(s.locationId), qty: s.qty, updatedAt: NOW } }));
  plan.containers.forEach(c => ops.push({ op: "set", coll: "loadout_containers", id: c.id, merge: true, data: Object.assign({
    productId: c.productId, productName: c.productName, locationId: c.locationId, locationName: lname(c.locationId), label: c.label, startLength: c.startLength,
    ftLeft: c.ftLeft, lastMark: c.ftLeft, status: c.status, confirmLocation: c.confirmLocation, purchasedAt: c.purchasedAt || null, qr: PAYLOAD.ctr(c.id),
    lastReadingAt: c.asOf || NOW, lastReadingBy: "Import", pickTicketId: null, updatedAt: NOW }, c.isNew ? { createdAt: NOW, upc: null } : {}) }));
  plan.itemsNew.forEach(i => ops.push({ op: "set", coll: "loadout_items", id: i.id, data: {
    productId: i.productId, productName: i.productName, serial: null, cost: null, qr: PAYLOAD.item(i.id), status: "in_stock", locationId: i.locationId, locationName: lname(i.locationId),
    holderUid: null, holderName: null, jobId: null, jobName: null, ticketId: null, ticketLineId: null, checkedOutAt: null, checkedInAt: null, condition: i.condition,
    orderId: null, shipmentId: null, importNote: i.note, createdAt: NOW, updatedAt: NOW } }));
  plan.movements.forEach(m => ops.push(mv("adjust", Object.assign({}, m, { productName: pname(m.productId), toLocationName: lname(m.toLocationId), byName: "Import", at: m.at || NOW }))));
  if (plan.vendors.length) {
    const merged = Array.from(new Set((S.general.vendors || []).concat(plan.vendors)));
    ops.push({ op: "set", coll: "loadout_settings", id: "general", merge: true, data: { vendors: merged, updatedBy: S.user.email, updatedByName: S.user.name, updatedAt: NOW } });
  }
  return ops;
}

async function importLoad(buf, fileName) {
  const XLSX = await ensureXLSX();
  const wb = XLSX.read(buf, { type: "array", cellDates: true });
  const mapping = {};
  wb.SheetNames.forEach(n => { mapping[n] = TAB_DEFAULTS[n.trim().toLowerCase()] || ""; });
  S.imp = { fileName, wb, mapping, aliases: {}, plan: null };
  S.imp.plan = buildImportPlan(S.imp);
  if (S.view === "more" && S.moreTab === "import") render(true);
  return S.imp.plan;
}

function bindImport(el) {
  const f = $("#impFile", el);
  const pick = $("#impPick", el);
  pick.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); f.click(); } });
  f.addEventListener("change", async () => {
    const file = f.files && f.files[0]; if (!file) return;
    $("#impBusy", el).hidden = false;
    try { await importLoad(await file.arrayBuffer(), file.name); }
    catch (e) { console.warn(e); toast("Could not read that file: " + (e.message || e), true); $("#impBusy", el).hidden = true; }
  });
  $$("select[data-imptab]", el).forEach(s => s.addEventListener("change", () => { S.imp.mapping[s.dataset.imptab] = s.value; collectAliases(el); S.imp.plan = buildImportPlan(S.imp); render(true); }));
}
function collectAliases(el) { $$("input[data-alias]", el).forEach(i => S.imp.aliases[i.dataset.alias] = i.value.trim()); }
async function runImport() {
  const pl = S.imp.plan, ops = importOps(pl);
  if (DEMO) { toast("Demo mode: not saved"); return; }
  const chunks = []; for (let i = 0; i < ops.length; i += 450) chunks.push(ops.slice(i, i + 450));
  let done = 0;
  for (const ch of chunks) {
    toast("Writing " + fmtN(done + ch.length) + " of " + fmtN(ops.length));
    const ok = await DB.commit(ch, "import batch");
    if (!ok) { toast("Import stopped after " + fmtN(done) + " writes. Run it again; it picks up where it left off.", true); return; }
    done += ch.length;
  }
  toast("Imported. " + fmtN(pl.counts.productsNew) + " new products, " + fmtN(pl.counts.boxes) + " boxes.");
  S.imp = null; render(true);
}

    case "tkCopy": { const t = curTicket(); if (t) copyText(portalBlock(t), "Copy for Portal"); break; }
    case "tkPrint": { const t = curTicket(); if (t) printTicket(t); break; }
    case "tkBoard": { const t = curTicket(); if (!t) break; const on = !(S.board.ticketIds || []).includes(t.id); doBoardPin(t, on).then(ok => ok && toast(on ? "Ticket #" + t.number + " is on the board" : "Ticket #" + t.number + " is off the board")); break; }
    case "tkClose": { const t = curTicket(); if (t) openClose(t); break; }
    case "tkPullAll": { const t = curTicket(); if (t) openPullAll(t); break; }
    case "tkAddLines": { const t = curTicket(); if (t) openNewTicket({ ticket: t, tab: "hand" }); break; }
    case "tkAddCsv": { const t = curTicket(); if (t) openNewTicket({ ticket: t, tab: "csv" }); break; }
    case "lnPull": { const t = curTicket(), l = curLine(id); if (t && l) openPull(t, l); break; }
    case "lnStage": { const t = curTicket(), l = curLine(id); if (t && l) openStage(t, l); break; }
    case "lnDeliver": { const t = curTicket(), l = curLine(id); if (t && l) deliverLine(t, l); break; }
    case "lnNote": { const t = curTicket(), l = curLine(id); if (t && l) openLineNote(t, l); break; }
    case "pickFor": openPickFor(P()); break;
    case "stageFor": { const it = I(); if (it) openPickFor(S.products.get(it.productId) || { id: it.productId, name: it.productName }, it); break; }
    case "newClient": openClientForm(null); break;
    case "editClient": openClientForm(S.clients.get(id)); break;
    case "archClient": { const c = S.clients.get(id); if (c) doSaveClient(c.id, { name: c.name, notes: c.notes || "", archived: !c.archived }, false).then(ok => ok && toast(c.archived ? "Client restored" : "Client archived")); break; }
    case "newJob": openJobForm(null); break;
    case "editJob": openJobForm(S.jobs.get(id)); break;
    case "archJob": { const j = S.jobs.get(id); if (j) doSaveJob(j.id, { clientId: j.clientId, clientName: j.clientName, name: j.name, address: j.address || "", status: j.status === "closed" ? "open" : "closed", stagingLocationId: j.stagingLocationId || null, stagingLocationName: j.stagingLocationName || null }, false, j.stagingLocationId).then(ok => ok && toast(j.status === "closed" ? "Job reopened" : "Job archived")); break; }
    case "bdPin": { readBoardForm(); const v = $("#bdAdd") && $("#bdAdd").value; if (!v) { toast("Pick a ticket to pin.", true); break; } S.boardDraft.ticketIds.push(v); render(true); break; }
    case "bdReset": S.boardDraft = null; render(true); toast("Back to the saved settings"); break;
    case "bdSave": {
      readBoardForm(); const d = S.boardDraft, e = $("#bdErr");
      if (!(d.rotateSec >= 5 && d.rotateSec <= 600)) { e.textContent = "Rotation must be between 5 and 600 seconds."; e.hidden = false; break; }
      DB.commit([{ op: "set", coll: "loadout_settings", id: "board", merge: true, data: { mode: d.mode, ticketIds: d.ticketIds.slice(), rotateSec: d.rotateSec, groupBy: d.groupBy, showStaged: d.showStaged, theme: d.theme, updatedAt: NOW, updatedBy: S.user.email, updatedByName: S.user.name } }], "board settings").then(ok => ok && toast("Board settings saved"));
      break;
    }
    case "impGo": collectAliases($("#v-more")); S.imp.plan = buildImportPlan(S.imp);
      confirmModal("Import " + S.imp.fileName, "<p>Write " + fmtN(importOps(S.imp.plan).length) + " records: " + fmtN(S.imp.plan.counts.productsNew) + " new products, " + fmtN(S.imp.plan.counts.boxes) + " boxes, " + fmtN(S.imp.plan.counts.items) + " serialized units, and " + fmtN(S.imp.plan.counts.movements) + " movements by Import. Safe to run again later.</p>", "Import", runImport);
      break;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "stockSearch") { S.search = t.value; scheduleRender(); }
  else if (t.dataset && t.dataset.mf) { S.mvFilter[t.dataset.mf] = t.value; scheduleRender(); }
  else if (t.id === "lblQ") { S.labelQ = t.value; scheduleRender(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.mf && t.tagName === "SELECT") { S.mvFilter[t.dataset.mf] = t.value; scheduleRender(); }
  else if (t.dataset && t.dataset.lbl) { t.checked ? S.labelSel.add(t.dataset.lbl) : S.labelSel.delete(t.dataset.lbl); render(true); }
  else if (t.id === "lblSize") { S.labelSize = t.value; }
  else if (t.dataset && t.dataset.tf) { S.tkFilter[t.dataset.tf] = t.type === "checkbox" ? t.checked : t.value; render(true); }
  else if (t.id === "showArch") { S.showArchived = t.checked; render(true); }
  else if (t.id === "lblEmpty") { S.labelEmpty = t.checked; render(true); }
});
window.addEventListener("hashchange", () => applyHash());
function applyHash() {
  const [v, sub0] = location.hash.replace(/^#/, "").split("/");
  const sub = sub0 ? decodeURIComponent(sub0) : sub0;
  if (["tickets", "ticket", "stock", "scan", "items", "more"].includes(v)) {
    if (sub && v === "stock") S.stockTab = sub; if (sub && v === "more") S.moreTab = sub; if (sub && v === "items") S.itemsTab = sub;
    if (v === "ticket") { S.ticketId = sub || null; if (DB) DB.syncLines(); }
    if (S.view === "scan" && v !== "scan") stopCamera();
    S.view = v; render(true);
  }
}

/* ==============================================================
   BOOT
   ============================================================== */
function setMe(me) {
  S.me = me;
  const prev = S.role;
  S.role = me.active === false ? "none" : (me.role || "tech");
  $("#footRole").textContent = "Role: " + (ROLE_LABEL[S.role] || S.role);
  if (S.role === "board" && !BOARD) { enterBoard(); return; }
  if (prev !== S.role) { _moreBuilt = ""; render(true); }
}
function startApp(user) {
  S.user = user;
  loadLocalPrefs();
  try { S.activeLoc = sessionStorage.getItem("loadout.activeLoc") || null; } catch (e) {}
  $("#signin").style.display = "none";
  $("#app").hidden = false;
  $("#demoBar").hidden = !DEMO;
  $("#whoEmail").textContent = user.email;
  $("#footWho").textContent = (DEMO ? "Demo account: " : "Signed in as ") + user.email;
  $("#verBadge").textContent = "v" + VERSION; $("#footVer").textContent = "Loadout v" + VERSION;
  $("#footRole").textContent = "Role: " + (ROLE_LABEL[S.role] || S.role);
  DB = DEMO ? demoStore() : firestoreStore(user);
  DB.start();
  paintSync();
  if (BOARD || S.role === "board") { enterBoard(); return; }
  if (location.hash) applyHash(); else { S.view = matchMedia("(max-width:640px)").matches ? "scan" : "tickets"; render(true); }
  if (PRINT && DEMO) { S.labelSel = new Set(labelGroups().flatMap(g => g[1].map(x => x.key))); printLabels(Array.from(S.labelSel).map(k => { const i = k.indexOf(":"); return { kind: k.slice(0, i), id: k.slice(i + 1) }; })); }
}
function stopApp() {
  stopCamera(); if (DB) DB.stop(); DB = null;
  S.user = null; S.products = new Map(); S.locations = new Map(); S.stock = new Map(); S.containers = new Map(); S.items = new Map(); S.users = new Map(); S.movements = [];
  S.clients = new Map(); S.jobs = new Map(); S.proposals = new Map(); S.tickets = new Map(); S.lines = new Map(); S.linesLoaded = new Set(); S.tkHist = {};
  if (BOARD) { clearInterval(BD.tick); cancelAnimationFrame(BD.raf); $("#board").hidden = true; BOARD = QUERY.get("board") === "1"; }
  S.loaded = {}; S.errors = {}; S.scan = null; _moreBuilt = ""; const sc = $("#v-scan"); if (sc) { sc.innerHTML = ""; delete sc.dataset.built; }
  closeAllModals();
  $("#app").hidden = true;
  $("#signin").style.display = "flex";
}

if (DEMO) {
  /* No Firebase module is imported on this path, so nothing in demo mode can reach Firestore. */
  $("#signoutBtn").textContent = "Leave demo";
  $("#signoutBtn").addEventListener("click", () => { location.href = location.pathname; });
  /* ?demo=1&role=tech|warehouse|accounting|board shows that role's view; admin otherwise */
  const qr = QUERY.get("role"), demoRole = ["tech", "warehouse", "accounting", "board"].includes(qr) ? qr : "admin";
  S.role = demoRole;
  const demoName = { admin: "Warehouse", warehouse: "Warehouse", tech: "Tech", accounting: "Accounting", board: "Board" }[demoRole];
  startApp(demoRole === "tech" ? { uid: "demo-tech", email: "tech@example.com", name: "Tech" } : demoRole === "admin" ? { uid: "demo-warehouse", email: "warehouse@example.com", name: "Warehouse" } : { uid: "demo-" + demoRole, email: demoRole + "@example.com", name: demoName });
  S.me = S.users.get(S.user.uid) || { id: S.user.uid, role: demoRole, active: true };
} else {
  $("#signin").style.display = "flex";
  const mods = await Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-auth.js"), import(SDK + "firebase-firestore.js")]);
  const appMod = mods[0], authMod = mods[1], fsMod = mods[2];
  const fbApp = appMod.initializeApp(firebaseConfig);
  const auth = authMod.getAuth(fbApp);
  const db = fsMod.initializeFirestore(fbApp, { localCache: fsMod.persistentLocalCache({ tabManager: fsMod.persistentMultipleTabManager() }) });
  fb = { fs: fsMod, db, auth, authMod };

  $("#signinBtn").addEventListener("click", async () => {
    $("#signinErr").hidden = true;
    try {
      const provider = new authMod.GoogleAuthProvider();
      provider.setCustomParameters({ hd: ALLOWED_DOMAIN, prompt: "select_account" });
      await authMod.signInWithPopup(auth, provider);
    } catch (e) {
      $("#signinErr").textContent = "Sign-in failed: " + (e.message || e);
      $("#signinErr").hidden = false;
    }
  });
  $("#signoutBtn").addEventListener("click", () => authMod.signOut(auth));

  authMod.onAuthStateChanged(auth, async user => {
    if (!user) { stopApp(); return; }
    const email = (user.email || "").toLowerCase();
    if (!email.endsWith("@" + ALLOWED_DOMAIN)) {
      await authMod.signOut(auth);
      $("#signinErr").textContent = "Sign-in must be a @" + ALLOWED_DOMAIN + " account.";
      $("#signinErr").hidden = false;
      return;
    }
    const me = { uid: user.uid, email, name: user.displayName || email.split("@")[0] };
    /* roles: the first sign-in writes the person's own doc (admin only for the D2 account; everyone else tech, unconfirmed) */
    const ref = fsMod.doc(db, "loadout_users", user.uid);
    let role = "tech";
    try {
      const snap = await fsMod.getDoc(ref);
      if (!snap.exists()) {
        role = email === ADMIN_EMAIL ? "admin" : "tech";
        await fsMod.setDoc(ref, { email, name: me.name, role, active: true, confirmed: role === "admin", addedBy: "self-sign-in", addedAt: fsMod.serverTimestamp(), lastSeen: fsMod.serverTimestamp() });
      } else {
        const d = snap.data(); role = d.active === false ? "none" : (d.role || "tech");
        fsMod.updateDoc(ref, { lastSeen: fsMod.serverTimestamp(), name: me.name }).catch(() => {});
      }
    } catch (e) { console.warn("Could not read the roster; using tech until it loads.", e); }
    S.role = role;
    try { const pf = await fsMod.getDoc(fsMod.doc(db, "users", user.uid)); if (pf.exists() && pf.data().loadoutLayout) { S.user = me; loadLocalPrefs(); S.prefs = Object.assign({}, pf.data().loadoutLayout, S.prefs); } } catch (e) {}
    startApp(me);
    if (S.prefs && Object.keys(S.prefs).length) savePrefs();
  });
}

/* admins seed the staging bays and vans (D4, D5) once the locations have loaded */
setInterval(() => {
  if (DEMO || !S.user || !isAdmin() || S._seeded || !S.loaded.locations || S.errors.locations) return;
  S._seeded = true;
  const missing = SEED_LOCATIONS.filter(l => !S.locations.has(l.id));
  if (!missing.length) return;
  const ops = [];
  missing.forEach(l => {
    const name = composeLocName(l.area, l.shelf);
    ops.push({ op: "set", coll: "loadout_locations", id: l.id, merge: true, data: { area: l.area, shelf: l.shelf, kind: l.kind, name, qr: PAYLOAD.loc(l.id), jobId: null, createdAt: NOW, updatedAt: NOW } });
    ops.push(mv("edit", { toLocationId: l.id, toLocationName: name, note: "Location created (seeded bay or van)" }));
  });
  DB.commit(ops, "the staging bays and vans");
}, 1500);
</script>
